<!DOCTYPE html>
<html lang="cs" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elis NL – Pracovní nizozemština</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   TÉMATA
═══════════════════════════════════════════ */
[data-theme="light"] {
  --bg:       #f7f8fc;
  --bg2:      #ffffff;
  --bg3:      #eef1f8;
  --border:   #dde3f0;
  --border2:  #b8c6e0;
  --text:     #111827;
  --text2:    #374151;
  --text3:    #6b7280;
  --accent:   #2563eb;
  --accent2:  #1d4ed8;
  --good:     #15803d;
  --good-bg:  #dcfce7;
  --bad:      #dc2626;
  --bad-bg:   #fee2e2;
  --warn:     #b45309;
  --warn-bg:  #fef3c7;
  --card:     #ffffff;
  --shadow:   0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
  --shadow2:  0 2px 8px rgba(0,0,0,0.12);
  --tts:      #7c3aed;
  --orange:   #ea580c;
  --pill-bg:  #e0e9ff;
  --pill-txt: #1e40af;
}
[data-theme="dark"] {
  --bg:       #0d1117;
  --bg2:      #161b27;
  --bg3:      #1f2635;
  --border:   #2a3548;
  --border2:  #3d4f6e;
  --text:     #e8edf5;
  --text2:    #b0bcd4;
  --text3:    #6b7fa0;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --good:     #22c55e;
  --good-bg:  rgba(34,197,94,0.15);
  --bad:      #f87171;
  --bad-bg:   rgba(248,113,113,0.15);
  --warn:     #fbbf24;
  --warn-bg:  rgba(251,191,36,0.15);
  --card:     #161b27;
  --shadow:   0 2px 8px rgba(0,0,0,0.4);
  --shadow2:  0 4px 16px rgba(0,0,0,0.5);
  --tts:      #a78bfa;
  --orange:   #fb923c;
  --pill-bg:  rgba(59,130,246,0.2);
  --pill-txt: #93c5fd;
}
[data-theme="steel"] {
  --bg:       #e8ecf2;
  --bg2:      #f2f4f8;
  --bg3:      #dde2ec;
  --border:   #c4ccdb;
  --border2:  #8fa0bf;
  --text:     #1a2236;
  --text2:    #2d3f5c;
  --text3:    #5a6f8a;
  --accent:   #0f4c8a;
  --accent2:  #0a3d72;
  --good:     #0f6830;
  --good-bg:  #d4edda;
  --bad:      #c0392b;
  --bad-bg:   #fde8e6;
  --warn:     #8a5c00;
  --warn-bg:  #fef4d4;
  --card:     #f2f4f8;
  --shadow:   0 2px 6px rgba(0,0,0,0.1), 0 6px 20px rgba(0,0,0,0.08);
  --shadow2:  0 3px 10px rgba(0,0,0,0.15);
  --tts:      #5b2d8e;
  --orange:   #c04a00;
  --pill-bg:  #cfe0f8;
  --pill-txt: #0f3d72;
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  transition: background 0.25s, color 0.25s;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: none; }

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.app { max-width: 1280px; margin: 0 auto; padding: 16px; }

/* TOPBAR */
.topbar {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 16px;
  box-shadow: var(--shadow); margin-bottom: 16px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: 8px; }
.brand-logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--tts));
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 1rem; flex-shrink: 0;
}
.brand-name { font-weight: 800; font-size: 1rem; line-height: 1.2; }
.brand-name small { display: block; font-weight: 400; font-size: 0.72rem; color: var(--text3); }
.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  color: var(--text2); font-size: 0.78rem; font-weight: 600;
  transition: all 0.15s;
}
.icon-btn:hover { background: var(--border); color: var(--text); }
.icon-btn.active { background: var(--pill-bg); color: var(--pill-txt); border-color: var(--accent); }

/* XP BAR */
.xp-strip {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; box-shadow: var(--shadow); flex-wrap: wrap;
}
.xp-stat { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; }
.xp-stat b { font-size: 1rem; font-weight: 800; color: var(--accent); font-family: 'Source Code Pro', monospace; }
.xp-stat span { color: var(--text3); }
.xp-bar-wrap { flex: 1; min-width: 120px; background: var(--bg3); border-radius: 99px; height: 6px; border: 1px solid var(--border); overflow: hidden; }
.xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--tts)); border-radius: 99px; transition: width 0.5s ease; width: 0%; }
.level-badge {
  background: var(--pill-bg); color: var(--pill-txt);
  border-radius: 99px; padding: 2px 10px;
  font-size: 0.72rem; font-weight: 700;
}

/* MAIN GRID */
.main-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
  align-items: start;
}

/* SIDEBAR */
.sidebar {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
  box-shadow: var(--shadow); position: sticky; top: 16px;
}
.sb-section-title {
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; margin-top: 14px;
}
.sb-section-title:first-child { margin-top: 0; }
.mode-btn {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  text-align: left; color: var(--text2);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 5px; transition: all 0.15s;
  font-size: 0.83rem;
}
.mode-btn:hover { background: var(--border); color: var(--text); }
.mode-btn.active {
  background: var(--pill-bg); border-color: var(--accent);
  color: var(--accent); font-weight: 600;
}
.mode-icon { font-size: 1rem; flex-shrink: 0; width: 22px; text-align: center; }
.mode-info b { display: block; font-size: 0.82rem; }
.mode-info small { color: var(--text3); font-size: 0.72rem; }
.mode-btn.active .mode-info small { color: var(--pill-txt); opacity: 0.8; }

.lesson-btn {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px;
  text-align: left; color: var(--text3);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px; transition: all 0.15s;
  font-size: 0.78rem; font-weight: 500;
}
.lesson-btn:hover { background: var(--border); color: var(--text2); }
.lesson-btn.active { background: var(--pill-bg); border-color: var(--accent); color: var(--pill-txt); font-weight: 600; }

/* WORKSPACE */
.workspace {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
  box-shadow: var(--shadow); min-height: 560px;
}

/* EXERCISE CARD */
.ex-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; margin-bottom: 12px;
}
.ex-title {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 4px;
}
.ex-sub { color: var(--text3); font-size: 0.82rem; margin-bottom: 14px; }

/* SENTENCE DISPLAY */
.sentence-cs {
  font-size: 0.88rem; color: var(--text3); margin-bottom: 4px;
}
.sentence-cs strong { color: var(--text2); }

/* WORD BANK */
.wordbank-label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 6px; }
.wordbank {
  display: flex; flex-wrap: wrap; gap: 8px;
  background: var(--bg); border: 2px dashed var(--border);
  border-radius: 10px; padding: 12px; min-height: 54px; margin-bottom: 10px;
}
.answer-box {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: rgba(37,99,235,0.06); border: 2px solid rgba(37,99,235,0.2);
  border-radius: 10px; padding: 12px; min-height: 54px; margin-bottom: 14px;
}
.word-chip {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 6px 12px;
  font-weight: 600; font-size: 0.85rem; color: var(--text);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.word-chip:hover { background: var(--border); transform: translateY(-1px); }
.word-chip.used { opacity: 0.25; pointer-events: none; }
.token-chip {
  background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.3);
  border-radius: 8px; padding: 6px 12px;
  font-weight: 600; font-size: 0.85rem; color: var(--accent);
  cursor: pointer; transition: all 0.15s; user-select: none;
}
.token-chip:hover { background: rgba(37,99,235,0.2); }
.answer-placeholder { color: var(--text3); font-size: 0.82rem; font-style: italic; }

/* FEEDBACK */
.feedback {
  border-radius: 10px; padding: 12px 14px;
  font-size: 0.85rem; line-height: 1.5; border: 1px solid var(--border);
  background: var(--bg); color: var(--text3); margin-bottom: 10px;
}
.feedback.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.feedback.bad  { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }
.feedback.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.feedback.loading { background: var(--pill-bg); border-color: var(--accent); color: var(--pill-txt); }

/* BUTTONS */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn {
  border-radius: 8px; padding: 8px 16px; font-weight: 600;
  font-size: 0.84rem; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text2);
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { background: var(--border); color: var(--text); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.tts { background: var(--tts); border-color: var(--tts); color: #fff; }
.btn.tts:hover { opacity: 0.88; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.hidden { display: none !important; }
.btn.recording { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

/* VOCAB GRID */
.vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; margin-top: 12px; }
.vcard {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 13px;
  display: flex; flex-direction: column; gap: 4px;
}
.vcard-nl { font-size: 1.05rem; font-weight: 700; color: var(--text); }
.vcard-cs { font-size: 0.85rem; color: var(--text3); font-weight: 500; margin-bottom: 2px; }
.vcard-ex { font-size: 0.78rem; color: var(--text3); font-style: italic; line-height: 1.4; }
.vcard-excs { font-size: 0.76rem; color: var(--text3); }
.vcard-btns { display: flex; gap: 5px; margin-top: 6px; }
.vcard-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 0.72rem; font-weight: 600; color: var(--text3);
  cursor: pointer; transition: all 0.15s;
}
.vcard-btn:hover { background: var(--border); color: var(--text); }
.vcard-btn.play { color: var(--tts); border-color: var(--tts); }

/* CHOICES */
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.choice-btn {
  background: var(--bg3); border: 2px solid var(--border); border-radius: 10px;
  padding: 12px 14px; text-align: left; color: var(--text2);
  font-weight: 600; font-size: 0.84rem; cursor: pointer; transition: all 0.15s; line-height: 1.4;
}
.choice-btn:hover:not(:disabled) { background: var(--border); border-color: var(--border2); }
.choice-btn.correct { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.choice-btn.wrong   { background: var(--bad-bg);  border-color: var(--bad);  color: var(--bad); }

/* DIALOGUE BUBBLES */
.dialogue-wrap { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.bubble {
  max-width: 82%; padding: 10px 14px; border-radius: 12px;
  background: var(--bg3); border: 1px solid var(--border); font-size: 0.84rem; line-height: 1.45;
}
.bubble.right { margin-left: auto; background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.2); }
.bubble-who { font-weight: 700; font-size: 0.72rem; color: var(--text3); margin-bottom: 2px; }
.bubble-nl { font-weight: 600; color: var(--text); }
.bubble-cs { color: var(--text3); font-size: 0.78rem; margin-top: 1px; }

/* SAFETY BIG */
.safety-nl {
  font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.03em;
  color: var(--text); margin: 16px 0; line-height: 1.15;
}
.safety-urgent .safety-nl { color: var(--bad); }
.safety-warn .safety-nl { color: var(--warn); }

/* SPEAKING */
.speaking-target {
  font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em;
  color: var(--accent); margin: 12px 0; line-height: 1.3;
}
.speaking-hint {
  font-size: 0.82rem; color: var(--text3); margin-bottom: 12px;
}
.manual-input {
  width: 100%; border: 1px solid var(--border2); background: var(--bg);
  color: var(--text); border-radius: 8px; padding: 10px 12px;
  font-size: 0.88rem; outline: none; transition: border-color 0.15s; margin-top: 8px;
}
.manual-input:focus { border-color: var(--accent); }
.score-bar-wrap { background: var(--bg3); border-radius: 99px; height: 8px; margin: 8px 0; border: 1px solid var(--border); overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }

/* PRONUNCIATION DRILLS */
.phon-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  margin-bottom: 10px;
}
.phon-sound {
  font-family: 'Source Code Pro', monospace; font-size: 1.6rem; font-weight: 600;
  color: var(--tts); margin-bottom: 6px;
}
.phon-desc { font-size: 0.8rem; color: var(--text3); margin-bottom: 10px; line-height: 1.5; }
.phon-words { display: flex; flex-wrap: wrap; gap: 6px; }
.phon-word {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: all 0.15s;
}
.phon-word:hover { background: var(--border); }

/* SETTINGS PANEL */

.settings-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.settings-label { font-size: 0.82rem; font-weight: 600; color: var(--text2); min-width: 140px; }
.settings-input {
  flex: 1; min-width: 200px; border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.84rem; font-family: 'Source Code Pro', monospace;
}
.api-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 99px;
}
.api-status.ok  { background: var(--good-bg); color: var(--good); }
.api-status.err { background: var(--bad-bg);  color: var(--bad); }
.api-status.none { background: var(--warn-bg); color: var(--warn); }

/* SELECT */
select.settings-input { cursor: pointer; }

/* CATEGORY FILTER */
.cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.cat-pill {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 99px;
  padding: 4px 12px; font-size: 0.76rem; font-weight: 600; color: var(--text3);
  cursor: pointer; transition: all 0.15s;
}
.cat-pill:hover { background: var(--border); color: var(--text2); }
.cat-pill.active { background: var(--pill-bg); border-color: var(--accent); color: var(--pill-txt); }

/* LOADING SPINNER */
.spinner {
  display: inline-block; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* PROGRESS INDICATOR */
.progress-dots { display: flex; gap: 4px; margin-bottom: 12px; }
.progress-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
.progress-dot.done { background: var(--good); }
.progress-dot.active { background: var(--accent); }

/* CONFETTI */
.confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
.confetti-wrap i {
  position: absolute; top: -20px; width: 8px; height: 14px; border-radius: 2px;
  animation: cfall 1.2s ease-out forwards;
}
@keyframes cfall { to { transform: translateY(105vh) rotate(560deg); opacity: 0.1; } }

/* RESPONSIVE */
@media (max-width: 860px) {
  .main-grid { grid-template-columns: 1fr; }
  .sidebar { position: static; }
}
@media (max-width: 520px) {
  .choice-grid { grid-template-columns: 1fr; }
  .app { padding: 10px; }
}
</style>
</head>
<body>
<div class="app">
<div id="confetti-wrap" class="confetti-wrap"></div>



<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">NL</div>
    <div class="brand-name">Elis NL Pro<small>Pracovní nizozemština · Moderna part of Elis</small></div>
  </div>
  <div class="topbar-right">

    <button class="icon-btn" id="theme-btn">☀️</button>
    <button class="icon-btn danger" id="reset-btn">↺ Reset</button>
  </div>
</div>

<!-- XP STRIP -->
<div class="xp-strip">
  <div class="xp-stat"><b id="xp-val">0</b><span>XP</span></div>
  <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar"></div></div>
  <div class="xp-stat"><b id="streak-val">0</b><span>🔥 série</span></div>
  <div class="xp-stat"><b id="done-val">0</b><span>splněno</span></div>
  <span class="level-badge" id="level-badge">Level 1</span>
</div>

<!-- MAIN -->
<div class="main-grid">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-section-title">Cvičení</div>
    <div id="mode-list"></div>
    <div class="sb-section-title">Téma lekce</div>
    <div id="lesson-list"></div>
  </aside>

  <!-- WORKSPACE -->
  <main class="workspace" id="workspace">
    <!-- screens injected by JS -->
  </main>
</div>
</div><!-- /app -->

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════ */
const CFG = {
  oaiBase: 'https://api.openai.com/v1',
  ttsModel: 'tts-1',
  whisperModel: 'whisper-1',
  language: 'nl',
  langBCP: 'nl-NL',
  apiTimeout: 12000,   // ms
  minScore: 70,
  ttsVoice: 'onyx',
  useBrowserTTS: true, // fallback
  proxyUrl: 'https://fajndoucko.vercel.app/api/pronunciation',
};

/* ═══════════════════════════════════════════════════════════
   DATA – SLOVNÍ ZÁSOBA (Elis / Moderna kontext)
═══════════════════════════════════════════════════════════ */
const VOCAB = [
  // Stroje
  { cat:'Stroje', nl:'de wasmachine',     cs:'pračka / prací stroj',   ex:'De wasmachine staat stil.',         exCs:'Pračka stojí.' },

/* ═══════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════ */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function norm(s) {
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/gi,' ').replace(/\s+/g,' ').trim();
}
function similar(a, b) {
  if (!a||!b) return false;
  a = norm(a); b = norm(b);
  if (a===b) return true;
  if (a.includes(b)||b.includes(a)) return true;
  const aw=a.split(' '), bw=b.split(' ');
  return bw.filter(w=>aw.includes(w)).length / Math.max(bw.length,1) >= 0.72;
}
function shuffle(a) { return [...a].sort(()=>Math.random()-0.5); }
function pick(a) { return a[Math.floor(Math.random()*a.length)]; }

function lessonFilter(arr) {
  if (currentLesson === 'all') return arr;
  const r = arr.filter(x => !x.lesson || x.lesson === currentLesson);
  return r.length ? r : arr;
}

function nextItem(kind, source) {
  const pool = lessonFilter(source);
  const key  = kind + '::' + currentLesson;
  if (!queues[key] || queues[key].length === 0) queues[key] = shuffle(pool);
  return queues[key].shift();
}

/* ═══════════════════════════════════════════════════════════
   OPENAI TTS
═══════════════════════════════════════════════════════════ */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = CFG.langBCP;   // nl-NL
  u.rate = 0.82;          // trochu pomalejší pro lepší srozumitelnost
  u.pitch = 1.0;
  // Preferuj holandský hlas pokud je k dispozici
  const voices = speechSynthesis.getVoices();
  const nlVoice = voices.find(v => v.lang.startsWith('nl'));
  if (nlVoice) u.voice = nlVoice;
  speechSynthesis.speak(u);
}

/* ═══════════════════════════════════════════════════════════
   OPENAI WHISPER
═══════════════════════════════════════════════════════════ */
async function callPronunciationAPI(blob, expectedText) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), CFG.apiTimeout);
  try {
    const fd = new FormData();
    fd.append('audio', blob, 'speech.webm');
    fd.append('expectedText', expectedText);
    fd.append('language', CFG.langBCP);   // nl-NL
    const res = await fetch(CFG.proxyUrl, {
      method: 'POST',
      body: fd,
      signal: ctrl.signal
    });
    clearTimeout(t);
    if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
    return await res.json();  // { score, transcript, words, tip }
  } catch(e) { clearTimeout(t); throw e; }
}

/* ═══════════════════════════════════════════════════════════
   XP & STATS
═══════════════════════════════════════════════════════════ */
function addXP(n) {
  STATE.xp    = (STATE.xp||0) + n;
  STATE.done  = (STATE.done||0) + 1;
  STATE.streak= (STATE.streak||0) + 1;
  saveState(STATE);
  updateStats();
  if (STATE.streak > 0 && STATE.streak % 5 === 0) doConfetti();
}
function failStreak() { STATE.streak = 0; saveState(STATE); updateStats(); }

function updateStats() {
  const xp = STATE.xp||0;
  el('xp-val').textContent    = xp;
  el('streak-val').textContent= STATE.streak||0;
  el('done-val').textContent  = STATE.done||0;
  const lvl = Math.floor(xp/150)+1;
  el('level-badge').textContent = `Level ${lvl}`;
  el('xp-bar').style.width = Math.min((xp%150)/150*100,100)+'%';
}

/* ═══════════════════════════════════════════════════════════
   CONFETTI
═══════════════════════════════════════════════════════════ */
function doConfetti() {
  const wrap = el('confetti-wrap');
  wrap.innerHTML = '';
  const cols = ['#2563eb','#7c3aed','#15803d','#ea580c','#dc2626','#ca8a04'];
  for (let i=0;i<55;i++) {
    const p = document.createElement('i');
    p.style.cssText = `left:${Math.random()*100}vw;background:${cols[i%cols.length]};` +
      `animation-delay:${Math.random()*0.3}s;animation-duration:${1+Math.random()*0.5}s;` +
      `transform:rotate(${Math.random()*360}deg);border-radius:${Math.random()>0.5?'50%':'2px'}`;
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.innerHTML='', 1800);
}

      <button class="btn good hidden" id="next-btn">Další →</button>
    </div>`;

  el('wordbank').querySelectorAll('.word-chip').forEach(b =>
    b.addEventListener('click', () => {
      if (b.classList.contains('used')) return;
      b.classList.add('used');
      selectedWords.push({ w: b.dataset.w, i: b.dataset.i });
      renderAnswerBox();
    }));
  el('undo-btn').addEventListener('click', () => {
    const last = selectedWords.pop();
    if (last) el('wordbank').querySelector(`[data-i="${last.i}"]`)?.classList.remove('used');
    renderAnswerBox();
  });
  el('check-btn').addEventListener('click', checkPractice);
  el('tts-btn').addEventListener('click',  () => speak(currentItem.nl));
  el('next-btn').addEventListener('click', renderPractice);
  document.addEventListener('keydown', enterHandler);

function renderAnswerBox() {
  const box = el('answer-box');
  if (!box) return;
  box.innerHTML = selectedWords.length
    ? selectedWords.map((x,idx)=>`<button class="token-chip" data-idx="${idx}">${esc(x.w)}</button>`).join('')
    : '<span class="answer-placeholder">Klikni na slova níže…</span>';
  box.querySelectorAll('.token-chip').forEach(t =>
    t.addEventListener('click', () => {
      const idx = Number(t.dataset.idx);
      const rem = selectedWords.splice(idx,1)[0];
      if (rem) el('wordbank').querySelector(`[data-i="${rem.i}"]`)?.classList.remove('used');
      renderAnswerBox();
    }));
}

function checkPractice() {
  const ans = selectedWords.map(x=>x.w).join(' ');
  const fb  = el('feedback');
  if (norm(ans) === norm(currentItem.nl)) {
    fb.className = 'feedback good';
    fb.innerHTML = `✅ Správně!<br><b>NL:</b> ${esc(currentItem.nl)}<br><small>${esc(currentItem.cs)}</small>`;
    addXP(15); speak(currentItem.nl);
    el('check-btn').disabled = true;
    el('next-btn').classList.remove('hidden');
    document.removeEventListener('keydown', enterHandler);
  } else {
    mistakes++;
    failStreak();
    if (mistakes > 2) {
      fb.className = 'feedback warn';
      fb.innerHTML = `⚠️ Správně je:<br><b>${esc(currentItem.nl)}</b>`;
      el('check-btn').disabled = true;
      el('next-btn').classList.remove('hidden');
      document.removeEventListener('keydown', enterHandler);
    } else {
      fb.className = 'feedback bad';
      fb.textContent = `✗ Ještě ne. Zkus znovu. (${mistakes}. pokus)`;
    }
  }
}

      <div class="ex-sub">Nahraj svou odpověď – Whisper ji vyhodnotí. Nebo napiš text ručně.</div>
    </div>
    <div class="sentence-cs" style="margin-bottom:8px"><strong>Zadání:</strong> ${esc(currentItem.promptCs)}</div>
    <div class="speaking-target hidden" id="target-text">${esc(currentItem.target)}</div>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn tts" id="play-target">🔊 Vzor</button>
      <button class="btn primary" id="rec-btn">🎙 Nahrát</button>
      <button class="btn danger hidden" id="stop-btn">■ Stop</button>
      <button class="btn" id="show-target">👁 Ukázat vzor</button>
    </div>
    <div class="speaking-hint">Nebo napiš přepis ručně (pro test bez mikrofonu):</div>
    <input class="manual-input" id="manual-input" placeholder="Napiš holandskou větu…"/>
    <div class="score-bar-wrap hidden" id="score-wrap"><div class="score-bar-fill" id="score-bar"></div></div>
    <div class="feedback" id="feedback">Cíl: aby ti v práci rozuměli.</div>
    <div class="btn-row">
      <button class="btn primary" id="check-btn">✓ Vyhodnotit</button>
      <button class="btn good hidden" id="next-btn">Další →</button>
    </div>`;

  el('play-target').addEventListener('click', () => speak(currentItem.target));
  el('show-target').addEventListener('click', () => el('target-text').classList.remove('hidden'));
  el('check-btn').addEventListener('click', () => checkSpeak(el('manual-input').value));
  el('next-btn').addEventListener('click', renderSpeak);

  el('rec-btn').addEventListener('click', startRec);
  el('stop-btn').addEventListener('click', stopRec);

  el('manual-input').addEventListener('keydown', e => {
    if (e.key==='Enter') { e.preventDefault(); checkSpeak(el('manual-input').value); }
  });
}

function startRec() {
  navigator.mediaDevices.getUserMedia({ audio:true }).then(stream => {
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(audioChunks, { type:'audio/webm' });
      setFb('loading', '<span class="spinner"></span> Whisper přepisuje…');
      try {
        const result = await callPronunciationAPI(blob, currentItem.target);
        el('manual-input').value = result.transcript || '';
        await checkSpeak(result.transcript || '', result);
      } catch(e) {
        setFb('warn', `⚠️ Připojení selhalo: ${e.message}. Napiš přepis ručně.`);
      }
    };
    mediaRecorder.start();
    el('rec-btn').classList.add('hidden');
    el('stop-btn').classList.remove('hidden');
    setFb('loading', '🔴 Nahrávám…');
  }).catch(() => setFb('bad', '✗ Nelze spustit mikrofon.'));
}

function stopRec() {
  if (mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  el('rec-btn').classList.remove('hidden');
  el('stop-btn').classList.add('hidden');
}

async function checkSpeak(transcript, apiResult) {
  const minScore = CFG.minScore;
  el('target-text').classList.remove('hidden');

  // Použij skóre z API, nebo fallback fuzzy shoda
  let score, wordFeedback = '', tip = '';
  if (apiResult && typeof apiResult.score === 'number') {
    score = apiResult.score;
    tip   = apiResult.tip ? `<br><small>💡 ${esc(apiResult.tip)}</small>` : '';
    // Barevné zvýraznění slov
    if (apiResult.words && apiResult.words.length) {
      wordFeedback = '<br><span style="font-size:0.8rem">' +
        apiResult.words.map(w =>
          `<span style="color:${w.ok ? 'var(--good)' : 'var(--bad)'}">` +
          esc(w.word) + '</span>'
        ).join(' ') + '</span>';
    }
  } else {
    const ok = currentItem.accept.some(a => similar(transcript, a));
    score = ok ? Math.round(82 + Math.random()*15) : Math.round(30 + Math.random()*28);
  }

  const scoreWrap = el('score-wrap');
  const scoreBar  = el('score-bar');
  scoreWrap.classList.remove('hidden');
  scoreBar.style.width = score + '%';
  scoreBar.style.background = score >= minScore ? 'var(--good)' : score > 50 ? 'var(--warn)' : 'var(--bad)';

  if (score >= minScore) {
    setFb('good', `✅ Skvěle! Skóre: ${score}%${wordFeedback}${tip}<br><small>Vzor: ${esc(currentItem.target)}</small>`);
    addXP(20); speak(currentItem.target);
    el('check-btn').disabled = true;
    el('next-btn').classList.remove('hidden');
  } else {
    setFb('bad', `✗ Skóre: ${score}% – zkus znovu.${wordFeedback}${tip}<br><small>Vzor: ${esc(currentItem.target)} | Ty: ${esc(transcript||'—')}</small>`);
    failStreak();
  }
}

function renderDialogue() {
  currentItem = nextItem('dialogue', DIALOGUES);
  const choices = shuffle(currentItem.choices);
  el('workspace').innerHTML = `
    <div class="ex-card">
      <div class="ex-title">💬 ${esc(currentItem.title)}</div>
      <div class="ex-sub">Scéna z pracoviště Elis. Poslechni si a vyber svou reakci.</div>
    </div>
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn tts" id="play-all">🔊 Přehrát dialog</button>
    </div>
    <div class="dialogue-wrap">
      ${currentItem.lines.map((l,i)=>`
        <div class="bubble ${i%2?'right':''}">
          <div class="bubble-who">${esc(l[0])}</div>
          <div class="bubble-nl">${esc(l[1])}</div>
          <div class="bubble-cs">${esc(l[2])}</div>
        </div>`).join('')}
    </div>
    <div class="feedback" style="margin-bottom:10px"><b>Otázka:</b> ${esc(currentItem.question)}</div>
    <div class="choice-grid" id="choices">
      ${choices.map(c=>`<button class="choice-btn" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback">Vyber nejlepší reakci.</div>
    <div class="btn-row"><button class="btn good hidden" id="next-btn">Další dialog →</button></div>`;

  el('play-all').addEventListener('click', async () => {
    for (const line of currentItem.lines) { speak(line[1]); await new Promise(r=>setTimeout(r,1400)); }
  });
  el('choices').querySelectorAll('.choice-btn').forEach(b =>
    b.addEventListener('click', () => checkDialogue(b)));
  el('next-btn').addEventListener('click', renderDialogue);
}

function checkDialogue(b) {
  el('choices').querySelectorAll('.choice-btn').forEach(x=>x.disabled=true);
  if (b.dataset.c === currentItem.correct) {
    b.classList.add('correct');
    setFb('good', `✅ Správně! "${esc(currentItem.correct)}"`);
    addXP(14);
  } else {
    b.classList.add('wrong');
    el('choices').querySelectorAll('.choice-btn').forEach(x => { if(x.dataset.c===currentItem.correct) x.classList.add('correct'); });
    setFb('bad', `✗ Nejlepší reakce: <b>${esc(currentItem.correct)}</b>`);
    failStreak();
  }
  el('next-btn').classList.remove('hidden');
}

/* ═══════════════════════════════════════════════════════════
   BEZPEČNOST
═══════════════════════════════════════════════════════════ */
function renderSafety() {
  currentItem = nextItem('safety', SAFETY);
  const wrongs = shuffle(SAFETY.filter(x=>x.cs!==currentItem.cs)).slice(0,3).map(x=>x.cs);
  const choices = shuffle([currentItem.cs, ...wrongs]);
  const lvlClass = currentItem.level==='urgent' ? 'safety-urgent' : currentItem.level==='warn' ? 'safety-warn' : '';
  el('workspace').innerHTML = `
    <div class="ex-card ${lvlClass}">
      <div class="ex-title">⚠️ Bezpečnostní pokyn</div>
      <div class="ex-sub">Rychlá reakce. Vyber správný překlad.</div>
      <div class="safety-nl">${esc(currentItem.nl)}</div>
      <button class="btn tts" id="play-btn">🔊 Přehrát</button>
    </div>
    <div class="choice-grid" id="choices">
      ${choices.map(c=>`<button class="choice-btn" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback">Co to znamená?</div>
    <div class="btn-row"><button class="btn good hidden" id="next-btn">Další →</button></div>`;

  el('play-btn').addEventListener('click', () => speak(currentItem.nl));
  el('choices').querySelectorAll('.choice-btn').forEach(b =>
    b.addEventListener('click', () => {
      el('choices').querySelectorAll('.choice-btn').forEach(x=>x.disabled=true);
      if (b.dataset.c===currentItem.cs) {
        b.classList.add('correct');
        setFb('good', `✅ Správně: ${esc(currentItem.cs)}`);
        addXP(10);
      } else {
        b.classList.add('wrong');
        el('choices').querySelectorAll('.choice-btn').forEach(x=>{ if(x.dataset.c===currentItem.cs) x.classList.add('correct'); });
        setFb('bad', `✗ Správně: <b>${esc(currentItem.cs)}</b>`);
        failStreak();
      }
      el('next-btn').classList.remove('hidden');
    }));
  el('next-btn').addEventListener('click', renderSafety);
  speak(currentItem.nl);
}

  el('workspace').innerHTML = `
    <div class="ex-card">
      <div class="ex-title">🔄 Překlad do holandštiny</div>
      <div class="ex-sub">Přelož českou větu. Drobné odchylky jsou tolerovány.</div>
    </div>
    <div style="font-size:1.3rem;font-weight:700;margin:16px 0;color:var(--text)">${esc(currentItem.cs)}</div>

    <div class="feedback" id="feedback" style="margin-top:10px">Napiš překlad a zkontroluj.</div>
    <div class="btn-row">

      <button class="btn tts hidden" id="tts-btn">🔊 Poslechnout</button>
      <button class="btn good hidden" id="next-btn">Další →</button>
    </div>`;

  const check = () => {
    const val = el('trans-input').value;
    const ok  = currentItem.accept.some(a => similar(val, a));
    if (ok) {
      setFb('good', `✅ Správně!<br><b>${esc(currentItem.nl)}</b>`);
      addXP(18); speak(currentItem.nl);
      el('tts-btn').classList.remove('hidden');
      el('next-btn').classList.remove('hidden');
      el('check-btn').disabled = true;
    } else {
      setFb('bad', `✗ Zkus znovu. Nápověda: začíná „${esc(currentItem.nl.split(' ').slice(0,2).join(' '))}…"`);
      failStreak();
    }
  };

  el('check-btn').addEventListener('click', check);
  el('trans-input').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();check();} });
  el('tts-btn').addEventListener('click', () => speak(currentItem.nl));

}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function setFb(type, html) {
  const fb = el('feedback');
  if (!fb) return;
  fb.className = 'feedback' + (type ? ' '+type : '');
  fb.innerHTML = html;
}

function enterHandler(e) {
  if (e.key !== 'Enter') return;
  const btn = el('check-btn') || el('next-btn');
  if (btn && !btn.disabled && !btn.classList.contains('hidden')) { e.preventDefault(); btn.click(); }
}

/* ═══════════════════════════════════════════════════════════
   NASTAVENÍ
═══════════════════════════════════════════════════════════ */
function initSettings() {
  const theme = loadTheme();
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn(theme);
}

function updateApiIndicator(key) {
  const ind = el('api-indicator');
  if (key) { ind.className='api-status ok'; ind.textContent='✓ API'; }
  else      { ind.className='api-status none'; ind.textContent='❓ API'; }
}

function updateThemeBtn(theme) {
  const labels = { light:'☀️', dark:'🌙', steel:'🔩' };
  el('theme-btn').textContent = labels[theme] || '☀️';
}

/* ═══════════════════════════════════════════════════════════
   INICIALIZACE
═══════════════════════════════════════════════════════════ */
function init() {
  initSettings();
  updateStats();
  renderSidebar();
  renderCurrent();

  // cyklování témat
  const themes = ['light','dark','steel'];
  const tLabels = { light:'☀️', dark:'🌙', steel:'🔩' };
  el('theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = themes[(themes.indexOf(cur)+1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    el('theme-btn').textContent = tLabels[next];
    saveTheme(next);
  });

  el('reset-btn').addEventListener('click', () => {
    if (!confirm('Opravdu vynulovat postup?')) return;
    STATE = { xp:0, done:0, streak:0 };
    saveState(STATE);
    Object.keys(queues).forEach(k=>delete queues[k]);
    updateStats();
  });
}

document.addEventListener('DOMContentLoaded', init);
