<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Mluvme! &ndash; Angli&ccaron;tina</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f0f4ff;--card:#fff;--dark:#1a1f3a;--muted:#6b7280;--border:#e5e7f0;--primary:#4f6ef7;--p2:#3a57e8;--green:#00b894;--red:#e17055;--gold:#fdcb6e;--shadow:0 8px 32px rgba(79,110,247,.12);--radius:20px;font-family:'Nunito',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(79,110,247,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(0,184,148,.06) 0%,transparent 60%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:16px 16px 48px}
.header{text-align:center;padding:12px 0 4px}
.logo{font-family:'Fredoka One',cursive;font-size:32px;color:var(--dark)}
.logo span{color:var(--primary)}
.tagline{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.accent-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.accent-btn{border:2px solid var(--border);background:white;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;color:var(--muted);cursor:pointer;transition:all .12s;touch-action:manipulation}
.accent-btn:hover{border-color:var(--primary);color:var(--dark)}
.accent-btn.active{background:var(--primary);border-color:var(--primary);color:white}
.section-title{font-family:'Fredoka One',cursive;font-size:18px;color:var(--dark);margin:16px 0 10px}
.sit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.sit-card{background:white;border-radius:16px;padding:14px 12px;cursor:pointer;border:2px solid transparent;transition:all .15s;box-shadow:0 3px 12px rgba(0,0,0,.06);touch-action:manipulation}
.sit-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.sit-card .emoji{font-size:28px;line-height:1;margin-bottom:6px}
.sit-card .name{font-weight:900;font-size:13px;color:var(--dark);line-height:1.2}
.sit-card .cnt{display:inline-block;margin-top:4px;background:var(--bg);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:900;color:var(--muted)}
.sit-card.done-card{border-color:var(--green)!important}
.dialog-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dialog-pill{border:2px solid var(--border);background:white;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:900;color:var(--muted);cursor:pointer;transition:all .12s;touch-action:manipulation}
.dialog-pill:hover{border-color:var(--primary)}
.dialog-pill.active{background:var(--primary);border-color:var(--primary);color:white}
.dialog-pill.done-pill{border-color:var(--green);color:var(--green)}
.dlvl{font-size:10px;opacity:.8}
.step-card{background:white;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:12px}
.step-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.step-num{width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:16px;flex-shrink:0}
.step-lbl{font-weight:900;font-size:15px;color:var(--dark)}
.step-sub{font-size:12px;color:var(--muted);font-weight:700}
.sen-box{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:12px;border-left:4px solid var(--primary)}
.sen-main{font-size:22px;font-weight:900;color:var(--dark);line-height:1.3}
.sen-tr{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.sen-ph{font-size:13px;color:var(--primary);font-weight:700;margin-top:4px;font-style:italic}
.play-row{display:flex;gap:10px;flex-wrap:wrap}
.play-btn{border:none;border-radius:999px;padding:10px 20px;font-weight:900;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s;touch-action:manipulation}
.play-btn.n{background:var(--primary);color:white}
.play-btn.n:hover{background:var(--p2)}
.play-btn.s{background:#e8ecff;color:var(--primary)}
.play-btn.s:hover{background:#d5dcff}
.blocks-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.brow{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ben{flex:1;padding:10px 14px;background:#f8faff;font-weight:900;font-size:15px;color:var(--dark)}
.bcz{flex:1;padding:10px 14px;background:#fff8e7;font-weight:700;font-size:14px;color:#7c6a00}
.bsep{width:2px;background:var(--border)}
.gnote{background:#eef2ff;border-radius:12px;padding:12px 14px;border-left:3px solid var(--primary);font-size:13px;font-weight:700;color:#3730a3;line-height:1.5;margin-top:8px}
.gnote b{color:#1a56cd}
.build-area{min-height:60px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tok{border-radius:8px;padding:8px 12px;font-weight:900;font-size:14px;cursor:pointer;transition:all .1s;user-select:none;touch-action:manipulation}
.tok.bk{background:white;border:2px solid var(--border);color:var(--dark)}
.tok.bk:hover{border-color:var(--primary);color:var(--primary)}
.tok.pl{background:var(--primary);color:white}
.token-bank{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.abtn{width:100%;border:none;border-radius:14px;padding:14px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;cursor:pointer;transition:all .12s;touch-action:manipulation;margin-top:6px}
.abtn.pr{background:var(--primary);color:white}
.abtn.pr:hover{background:var(--p2)}
.abtn.se{background:var(--bg);color:var(--dark);border:2px solid var(--border)}
.abtn.se:hover{border-color:var(--primary)}
.abtn.su{background:var(--green);color:white}
.fb{border-radius:14px;padding:14px 16px;margin-top:8px;font-size:14px;font-weight:700;line-height:1.5}
.fb.ok{background:#d1fae5;border-left:4px solid var(--green);color:#065f46}
.fb.no{background:#fee2e2;border-left:4px solid var(--red);color:#991b1b}
.fb.tip{background:#eff6ff;border-left:4px solid #3b82f6;color:#1e40af;margin-top:6px}
.choices-wrap{display:flex;flex-direction:column;gap:8px}
.chbtn{width:100%;text-align:left;border:2px solid var(--border);background:white;border-radius:12px;padding:12px 14px;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--dark);cursor:pointer;transition:all .12s;line-height:1.4;touch-action:manipulation}
.chbtn:hover:not(:disabled){border-color:var(--primary)}
.chbtn.ck{background:#d1fae5;border-color:var(--green);color:#065f46}
.chbtn.cw{background:#fee2e2;border-color:var(--red);color:#991b1b}
.chbtn:disabled{cursor:not-allowed}
.mic-area{text-align:center;padding:16px 0 8px}
.mic-btn{width:72px;height:72px;border-radius:50%;border:none;background:var(--primary);color:white;font-size:30px;cursor:pointer;transition:all .15s;box-shadow:0 4px 16px rgba(79,110,247,.3);touch-action:manipulation}
.mic-btn:hover{transform:scale(1.06)}
.mic-btn.rec{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,112,85,.5)}50%{box-shadow:0 0 0 12px rgba(225,112,85,0)}}
.sbar{height:8px;background:var(--border);border-radius:4px;margin:8px 0;overflow:hidden}
.sfill{height:100%;border-radius:4px;background:var(--green);transition:width .5s}
.swds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sw{border-radius:6px;padding:4px 10px;font-size:13px;font-weight:900}
.sw.ok{background:#d1fae5;color:#065f46}
.sw.no{background:#fee2e2;color:#991b1b}
.ctx-box{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;font-weight:700;color:var(--dark)}
.ctx-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.nav-back{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px;color:var(--primary);cursor:pointer;margin-bottom:12px;touch-action:manipulation}
.nav-back:hover{color:var(--p2)}
.pdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.pd{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .2s}
.pd.ac{background:var(--primary);transform:scale(1.3)}
.pd.dn{background:var(--green)}
.done-banner{text-align:center;padding:20px;background:#d1fae5;border-radius:var(--radius);margin-bottom:12px}
.done-banner .di{font-size:40px}
.done-banner .dt{font-weight:900;font-size:18px;color:#065f46;margin-top:8px}
.xpb{display:inline-block;background:var(--gold);color:#7c5800;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:900;margin-top:6px}
.sit-title{font-family:'Fredoka One',cursive;font-size:22px;color:var(--dark);margin-bottom:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<div id="vHome">
  <div class="header">
    <div class="logo">Mluv<span>me!</span> &#127468;&#127463;</div>
    <div class="tagline">Anglick&aacute; konverzace krok za krokem</div>
  </div>
  <div class="accent-bar">
    <button class="accent-btn active" onclick="setA('en-GB')" id="bGB">&#127468;&#127463; British</button>
    <button class="accent-btn" onclick="setA('en-US')" id="bUS">&#127482;&#127480; American</button>
  </div>
  <div class="section-title">Vyber situaci &#128071;</div>
  <div class="sit-grid" id="sGrid"></div>
</div>
<div id="vSit" class="hidden">
  <div class="nav-back" onclick="gH()">&larr; Zp&aacute;t</div>
  <div class="sit-title" id="sTitle"></div>
  <div class="dialog-bar" id="dBar"></div>
  <div id="sArea"></div>
</div>
</div>
<script>
const S=[{"slug":"predstaveni","emoji":"🙋","title":"Introducing yourself","titleCz":"Představení","dialogs":[{"level":"A0","title":"Basic introduction","titleCz":"Základní představení","sentence":"My name is Anna.","sentenceCz":"Jmenuji se Anna.","phonetic":"maj nejm iz Ana","blocks":[["My name","Moje jméno"],["is","je"],["Anna","Anna"]],"grammar":"V angličtině VŽDY potřebuješ podmět. <b>My name is</b> = doslova &bdquo;Moje jméno je&rdquo;. <b>My</b> = moje (1. os.), <b>Your</b> = tvoje &mdash; záměna je velmi častá chyba!","correct_tokens":["My","name","is","Anna"],"distractor_tokens":["Your","Name","am","You"],"context":"Hi! Nice to meet you. What's your name?","contextCz":"Ahoj! Těší mě. Jak se jmenuješ?","choices":[{"text":"My name is Anna.","textCz":"Jmenuji se Anna.","correct":true,"kind":"correct","explain":""},{"text":"Your name is Anna.","textCz":"Tvoje jméno je Anna.","correct":false,"kind":"meaning","explain":"Věta je gramaticky správná, ale říkáš to o druhé osobě. <b>Your</b> = tvoje, <b>My</b> = moje."},{"text":"Name is Anna me.","textCz":"(Nesmysl &mdash; chybí podmět.)","correct":false,"kind":"grammar","explain":"Anglická věta musí mít podmět. Správně: <b>My name is Anna.</b>"}]},{"level":"A0","title":"Where are you from?","titleCz":"Odkud jsi?","sentence":"I am from the Czech Republic.","sentenceCz":"Jsem z České republiky.","phonetic":"aj em from dhe čech ripablik","blocks":[["I am","Jsem"],["from","z"],["the Czech Republic","České republiky"]],"grammar":"<b>I am from...</b> = Jsem z... Zkráceně <b>I'm from...</b>. Pozor: <b>from</b> = odkud. &bdquo;I am to&rdquo; by znamenalo kam jedeš, ne odkud jsi.","correct_tokens":["I","am","from","the Czech Republic"],"distractor_tokens":["You","are","to","been","at","comes"],"context":"Where are you from?","contextCz":"Odkud jsi?","choices":[{"text":"I am from the Czech Republic.","textCz":"Jsem z České republiky.","correct":true,"kind":"correct","explain":""},{"text":"You are from the Czech Republic.","textCz":"Ty jsi z České republiky.","correct":false,"kind":"meaning","explain":"<b>I</b> = já, <b>You</b> = ty. Odpovídáš na otázku o sobě!"},{"text":"I from Czech.","textCz":"(Nesmysl &mdash; chybí sloveso.)","correct":false,"kind":"grammar","explain":"V angličtině nelze vynechat sloveso. Správně: <b>I <u>am</u> from...</b>"}]},{"level":"A1","title":"How old are you?","titleCz":"Kolik ti je let?","sentence":"I am thirty years old.","sentenceCz":"Je mi třicet let.","phonetic":"aj em sörti jirz old","blocks":[["I am","Je mi / Mám"],["thirty","třicet"],["years old","let"]],"grammar":"V angličtině říkáme <b>I am X years old</b>. Doslova: Jsem X let starý. <b>Nikdy</b> neříkáme &bdquo;I have X years&rdquo; &mdash; to je doslovný překlad z češtiny.","correct_tokens":["I","am","thirty","years old"],"distractor_tokens":["You","are","years","old years","thirteen","have"],"context":"How old are you?","contextCz":"Kolik ti je let?","choices":[{"text":"I am thirty years old.","textCz":"Je mi třicet let.","correct":true,"kind":"correct","explain":""},{"text":"I have thirty years.","textCz":"Mám třicet roků.","correct":false,"kind":"meaning","explain":"<b>I have</b> = mám (věci). Pro věk se používá <b>I am</b>, ne &bdquo;I have&rdquo;. Typická česká chyba!"},{"text":"You are thirty years old.","textCz":"Tobě je třicet let.","correct":false,"kind":"meaning","explain":"Gramaticky správná věta &mdash; ale mluvíš o druhé osobě."}]},{"level":"A1","title":"What do you do?","titleCz":"Čím se živíš?","sentence":"I am a teacher.","sentenceCz":"Jsem učitel/ka.","phonetic":"aj em ə tíčer","blocks":[["I am","Jsem"],["a","&mdash;"],["teacher","učitel/ka"]],"grammar":"V angličtině před povoláním VŽDY píšeme neurčitý člen <b>a</b> (nebo <b>an</b> před samohláskou). &bdquo;I am teacher&rdquo; je špatně!","correct_tokens":["I","am","a","teacher"],"distractor_tokens":["You","are","an","doctor","student","work"],"context":"What do you do for a living?","contextCz":"Čím se živíš?","choices":[{"text":"I am a teacher.","textCz":"Jsem učitel/ka.","correct":true,"kind":"correct","explain":""},{"text":"I am teacher.","textCz":"Jsem učitel.","correct":false,"kind":"grammar","explain":"Chybí člen <b>a</b>. Vždy: <b>I am a/an + povolání</b>."},{"text":"I work teacher.","textCz":"Pracuji učitel.","correct":false,"kind":"grammar","explain":"&bdquo;I work teacher&rdquo; je nesmysl. Správně: <b>I am a teacher</b> nebo <b>I work as a teacher</b>."}]},{"level":"A1","title":"Nice to meet you","titleCz":"Těší mě","sentence":"Nice to meet you. I am happy to be here.","sentenceCz":"Těší mě. Jsem rád/a, že jsem tady.","phonetic":"najs tu mít jú. aj em hepi tu bí hír","blocks":[["Nice to meet you","Těší mě"],["I am happy","Jsem rád/a"],["to be here","být tady"]],"grammar":"<b>Nice to meet you</b> = Těší mě (při seznámení). Odpověď: <b>Nice to meet you too</b> = Mě taky. <b>Happy</b> = šťastný/rád, <b>here</b> = tady.","correct_tokens":["Nice","to","meet","you","I","am","happy","to","be","here"],"distractor_tokens":["Glad","see","meeting","there","Very","pleased"],"context":"You just met someone at a party. How do you greet them?","contextCz":"Právě jsi potkal/a někoho na party. Jak ho/ji pozdravíš?","choices":[{"text":"Nice to meet you. I am happy to be here.","textCz":"Těší mě. Jsem rád/a, že jsem tady.","correct":true,"kind":"correct","explain":""},{"text":"Nice meeting you. I am glad here.","textCz":"(Nesmysl &mdash; nesprávná gramatika.)","correct":false,"kind":"grammar","explain":"&bdquo;I am glad here&rdquo; je gramaticky špatně. Správně: <b>I am glad to be here</b>."},{"text":"Nice to meet you too.","textCz":"Mě taky těší.","correct":false,"kind":"meaning","explain":"Věta je správně, ale &bdquo;too&rdquo; (taky) se říká jako odpověď, ne jako první oslovení."}]},{"level":"A2","title":"Talking about yourself","titleCz":"O sobě","sentence":"I live in Brno and I work in an office.","sentenceCz":"Bydlím v Brně a pracuji v kanceláři.","phonetic":"aj liv in brnó end aj wörk in en ofis","blocks":[["I live in Brno","Bydlím v Brně"],["and","a"],["I work in an office","pracuji v kanceláři"]],"grammar":"<b>I live in + město</b> = Bydlím v + město. <b>I work in an office</b> &mdash; před &bdquo;office&rdquo; píšeme <b>an</b> (začíná samohláskou). <b>and</b> = a (spojka).","correct_tokens":["I","live","in","Brno","and","I","work","in","an","office"],"distractor_tokens":["at","the","a","works","lived","offices"],"context":"Tell me about yourself.","contextCz":"Řekni mi o sobě.","choices":[{"text":"I live in Brno and I work in an office.","textCz":"Bydlím v Brně a pracuji v kanceláři.","correct":true,"kind":"correct","explain":""},{"text":"I live in Brno and I work in a office.","textCz":"Bydlím v Brně a pracuji v kanceláři.","correct":false,"kind":"grammar","explain":"Před slovem začínajícím samohláskou (office) píšeme <b>an</b>, ne &bdquo;a&rdquo;. Pravidlo: a/an závisí na zvuku, ne na písmenu."},{"text":"I living in Brno and I working in office.","textCz":"(Špatné sloveso.)","correct":false,"kind":"grammar","explain":"V přítomném jednoduchém čase: <b>I live</b>, <b>I work</b> (bez -ing v základním tvrzení)."}]},{"level":"A2","title":"Do you speak English?","titleCz":"Mluvíš anglicky?","sentence":"I speak a little English. I am still learning.","sentenceCz":"Mluvím trochu anglicky. Stále se učím.","phonetic":"aj spík ə litl inglič. aj em stil lörnin","blocks":[["I speak","Mluvím"],["a little English","trochu anglicky"],["I am still learning","Stále se učím"]],"grammar":"<b>a little</b> = trochu (s nepočitatelnými podstatnými jmény). <b>I am still learning</b> = průběhový čas &mdash; probíhá teď i obecně. Neboj se přiznat, že se učíš!","correct_tokens":["I","speak","a","little","English","I","am","still","learning"],"distractor_tokens":["talk","some","few","speak","study","am","learner"],"context":"Can you speak English?","contextCz":"Umíš anglicky?","choices":[{"text":"I speak a little English. I am still learning.","textCz":"Mluvím trochu anglicky. Stále se učím.","correct":true,"kind":"correct","explain":""},{"text":"I speak few English.","textCz":"Mluvím pár angličtiny.","correct":false,"kind":"grammar","explain":"<b>few</b> = málo (počitatelná slova). Pro nepočitatelná (English, water, time) používáme <b>a little</b>."},{"text":"I talk English little.","textCz":"(Špatný slovosled.)","correct":false,"kind":"grammar","explain":"Správný slovosled: <b>I speak a little English.</b> Příslovce míry stojí před podstatným jménem."}]}]},{"slug":"rodina","emoji":"👨‍👩‍👧","title":"Family","titleCz":"Rodina","dialogs":[{"level":"A0","title":"Are you married?","titleCz":"Jsi ženatý/vdaná?","sentence":"I am married. I have two children.","sentenceCz":"Jsem ženatý/vdaná. Mám dvě děti.","phonetic":"aj em merid. aj hev tu čildren","blocks":[["I am married","Jsem ženatý/vdaná"],["I have","Mám"],["two children","dvě děti"]],"grammar":"<b>I am married</b> = stav. <b>I have children</b> = vlastnění. Dvě různá slovesa pro dva různé koncepty!","correct_tokens":["I","am","married","I","have","two","children"],"distractor_tokens":["You","are","wedding","got","a","kids","three"],"context":"Are you married?","contextCz":"Jsi ženatý/vdaná?","choices":[{"text":"I am married. I have two children.","textCz":"Jsem ženatý/vdaná. Mám dvě děti.","correct":true,"kind":"correct","explain":""},{"text":"I am married and I am two children.","textCz":"(Nesmysl &mdash; špatné sloveso.)","correct":false,"kind":"grammar","explain":"&bdquo;I am two children&rdquo; je nesmysl. Děti <b>mám</b> = <b>I have</b> children, ne &bdquo;I am&rdquo;."},{"text":"I have married.","textCz":"Mám ženatý.","correct":false,"kind":"grammar","explain":"Stav manželství vyjadřujeme pomocí <b>be</b>: <b>I am married</b>, ne &bdquo;I have married&rdquo; (to je předpřítomný čas)."}]},{"level":"A0","title":"My family","titleCz":"Moje rodina","sentence":"I have a brother and a sister.","sentenceCz":"Mám bratra a sestru.","phonetic":"aj hev ə bröder end ə sister","blocks":[["I have","Mám"],["a brother","bratra"],["and a sister","a sestru"]],"grammar":"<b>brother</b> = bratr, <b>sister</b> = sestra. Pozor na člen <b>a</b> před oběma! &bdquo;I have brother&rdquo; je špatně &mdash; člen nelze vynechat.","correct_tokens":["I","have","a","brother","and","a","sister"],"distractor_tokens":["am","an","brothers","sisters","the","got"],"context":"Do you have any siblings?","contextCz":"Máš sourozence?","choices":[{"text":"I have a brother and a sister.","textCz":"Mám bratra a sestru.","correct":true,"kind":"correct","explain":""},{"text":"I have brother and sister.","textCz":"Mám bratr a sestra.","correct":false,"kind":"grammar","explain":"Před počitatelnými podstatnými jmény v jednotném čísle vždy <b>a/an</b>: <b>a brother</b>, <b>a sister</b>."},{"text":"I am a brother and a sister.","textCz":"Jsem bratr a sestra.","correct":false,"kind":"meaning","explain":"&bdquo;I am a brother&rdquo; = Jsem bratr (ty sám). Ale ty říkáš, že je <b>máš</b> = <b>I have</b>."}]},{"level":"A1","title":"Parents and grandparents","titleCz":"Rodiče a prarodiče","sentence":"My mother is sixty years old. My father is retired.","sentenceCz":"Mé matce je šedesát let. Můj otec je v důchodu.","phonetic":"maj möder iz siksti jirz old. maj fáder iz ritajerd","blocks":[["My mother","Moje matka"],["is sixty years old","je jí šedesát let"],["My father is retired","Můj otec je v důchodu"]],"grammar":"<b>My mother is X years old</b> &mdash; opět <b>is</b>, ne &bdquo;has&rdquo;. <b>retired</b> = v důchodu / důchodce. <b>My father</b> = můj otec (bez členu &mdash; přivlastňovací zájmeno ho nahrazuje).","correct_tokens":["My","mother","is","sixty","years","old","My","father","is","retired"],"distractor_tokens":["Mom","the","have","her","sixty-years","working"],"context":"Tell me about your parents.","contextCz":"Řekni mi o svých rodičích.","choices":[{"text":"My mother is sixty years old. My father is retired.","textCz":"Mé matce je šedesát let. Můj otec je v důchodu.","correct":true,"kind":"correct","explain":""},{"text":"My mother has sixty years.","textCz":"Mé matce je šedesát let.","correct":false,"kind":"grammar","explain":"Pro věk: <b>is X years old</b>, ne &bdquo;has X years&rdquo;. Tato chyba je typicky česká!"},{"text":"My mother is sixty years. My father retired.","textCz":"...","correct":false,"kind":"grammar","explain":"Chybí <b>old</b> (sixty years <b>old</b>) a sloveso <b>is</b> (My father <b>is</b> retired)."}]},{"level":"A1","title":"My children","titleCz":"Moje děti","sentence":"My son is seven and my daughter is four.","sentenceCz":"Mému synovi je sedm a mé dceři jsou čtyři.","phonetic":"maj san iz sevin end maj dóter iz fór","blocks":[["My son","Můj syn"],["is seven","je mu sedm"],["my daughter is four","mé dceři jsou čtyři"]],"grammar":"<b>son</b> = syn, <b>daughter</b> = dcera. &bdquo;My son is seven&rdquo; = zkrácená forma &bdquo;is seven years old&rdquo;. <b>and</b> spojuje dvě části věty bez opakování podmětu.","correct_tokens":["My","son","is","seven","and","my","daughter","is","four"],"distractor_tokens":["boy","girl","has","the","are","two","five"],"context":"Do you have children? How old are they?","contextCz":"Máš děti? Kolik jim je?","choices":[{"text":"My son is seven and my daughter is four.","textCz":"Mému synovi je sedm a mé dceři jsou čtyři.","correct":true,"kind":"correct","explain":""},{"text":"My son has seven years and my daughter has four.","textCz":"(Špatné sloveso.)","correct":false,"kind":"grammar","explain":"Pro věk: <b>is</b>, ne &bdquo;has&rdquo;. Pravidlo platí pro celou rodinu &mdash; vždy!"},{"text":"I have son seven and daughter four.","textCz":"(Nesmysl &mdash; chybí člen a sloveso.)","correct":false,"kind":"grammar","explain":"Správně: <b>My son is seven</b>. Nelze vynechat přivlastňovací zájmeno ani sloveso."}]},{"level":"A2","title":"Family activities","titleCz":"Rodinné aktivity","sentence":"We go to the park every Sunday with the kids.","sentenceCz":"Každou neděli chodíme s dětmi do parku.","phonetic":"wi gou tu dhe párk evri sandej widh dhe kidz","blocks":[["We go","Chodíme"],["to the park","do parku"],["every Sunday","každou neděli"],["with the kids","s dětmi"]],"grammar":"<b>every Sunday</b> = každou neděli (pravidelná akce → přítomný čas prostý). <b>with the kids</b> &mdash; určitý člen <b>the</b>, protože mluvíš o konkrétních svých dětech.","correct_tokens":["We","go","to","the","park","every","Sunday","with","the","kids"],"distractor_tokens":["are","going","a","on","at","Sundays","children"],"context":"What does your family do on weekends?","contextCz":"Co děláte o víkendech?","choices":[{"text":"We go to the park every Sunday with the kids.","textCz":"Každou neděli chodíme s dětmi do parku.","correct":true,"kind":"correct","explain":""},{"text":"We are going to the park every Sunday.","textCz":"Každou neděli jdeme do parku.","correct":false,"kind":"meaning","explain":"Věta je gramaticky přijatelná, ale průběhový čas naznačuje, že jdeš zrovna teď. Pro pravidelné akce je lepší přítomný prostý: <b>We go.</b>"},{"text":"We go to park every Sundays with kids.","textCz":"(Chybí členy.)","correct":false,"kind":"grammar","explain":"<b>to the park</b> (určitý člen), <b>the kids</b>. &bdquo;Every Sunday&rdquo; je správně &mdash; bez -s!"}]},{"level":"A2","title":"Extended family","titleCz":"Širší rodina","sentence":"My grandparents live in the countryside. We visit them often.","sentenceCz":"Moji prarodiče bydlí na venkově. Navštěvujeme je často.","phonetic":"maj grenpěrents liv in dhe kantrisajd. wi vizit dem ófen","blocks":[["My grandparents","Moji prarodiče"],["live in the countryside","bydlí na venkově"],["We visit them often","Navštěvujeme je často"]],"grammar":"<b>grandparents</b> = prarodiče (gran+parents). <b>countryside</b> = venkov. <b>visit them</b> &mdash; <b>them</b> = je/jim (přímý předmět, množné číslo).","correct_tokens":["My","grandparents","live","in","the","countryside","We","visit","them","often"],"distractor_tokens":["grandmothers","lives","on","country","see","they","frequent"],"context":"Where do your grandparents live?","contextCz":"Kde bydlí tvoji prarodiče?","choices":[{"text":"My grandparents live in the countryside. We visit them often.","textCz":"Moji prarodiče bydlí na venkově. Navštěvujeme je často.","correct":true,"kind":"correct","explain":""},{"text":"My grandparents live on the countryside. We visit they often.","textCz":"(Gramatická chyba.)","correct":false,"kind":"grammar","explain":"<b>in the countryside</b> (ne &bdquo;on&rdquo;). Po slovese stojí předmět <b>them</b>, ne &bdquo;they&rdquo; (podmět)."},{"text":"My grandparents lives in the countryside.","textCz":"(Špatná shoda.)","correct":false,"kind":"grammar","explain":"<b>grandparents</b> je množné číslo → <b>live</b>, ne &bdquo;lives&rdquo; (lives je 3. os. j.č.)."}]},{"level":"B1","title":"Family traditions","titleCz":"Rodinné tradice","sentence":"We always celebrate Christmas together. It is our favourite tradition.","sentenceCz":"Vždy slavíme Vánoce společně. Je to naše oblíbená tradice.","phonetic":"wi ólwejz selibrét krismus tugedher. it iz aur fejvrit tradišen","blocks":[["We always celebrate","Vždy slavíme"],["Christmas together","Vánoce společně"],["our favourite tradition","naše oblíbená tradice"]],"grammar":"<b>always</b> = vždy (stojí před hlavním slovesem: we <b>always celebrate</b>). <b>favourite</b> = oblíbený (britský pravopis; American: <b>favorite</b>). <b>tradition</b> = tradice.","correct_tokens":["We","always","celebrate","Christmas","together","It","is","our","favourite","tradition"],"distractor_tokens":["never","party","every","year","best","thing","family"],"context":"Does your family have any special traditions?","contextCz":"Má vaše rodina nějaké zvláštní tradice?","choices":[{"text":"We always celebrate Christmas together. It is our favourite tradition.","textCz":"Vždy slavíme Vánoce společně. Je to naše oblíbená tradice.","correct":true,"kind":"correct","explain":""},{"text":"We celebrate always Christmas.","textCz":"Slavíme vždy Vánoce.","correct":false,"kind":"grammar","explain":"Příslovce <b>always</b> stojí PŘED hlavním slovesem, ale ZA slovesem be: <b>We always celebrate</b>."},{"text":"We always celebrate Christmas. It is our most favourite tradition.","textCz":"...","correct":false,"kind":"grammar","explain":"&bdquo;Most favourite&rdquo; je dvojí superlativ &mdash; chyba. Správně jen <b>favourite</b> nebo <b>our most beloved tradition</b>."}]}]},{"slug":"maly-talk","emoji":"💬","title":"Small talk","titleCz":"Malý talk","dialogs":[{"level":"A0","title":"How are you?","titleCz":"Jak se máš?","sentence":"I am fine, thank you. And you?","sentenceCz":"Dobře, děkuji. A ty?","phonetic":"aj em fajn, senk jú. end jú?","blocks":[["I am fine","Dobře / Jsem v pořádku"],["thank you","děkuji"],["And you?","A ty?"]],"grammar":"<b>Fine</b> = dobře/v pořádku. Alternativy: <b>Great</b>, <b>Not bad</b>, <b>Pretty good</b>. <b>And you?</b> = zdvořilá otázka zpět &mdash; vždy se hodí!","correct_tokens":["I","am","fine","thank","you","And","you"],"distractor_tokens":["good","thanks","How","doing","well","are"],"context":"Hi! How are you today?","contextCz":"Ahoj! Jak se dnes máš?","choices":[{"text":"I am fine, thank you. And you?","textCz":"Dobře, děkuji. A ty?","correct":true,"kind":"correct","explain":""},{"text":"I am fine and you?","textCz":"Dobře a ty?","correct":false,"kind":"meaning","explain":"Chybí &bdquo;thank you&rdquo; &mdash; v angličtině se zdvořilostní výraz vynechávat nemá. Ale věta je gramaticky přijatelná."},{"text":"I fine, thank you.","textCz":"(Nesmysl &mdash; chybí sloveso.)","correct":false,"kind":"grammar","explain":"V angličtině nelze vynechat sloveso být. Správně: <b>I <u>am</u> fine.</b>"}]},{"level":"A0","title":"Talking about the weather","titleCz":"O počasí","sentence":"It is sunny today. I love this weather!","sentenceCz":"Dnes svítí slunce. Miluji toto počasí!","phonetic":"it iz sani tudej. aj lav dhis wedher","blocks":[["It is sunny","Svítí slunce"],["today","dnes"],["I love this weather","Miluji toto počasí"]],"grammar":"<b>It is sunny</b> = svítí slunce (počasí se vyjadřuje pomocí <b>It is + adjektiva</b>). <b>this weather</b> &mdash; určitý odkaz na konkrétní počasí. <b>love</b> = milovat (silné).","correct_tokens":["It","is","sunny","today","I","love","this","weather"],"distractor_tokens":["are","nice","a","outside","like","the","day"],"context":"What's the weather like today?","contextCz":"Jaké je dnes počasí?","choices":[{"text":"It is sunny today. I love this weather!","textCz":"Dnes svítí slunce. Miluji toto počasí!","correct":true,"kind":"correct","explain":""},{"text":"Today is sunny. I love this weather!","textCz":"Dnes je slunečno.","correct":false,"kind":"meaning","explain":"Gramaticky přijatelné, ale v angličtině je pro počasí idiomatičtější <b>It is sunny</b> než &bdquo;Today is sunny&rdquo;."},{"text":"It is sun today.","textCz":"Dnes je slunce.","correct":false,"kind":"grammar","explain":"Nepíšeme podstatné jméno &bdquo;sun&rdquo;, ale přídavné jméno <b>sunny</b>: <b>It is sunny.</b>"}]},{"level":"A1","title":"Weekend plans","titleCz":"Plány na víkend","sentence":"I am going to visit my friends this weekend.","sentenceCz":"Tento víkend navštívím přátele.","phonetic":"aj em góin tu vizit maj frendz dhis wikend","blocks":[["I am going to","Chystám se / Mám v plánu"],["visit my friends","navštívit přátele"],["this weekend","tento víkend"]],"grammar":"<b>be going to + infinitiv</b> = plánovaná budoucí akce. <b>this weekend</b> = tento víkend (bez členu). <b>friends</b> = přátelé (množné číslo, proto bez &bdquo;a&rdquo;).","correct_tokens":["I","am","going","to","visit","my","friends","this","weekend"],"distractor_tokens":["will","go","see","meet","the","next","plan"],"context":"Do you have any plans for the weekend?","contextCz":"Máš plány na víkend?","choices":[{"text":"I am going to visit my friends this weekend.","textCz":"Tento víkend navštívím přátele.","correct":true,"kind":"correct","explain":""},{"text":"I will visit my friends this weekend.","textCz":"Navštívím přátele tento víkend.","correct":false,"kind":"meaning","explain":"Také správně! <b>will</b> vyjadřuje rozhodnutí na místě, <b>going to</b> plánovanou akci. Obě jsou OK."},{"text":"I am going visit my friends.","textCz":"(Chybí &bdquo;to&rdquo;.)","correct":false,"kind":"grammar","explain":"Po <b>going</b> MUSÍ stát <b>to</b> + infinitiv: <b>going <u>to</u> visit</b>."}]},{"level":"A1","title":"Talking about hobbies briefly","titleCz":"Krátce o koníčcích","sentence":"I enjoy reading books in my free time.","sentenceCz":"Ve volném čase rád/a čtu knihy.","phonetic":"aj injoj rídin buks in maj frí tajm","blocks":[["I enjoy","Rád/a"],["reading books","čtu knihy"],["in my free time","ve volném čase"]],"grammar":"<b>enjoy + -ing</b> = rád + podstatné jméno slovesné. Nikdy: &bdquo;enjoy to read&rdquo; &mdash; to je chyba! <b>free time</b> = volný čas.","correct_tokens":["I","enjoy","reading","books","in","my","free","time"],"distractor_tokens":["like","read","the","doing","at","spare","pastime"],"context":"What do you like to do in your free time?","contextCz":"Co rád/a děláš ve volném čase?","choices":[{"text":"I enjoy reading books in my free time.","textCz":"Ve volném čase rád/a čtu knihy.","correct":true,"kind":"correct","explain":""},{"text":"I enjoy to read books in my free time.","textCz":"...","correct":false,"kind":"grammar","explain":"Po <b>enjoy</b> NE infinitiv, ale gerundium (-ing): <b>enjoy reading</b>, nikdy &bdquo;enjoy to read&rdquo;."},{"text":"I like read books in my free time.","textCz":"...","correct":false,"kind":"grammar","explain":"Po <b>like</b> musí být <b>to read</b> nebo <b>reading</b>: <b>I like to read</b> / <b>I like reading</b>."}]},{"level":"A2","title":"Giving a compliment","titleCz":"Kompliment","sentence":"You look great today! I really like your jacket.","sentenceCz":"Dnes skvěle vypadáš! Tvoje bunda se mi opravdu líbí.","phonetic":"jú luk grejt tudej. aj ríli lajk jór džekit","blocks":[["You look great","Skvěle vypadáš"],["today","dnes"],["I really like your jacket","Tvoje bunda se mi líbí"]],"grammar":"<b>You look + adjektiva</b> = vypadáš + jak. <b>really</b> = opravdu (zesiluje přídavné jméno/sloveso). <b>I like</b> = líbí se mi (ne &bdquo;I am liking&rdquo; &mdash; <b>like</b> je stavové sloveso).","correct_tokens":["You","look","great","today","I","really","like","your","jacket"],"distractor_tokens":["are","nice","looking","so","love","coat","wear"],"context":"You want to compliment your colleague.","contextCz":"Chceš pochválit kolegu/kolegyni.","choices":[{"text":"You look great today! I really like your jacket.","textCz":"Dnes skvěle vypadáš! Tvoje bunda se mi opravdu líbí.","correct":true,"kind":"correct","explain":""},{"text":"You are looking great today!","textCz":"Skvěle vypadáš.","correct":false,"kind":"meaning","explain":"Gramaticky OK v britské angličtině pro přechodný stav, ale v komplimentu je přítomný prostý (<b>look</b>) přirozenější."},{"text":"I am really liking your jacket.","textCz":"(Špatný průběhový čas.)","correct":false,"kind":"grammar","explain":"<b>like</b> je stavové sloveso → nepoužíváme průběhový čas. Správně: <b>I really like your jacket.</b>"}]},{"level":"A2","title":"Talking about the news","titleCz":"O novinkách","sentence":"Did you hear about the football match last night?","sentenceCz":"Slyšel/a jsi o včerejším fotbalovém zápase?","phonetic":"did jú hír əbaut dhe futból mäč lást najt?","blocks":[["Did you hear","Slyšel/a jsi"],["about","o"],["the football match","fotbalovém zápase"],["last night","včera večer"]],"grammar":"<b>Did you hear...?</b> = Slyšel/a jsi...? (minulý čas prostý v otázce). <b>last night</b> = včera večer. <b>about</b> = o (tématu).","correct_tokens":["Did","you","hear","about","the","football","match","last","night"],"distractor_tokens":["do","know","the","game","yesterday","evening","score"],"context":"You want to start a conversation about sports.","contextCz":"Chceš zahájit konverzaci o sportu.","choices":[{"text":"Did you hear about the football match last night?","textCz":"Slyšel/a jsi o včerejším fotbalovém zápase?","correct":true,"kind":"correct","explain":""},{"text":"Did you heard about the football match?","textCz":"(Špatný tvar slovesa.)","correct":false,"kind":"grammar","explain":"V otázce s &bdquo;did&rdquo; se používá základní tvar: <b>did you hear</b>, ne &bdquo;did you heard&rdquo;."},{"text":"Have you heard about the football match last night?","textCz":"Slyšel/a jsi o fotbalovém zápase?","correct":false,"kind":"meaning","explain":"Gramaticky správně, ale &bdquo;last night&rdquo; (konkrétní čas) se lépe pojí s minulým prostým, ne předpřítomným."}]},{"level":"B1","title":"Discussing plans","titleCz":"Plány","sentence":"I am thinking about taking a Spanish course next year.","sentenceCz":"Přemýšlím o tom, že si příští rok udělám kurz španělštiny.","phonetic":"aj em synkin əbaut tejkin ə speniš kórs nekst jír","blocks":[["I am thinking about","Přemýšlím o tom"],["taking a Spanish course","udělat si kurz španělštiny"],["next year","příští rok"]],"grammar":"<b>think about + -ing</b> = přemýšlet o + slovesném podstatném jménu. <b>next year</b> = příští rok (bez členu). Průběhový čas <b>I am thinking</b> naznačuje, že přemýšlíš právě teď.","correct_tokens":["I","am","thinking","about","taking","a","Spanish","course","next","year"],"distractor_tokens":["plan","consider","to","take","the","class","lesson"],"context":"Do you have any long-term plans?","contextCz":"Máš nějaké dlouhodobé plány?","choices":[{"text":"I am thinking about taking a Spanish course next year.","textCz":"Přemýšlím o tom, že si příští rok udělám kurz španělštiny.","correct":true,"kind":"correct","explain":""},{"text":"I am thinking to take a Spanish course.","textCz":"...","correct":false,"kind":"grammar","explain":"<b>think about</b> + gerundium: <b>thinking about taking</b>, ne &bdquo;thinking to take&rdquo;."},{"text":"I think about to take a Spanish course next year.","textCz":"...","correct":false,"kind":"grammar","explain":"Dvě chyby: <b>I am thinking</b> (průběhový čas pro aktuální přemýšlení) a <b>about taking</b> (gerundium, ne infinitiv)."}]}]},{"slug":"prace","emoji":"💼","title":"Work & Job","titleCz":"Práce","dialogs":[{"level":"A1","title":"What is your job?","titleCz":"Jaká je tvoje práce?","sentence":"I work as a software developer.","sentenceCz":"Pracuji jako softwarový vývojář.","phonetic":"aj wörk ez ə softwer diveleper","blocks":[["I work as","Pracuji jako"],["a software developer","softwarový vývojář"]],"grammar":"<b>work as + povolání</b> = pracovat jako. Alternativa: <b>I am a software developer</b>. Obě jsou správně, ale <b>work as</b> zdůrazňuje roli.","correct_tokens":["I","work","as","a","software","developer"],"distractor_tokens":["am","the","an","in","programmer","job"],"context":"What do you do for work?","contextCz":"Čím se živíš?","choices":[{"text":"I work as a software developer.","textCz":"Pracuji jako softwarový vývojář.","correct":true,"kind":"correct","explain":""},{"text":"I work like a software developer.","textCz":"(Špatná předložka.)","correct":false,"kind":"grammar","explain":"<b>work as</b> = pracovat v roli. &bdquo;Work like&rdquo; = pracovat jako (přirovnání) &mdash; to je jiný význam!"},{"text":"I am working as software developer.","textCz":"(Chybí člen.)","correct":false,"kind":"grammar","explain":"Průběhový čas v tomto kontextu není ideální a chybí člen: <b>a software developer</b>."}]},{"level":"A1","title":"Where do you work?","titleCz":"Kde pracuješ?","sentence":"I work for a company in Prague.","sentenceCz":"Pracuji pro firmu v Praze.","phonetic":"aj wörk for ə kampeni in prág","blocks":[["I work for","Pracuji pro"],["a company","firmu"],["in Prague","v Praze"]],"grammar":"<b>work for + firma</b> = pracovat pro. <b>work at + místo</b> = pracovat na místě (work at the office). Rozlišuj: <b>for</b> (zaměstnavatel) vs. <b>at</b> (místo).","correct_tokens":["I","work","for","a","company","in","Prague"],"distractor_tokens":["at","the","business","firm","from","to","an"],"context":"Where do you work?","contextCz":"Kde pracuješ?","choices":[{"text":"I work for a company in Prague.","textCz":"Pracuji pro firmu v Praze.","correct":true,"kind":"correct","explain":""},{"text":"I work at a company in Prague.","textCz":"Pracuji ve firmě v Praze.","correct":false,"kind":"meaning","explain":"Gramaticky OK! <b>at</b> = na místě, <b>for</b> = pro zaměstnavatele. Obě jsou přijatelné, ale s jiným důrazem."},{"text":"I work in a company in Prague.","textCz":"Pracuji ve firmě v Praze.","correct":false,"kind":"meaning","explain":"Také přijatelné! <b>in a company</b> = ve firmě (uvnitř). <b>for a company</b> je ale idiomatičtější."}]},{"level":"A2","title":"Describing your work","titleCz":"Popis práce","sentence":"I have a meeting every Monday morning.","sentenceCz":"Každé pondělní ráno mám schůzku.","phonetic":"aj hev ə mítin evri mandej mornin","blocks":[["I have a meeting","Mám schůzku"],["every Monday morning","každé pondělní ráno"]],"grammar":"<b>every Monday morning</b> = každé pondělní ráno (pravidelná akce → přítomný prostý). <b>meeting</b> = schůzka/porada. Bez členu: <b>every Monday</b> (ne &bdquo;every the Monday&rdquo;).","correct_tokens":["I","have","a","meeting","every","Monday","morning"],"distractor_tokens":["am","the","on","Mondays","meetings","weekly","at"],"context":"How does your typical work week look?","contextCz":"Jak vypadá tvůj typický pracovní týden?","choices":[{"text":"I have a meeting every Monday morning.","textCz":"Každé pondělní ráno mám schůzku.","correct":true,"kind":"correct","explain":""},{"text":"I have a meeting every Mondays morning.","textCz":"(Špatný tvar.)","correct":false,"kind":"grammar","explain":"<b>every Monday</b> (j.č., bez -s). &bdquo;Every Mondays&rdquo; je chyba &mdash; every vždy následuje j.č."},{"text":"I am having a meeting every Monday.","textCz":"(Špatný čas.)","correct":false,"kind":"grammar","explain":"Pro pravidelné akce používáme přítomný prostý: <b>I have</b>, ne průběhový &bdquo;I am having&rdquo;."}]},{"level":"A2","title":"Talking about your boss","titleCz":"O šéfovi","sentence":"My boss is very supportive. She gives us clear feedback.","sentenceCz":"Můj šéf/šéfová je velmi podpůrný/á. Dává nám jasnou zpětnou vazbu.","phonetic":"maj bos iz veri sepórtiv. ši givz as klír fídbek","blocks":[["My boss is very supportive","Můj šéf je velmi podpůrný"],["She gives us","Dává nám"],["clear feedback","jasnou zpětnou vazbu"]],"grammar":"<b>supportive</b> = podpůrný, vstřícný. <b>gives us feedback</b> &mdash; dvojí předmět: <b>gives + komu (us) + co (feedback)</b>. <b>clear</b> = jasný.","correct_tokens":["My","boss","is","very","supportive","She","gives","us","clear","feedback"],"distractor_tokens":["manager","so","helpful","gives","me","good","review"],"context":"What is your boss like?","contextCz":"Jaký je tvůj šéf?","choices":[{"text":"My boss is very supportive. She gives us clear feedback.","textCz":"Můj šéf/šéfová je velmi podpůrný/á. Dává nám jasnou zpětnou vazbu.","correct":true,"kind":"correct","explain":""},{"text":"My boss is very supporting.","textCz":"(Špatné adjektivum.)","correct":false,"kind":"grammar","explain":"<b>supportive</b> (přídavné jméno), ne &bdquo;supporting&rdquo; (příčestí). &bdquo;She is very supporting us&rdquo; má jiný smysl."},{"text":"My boss gives to us feedback.","textCz":"(Nadbytečná předložka.)","correct":false,"kind":"grammar","explain":"S <b>give</b> se předložka &bdquo;to&rdquo; nepoužívá, pokud je předmět zájmeno: <b>gives us feedback</b>, ne &bdquo;gives to us&rdquo;."}]},{"level":"B1","title":"Job interview","titleCz":"Pracovní pohovor","sentence":"I have experience working with international teams.","sentenceCz":"Mám zkušenosti s prací v mezinárodních týmech.","phonetic":"aj hev ikspíriens wörkin widh internešenel tímz","blocks":[["I have experience","Mám zkušenosti"],["working with","s prací s"],["international teams","mezinárodními týmy"]],"grammar":"<b>experience working with</b> = zkušenost s prací s (gerundium po podstatném jménu). <b>international</b> = mezinárodní. Neříkáme &bdquo;experience to work&rdquo; &mdash; to je chyba!","correct_tokens":["I","have","experience","working","with","international","teams"],"distractor_tokens":["had","am","experiences","work","from","global","team"],"context":"Tell me about your professional experience.","contextCz":"Řekněte mi o svých pracovních zkušenostech.","choices":[{"text":"I have experience working with international teams.","textCz":"Mám zkušenosti s prací v mezinárodních týmech.","correct":true,"kind":"correct","explain":""},{"text":"I have experience to work with international teams.","textCz":"...","correct":false,"kind":"grammar","explain":"Po <b>experience</b> gerundium: <b>experience working</b>, ne &bdquo;experience to work&rdquo;."},{"text":"I have experiences working with international teams.","textCz":"...","correct":false,"kind":"meaning","explain":"<b>experience</b> je nepočitatelné podstatné jméno → bez -s. &bdquo;Experiences&rdquo; má jiný odstín (konkrétní zážitky)."}]},{"level":"B1","title":"Working from home","titleCz":"Práce z domu","sentence":"I usually work from home three days a week.","sentenceCz":"Obvykle pracuji z domu třikrát týdně.","phonetic":"aj júžueli wörk from hóum srí dejz ə wík","blocks":[["I usually work from home","Obvykle pracuji z domu"],["three days a week","třikrát týdně"]],"grammar":"<b>usually</b> = obvykle (před hlavním slovesem). <b>three days a week</b> = třikrát týdně (ne &bdquo;three times a week&rdquo; pro dny!). <b>work from home</b> = pracovat z domova.","correct_tokens":["I","usually","work","from","home","three","days","a","week"],"distractor_tokens":["often","remote","at","the","times","per","days"],"context":"Do you work from the office or from home?","contextCz":"Pracuješ z kanceláře nebo z domova?","choices":[{"text":"I usually work from home three days a week.","textCz":"Obvykle pracuji z domu třikrát týdně.","correct":true,"kind":"correct","explain":""},{"text":"I usually work from home three times a week.","textCz":"Obvykle pracuji z domu třikrát týdně.","correct":false,"kind":"meaning","explain":"Gramaticky správně! &bdquo;Three times a week&rdquo; = třikrát týdně, ale pokud myslíš konkrétní dny, přirozenější je &bdquo;three days a week&rdquo;."},{"text":"I work usually from home three days in a week.","textCz":"...","correct":false,"kind":"grammar","explain":"<b>usually</b> stojí před hlavním slovesem: <b>I usually work</b>. A správně: <b>three days a week</b>, ne &bdquo;in a week&rdquo;."}]},{"level":"B1","title":"Career ambitions","titleCz":"Kariérní ambice","sentence":"I would like to become a project manager in the future.","sentenceCz":"V budoucnu bych chtěl/a stát se projektovým manažerem.","phonetic":"aj wud lajk tu bikam ə prodžekt menedžer in dhe fjúčer","blocks":[["I would like to","Chtěl/a bych"],["become a project manager","stát se projektovým manažerem"],["in the future","v budoucnu"]],"grammar":"<b>would like to + infinitiv</b> = chtěl/a bych (zdvořilá forma přání). <b>become</b> = stát se. <b>in the future</b> = v budoucnu (s určitým členem <b>the</b>).","correct_tokens":["I","would","like","to","become","a","project","manager","in","the","future"],"distractor_tokens":["want","be","an","manager","someday","career","goal"],"context":"Where do you see yourself in five years?","contextCz":"Kde se vidíš za pět let?","choices":[{"text":"I would like to become a project manager in the future.","textCz":"V budoucnu bych chtěl/a stát se projektovým manažerem.","correct":true,"kind":"correct","explain":""},{"text":"I want to become a project manager in future.","textCz":"...","correct":false,"kind":"grammar","explain":"Chybí určitý člen: <b>in the future</b>, ne &bdquo;in future&rdquo;. (In future = britský idiom pro &bdquo;od teď dál&rdquo;.)"},{"text":"I would like become a project manager.","textCz":"...","correct":false,"kind":"grammar","explain":"Po <b>would like</b> VŽDY infinitiv s <b>to</b>: <b>would like <u>to</u> become</b>."}]}]},{"slug":"kavarna","emoji":"☕","title":"Café & Restaurant","titleCz":"Kavárna a restaurace","dialogs":[{"level":"A0","title":"Ordering a drink","titleCz":"Objednávám nápoj","sentence":"I would like a coffee, please.","sentenceCz":"Prosím kávu.","phonetic":"aj wud lajk ə kofi, plíz","blocks":[["I would like","Prosím / Rád/a bych"],["a coffee","kávu"],["please","prosím"]],"grammar":"<b>I would like</b> = zdvořilá objednávka (ne &bdquo;I want&rdquo; &mdash; to zní nezdvořile). <b>please</b> vždy na konci nebo na začátku. <b>a coffee</b> &mdash; neurčitý člen (jedna káva).","correct_tokens":["I","would","like","a","coffee","please"],"distractor_tokens":["want","can","have","the","some","cup"],"context":"What can I get you?","contextCz":"Co si dáte?","choices":[{"text":"I would like a coffee, please.","textCz":"Prosím kávu.","correct":true,"kind":"correct","explain":""},{"text":"I want a coffee.","textCz":"Chci kávu.","correct":false,"kind":"meaning","explain":"Gramaticky správně, ale &bdquo;I want&rdquo; zní v angličtině nezdvořile. V obchodech a restauracích vždy raději <b>I would like</b>."},{"text":"Can I have a coffee?","textCz":"Mohl/a bych dostat kávu?","correct":false,"kind":"meaning","explain":"Také správně a zdvořile! <b>Can/Could I have...?</b> je alternativa k <b>I would like</b>."}]},{"level":"A0","title":"Ordering food","titleCz":"Objednávám jídlo","sentence":"I will have the chicken soup, please.","sentenceCz":"Prosím kuřecí polévku.","phonetic":"aj wil hev dhe čikin súp, plíz","blocks":[["I will have","Vezmu si / Dám si"],["the chicken soup","kuřecí polévku"],["please","prosím"]],"grammar":"<b>I'll have</b> = vezmou si (při objednávání). Určitý člen <b>the</b> &mdash; odkazuješ na konkrétní položku z jídelníčku. <b>chicken soup</b> = kuřecí polévka.","correct_tokens":["I","will","have","the","chicken","soup","please"],"distractor_tokens":["would","like","a","some","order","want","take"],"context":"Are you ready to order?","contextCz":"Jste připraveni objednat?","choices":[{"text":"I will have the chicken soup, please.","textCz":"Prosím kuřecí polévku.","correct":true,"kind":"correct","explain":""},{"text":"I would like the chicken soup, please.","textCz":"Prosím kuřecí polévku.","correct":false,"kind":"meaning","explain":"Také správně a zdvořilé! &bdquo;I'll have&rdquo; i &bdquo;I would like&rdquo; jsou v restauraci zcela rovnocenné."},{"text":"I want chicken soup please.","textCz":"Chci kuřecí polévku.","correct":false,"kind":"meaning","explain":"&bdquo;I want&rdquo; zní nezdvořile a chybí určitý člen: <b>the chicken soup</b>."}]},{"level":"A1","title":"Paying the bill","titleCz":"Placení účtu","sentence":"Could I have the bill, please?","sentenceCz":"Mohl/a bych dostat účet, prosím?","phonetic":"kud aj hev dhe bil, plíz?","blocks":[["Could I have","Mohl/a bych dostat"],["the bill","účet"],["please","prosím"]],"grammar":"<b>Could I have...?</b> = velmi zdvořilá prosba. <b>the bill</b> (UK) = <b>the check</b> (US) &mdash; oba jsou správně. <b>Could</b> je zdvořilejší než &bdquo;Can&rdquo;.","correct_tokens":["Could","I","have","the","bill","please"],"distractor_tokens":["Can","May","get","a","check","please","pay"],"context":"How do you ask for the bill?","contextCz":"Jak požádáš o účet?","choices":[{"text":"Could I have the bill, please?","textCz":"Mohl/a bych dostat účet, prosím?","correct":true,"kind":"correct","explain":""},{"text":"Can I have the bill?","textCz":"Mohu dostat účet?","correct":false,"kind":"meaning","explain":"Také správně a zdvořile! <b>Could</b> je o stupeň zdvořilejší než &bdquo;Can&rdquo;, ale obě jsou přijatelné."},{"text":"I want the bill!","textCz":"Chci účet!","correct":false,"kind":"meaning","explain":"&bdquo;I want&rdquo; bez &bdquo;please&rdquo; zní hrubě. V restauraci vždy <b>Could I have the bill, please?</b>"}]},{"level":"A1","title":"Making et?"]],"grammar":"<b>check out</b> = odhlásit se z hotelu (frázové sloveso). <b>bill</b> (UK) = <b>check</b> (US) = účet. <b>my bill</b> &mdash; přivlastňovací zájmeno (tvůj osobní účet).","correct_tokens":["I","would","like","to","check","out","Can","I","have","my","bill"],"distractor_tokens":["leave","go","receipt","invoice","the","pay","settle"],"context":"It's time to leave the hotel. What do you say at reception?","contextCz":"Je čas odjet z hotelu. Co řekneš na recepci?","choices":[{"text":"I would like to check out. Can I have my bill?","textCz":"Chtěl/a bych se odhlásit. Mohu dostat účet?","correct":true,"kind":"correct","explain":""},{"text":"I would like to check out and pay.","textCz":"Chtěl/a bych se odhlásit a zaplatit.","correct":false,"kind":"meaning","explain":"Správně, ale neptáš se na účet. Lepší je vždy požádat o účet explicitně."},{"text":"I want check out. Bill please.","textCz":"(Nezdvořilé a neúplné.)","correct":false,"kind":"grammar","explain":"Po <b>want</b> VŽDY infinitiv: <b>want to check out</b>. A věta je příliš stroze."}]},{"level":"B1","title":"Complaining about the room","titleCz":"Stížnost na pokoj","sentence":"I am afraid the room is not what I expected. The air conditioning is not working.","sentenceCz":"Obávám se, že pokoj není takový, jak jsem očekával/a. Klimatizace nefunguje.","phonetic":"aj em əfrejd dhe rúm iz not wot aj ikspektid. dhe er kondišenin iz not wörkin","blocks":[["I am afraid","Obávám se / Bohužel"],["not what I expected","ne takový, jak jsem očekával/a"],["not working","nefunguje"]],"grammar":"<b>I am afraid</b> = obávám se / bohužel (jemný způsob, jak říct špatnou zprávu). <b>not what I expected</b> = ne to, co jsem očekával. <b>not working</b> = nefunguje (průběhový čas pro aktuální stav).","correct_tokens":["I","am","afraid","the","room","is","not","what","I","expected","The","air","conditioning","is","not","working"],"distractor_tokens":["sorry","think","condition","broken","expected","as","described"],"conte hed","Sledoval/a jsem"],["a brilliant documentary","skvělý dokumentární film"],["about the ocean","o oceánu"]],"grammar":"<b>documentary</b> = dokumentární film. <b>brilliant</b> = skvělý (britský výraz). <b>last night</b> = včera večer (minulý čas). <b>about</b> = o (předložka tématu).","correct_tokens":["I","watched","a","brilliant","documentary","last","night","It","was","about","the","ocean"],"distractor_tokens":["saw","amazing","movie","film","yesterday","sea","marine"],"context":"Describe a film you watched recently.","contextCz":"Popiš film, který jsi nedávno viděl/a.","choices":[{"text":"I watched a brilliant documentary last night. It was about the ocean.","textCz":"Včera večer jsem sledoval/a skvělý dokumentární film. Byl o oceánu.","correct":true,"kind":"correct","explain":""},{"text":"I saw a great documentary yesterday. It was about the ocean.","textCz":"Včera jsem viděl/a skvělý dokumentární film. Byl o oceánu.","correct":false,"kind":"meaning","explain":"Také správně! <b>saw</b> a <b>watched</b> jsou synonyma. <b>great</b> a <b>brilliant</b> také."},{"text":"I have watched brilliant documentary last night.","textCz":"(Špatná kombinace časů.)","correct":false,"kind":"grammar","explain":"&bdquo;last night&rdquo; (konkrétní čas) → minulý prostý: <b>I watched</b>, ne předpřítomný."}]},{"level":"A2","title":"Recommending things to do","titleCz":"Doporučení aktivit","sentence":"If you have time, you should visit the National Gallery.","sentenceCz":"Pokud máš čas, měl/a bys navštívit Národní galerii.","phonetic":"if jú hev tajm, jú šud vizit dhe näšenel geleri","blocks":[["If you have time","Pokud máš čas"],["you should visit","měl/a bys navštívit"],["the National Gallery","Národní galerii"]],"grammar":"<b>If you have time</b> = podmínková věta (přítomný prostý). <b>you should</b> = měl/a bys (rada). <b>the National Gallery</b> &mdash; určitý člen (jde o specifické místo).","correct_tokens":["If","you","have","time","you","should","visit","the","National","Gallery"],"distractor_tokens":["get","chance","must","go","see","museum","art"],"context":"What do you recommend to a tourist in your city?","contextCz":"Co doporučíš turistovi ve svém městě?","choices":[{"text":"If you have time, you should visit the National Gallery.","textCz":"Pokud máš čas, měl/a bys navštívit Národní galerii.","correct":true,"kind":"correct","explain":""},{"text":"I recommend visiting the National Gallery.","textCz":"Doporučuji návštěvu Národní galerie.","correct":false,"kind":"meaning","explain":"Také správně! <b>recommend + gerundium</b> je elegantní alternativa."},{"text":"If you have time, you should to visit the National Gallery.","textCz":"(Nadbytečné &bdquo;to&rdquo;.)","correct":false,"kind":"grammar","explain":"Po <b>should</b> NIKDY <b>to</b>: <b>should visit</b> (ne &bdquo;should to visit&rdquo;)."}]},{"level":"B1","title":"Discussing music","titleCz":"O hudbě","sentence":"I have been listening to jazz a lot recently. It really helps me focus.","sentenceCz":"Poslední dobou hodně poslouchám jazz. Opravdu mi pomáhá soustředit se.","phonetic":"aj hev bín lisenin tu džez ə lot rísently. it ríli helpz mi foukes","blocks":[["I have been listening to jazz","Poslouchám jazz"],["a lot recently","hodně poslední dobou"],["helps me focus","pomáhá mi soustředit se"]],"grammar":"<b>I have been listening</b> = předpřítomný průběhový (akce trvá od minulosti do teď). <b>a lot recently</b> = hodně poslední dobou (<b>recently</b> s předpřítomným časem). <b>helps me focus</b> = pomáhá mi se soustředit.","correct_tokens":["I","have","been","listening","to","jazz","a","lot","recently","It","really","helps","me","focus"],"distractor_tokens":["started","into","classical","music","much","lately","concentrate"],"context":"What kind of music do you enjoy lately?","contextCz":"Jakou hudbu posloucháš poslední dobou?","choices":[{"text":"I have been listening to jazz a lot recently. It really helps me focus.","textCz":"Poslouchám jazz hodně poslední dobou. Opravdu let ac='en-GB',cS=null,cD=0,cSt=0,pl=[],dn={},mr=null,rec=false,ac2=[];

function setA(a){ac=a;document.getElementById('bGB').classList.toggle('active',a==='en-GB');document.getElementById('bUS').classList.toggle('active',a==='en-US');}

function spk(t,r){r=r||1;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=ac;u.rate=r;const vs=window.speechSynthesis.getVoices();const v=vs.find(v=>v.lang.startsWith(ac==='en-GB'?'en-GB':'en-US'));if(v)u.voice=v;window.speechSynthesis.speak(u);}

function rHome(){
  const g=document.getElementById('sGrid');g.innerHTML='';
  S.forEach((s,i)=>{
    const done=s.dialogs.every((_,j)=>dn[i+'_'+j]);
    const d=document.createElement('div');
    d.className='sit-card'+(done?' done-card':'');
    d.innerHTML='<div class="emoji">'+s.emoji+'</div><div class="name">'+s.titleCz+'</div><div class="cnt">'+s.dialogs.length+' dialog&#367;</div>';
    d.onclick=()=>oS(i);g.appendChild(d);
  });
}

function gH(){document.getElementById('vHome').classList.remove('hidden');document.getElementById('vSit').classList.add('hidden');rHome();}

function oS(i){cS=i;cD=0;cSt=0;document.getElementById('vHome').classList.add('hidden');document.getElementById('vSit').classList.remove('hidden');document.getElementById('sTitle').textContent=S[i].emoji+' '+S[i].titleCz;rBar();rStep();}

function rBar(){
  const bar=document.getElementById('dBar');bar.innerHTML='';
  S[cS].dialogs.forEach((d,i)=>{
    const p=document.createElement('button');
    p.className='dialog-pill'+(i===cD?' active':'')+(dn[cS+'_'+i]?' done-pill':'');
    p.innerHTML=d.titleCz+' <span class="dlvl">'+d.level+'</span>';
    p.onclick=()=>{cD=i;cSt=0;pl=[];rBar();rStep();};
    bar.appendChild(p);
  });
}

function dts(){return '<div class="pdots">'+[0,1,2,3,4].map(i=>'<div class="pd'+(i===cSt?' ac':i<cSt?' dn':'')+'"></div>').join('')+'</div>';}

function rStep(){
  const d=S[cS].dialogs[cD];const a=document.getElementById('sArea');
  if(cSt===0)s0(d,a);else if(cSt===1)s1(d,a);else if(cSt===2)s2(d,a);else if(cSt===3)s3(d,a);else s4(d,a);
}

function nx(){cSt++;rStep();}

function s0(d,a){
  a.innerHTML=dts()+'<div class="step-card"><div class="step-hdr"><div class="step-num">1</div><div><div class="step-lbl">Poslouchej a &ccaron;ti</div><div class="step-sub">Klikni na p&rcaron;ehr&aacute;t</div></div></div>'
  +'<div class="sen-box"><div class="sen-main">'+d.sentence+'</div><div class="sen-tr">'+d.sentenceCz+'</div><div class="sen-ph">[ '+d.phonetic+' ]</div></div>'
  +'<div class="play-row"><button class="play-btn n" onclick="spk(\''+e(d.sentence)+'\')">&#9654; P&rcaron;ehr&aacute;t</button>'
  +'<button class="play-btn s" onclick="spk(\''+e(d.sentence)+'\',.6)">&#128034; Pomalu</button></div></div>'
  +'<button class="abtn pr" onclick="nx()">Rozum&iacute;m &rarr;</button>';
}

function s1(d,a){
  const rows=d.blocks.map(b=>'<div class="brow"><div class="ben">'+b[0]+'</div><div class="bsep"></div><div class="bcz">'+b[1]+'</div></div>').join('');
  a.innerHTML=dts()+'<div class="step-card"><div class="step-hdr"><div class="step-num">2</div><div><div class="step-lbl">Kl&iacute;&ccaron;ov&aacute; slova</div><div class="step-sub">P&rcaron;e&ccaron;ti si</div></div></div>'
  +'<div class="blocks-wrap">'+rows+'</div><div class="gnote">'+d.grammar+'</div></div>'
  +'<button class="abtn pr" onclick="nx()">Rozum&iacute;m &rarr;</button>';
}

function s2(d,a){
  pl=[];
  const all=[...d.correct_tokens,...d.distractor_tokens].sort(()=>Math.random()-.5);
  a.innerHTML=dts()+'<div class="step-card"><div class="step-hdr"><div class="step-num">3</div><div><div class="step-lbl">Poskl&aacute;dej v&ecaron;tu</div><div class="step-sub">Klikni na slova</div></div></div>'
  +'<div class="ctx-box"><div class="ctx-lbl">Situace</div>'+d.contextCz+'</div>'
  +'<div class="build-area" id="bA"><span style="color:var(--muted);font-size:13px">Sem p&rcaron;i&rcaron;a&rcaron; slova&hellip;</span></div>'
  +'<div class="token-bank">'+all.map((t,i)=>'<div class="tok bk" id="t'+i+'" data-w="'+e(t)+'" onclick="tk(this)">'+t+'</div>').join('')+'</div>'
  +'<div id="bFb"></div></div>'
  +'<button class="abtn pr" onclick="chkB()">&#10003; Zkontrolovat</button>'
  +'<button class="abtn se" onclick="clrB()">&#8634; Vymazat</button>';
}

function tk(el){
  const w=el.dataset.w;
  if(el.classList.contains('pl')){const i=pl.indexOf(w);if(i>-1)pl.splice(i,1);el.classList.remove('pl');el.classList.add('bk');}
  else{pl.push(w);el.classList.remove('bk');el.classList.add('pl');}
  const b=document.getElementById('bA');
  b.innerHTML=pl.length?pl.map(w=>'<div class="tok pl">'+w+'</div>').join(''):'<span style="color:var(--muted);font-size:13px">Sem p&rcaron;i&rcaron;a&rcaron; slova&hellip;</span>';
}

function clrB(){pl=[];document.getElementById('bA').innerHTML='<span style="color:var(--muted);font-size:13px">Sem p&rcaron;i&rcaron;a&rcaron; slova&hellip;</span>';document.querySelectorAll('.tok').forEach(t=>{t.classList.remove('pl');t.classList.add('bk');});document.getElementById('bFb').innerHTML='';}

function chkB(){
  const d=S[cS].dialogs[cD];const ok=d.correct_tokens.join(' ')===pl.join(' ');
  const fb=document.getElementById('bFb');
  if(ok){fb.innerHTML='<div class="fb ok">&#10003; Spr&aacute;vn&ecaron;!</div>';setTimeout(nx,1200);}
  else fb.innerHTML='<div class="fb no">&#10007; Zkus znovu.</div><div class="fb tip">&#128161; Spr&aacute;vn&ecaron;: <b>'+d.correct_tokens.join(' ')+'</b></div>';
}

function s3(d,a){
  const sh=[...d.choices].sort(()=>Math.random()-.5);window._ch=sh;
  a.innerHTML=dts()+'<div class="step-card"><div class="step-hdr"><div class="step-num">4</div><div><div class="step-lbl">Vyber spr&aacute;vnou v&ecaron;tu</div><div class="step-sub">Kter&aacute; je spr&aacute;vn&aacute;?</div></div></div>'
  +'<div class="ctx-box"><div class="ctx-lbl">Situace</div>'+d.contextCz+'</div>'
  +'<div class="choices-wrap">'+sh.map((c,i)=>'<button class="chbtn" id="c'+i+'" onclick="pc('+i+')">'+c.text+'<br><span style="font-size:12px;color:var(--muted)">'+c.textCz+'</span></button>').join('')+'</div>'
  +'<div id="cFb"></div></div>';
}

function pc(i){
  const c=window._ch[i];document.querySelectorAll('.chbtn').forEach(b=>b.disabled=true);
  document.getElementById('c'+i).classList.add(c.correct?'ck':'cw');
  const fb=document.getElementById('cFb');
  if(c.correct){fb.innerHTML='<div class="fb ok">&#10003; Spr&aacute;vn&ecaron;!</div>';setTimeout(nx,1400);}
  else fb.innerHTML='<div class="fb no">&#10007; Chyba.</div>'+(c.explain?'<div class="fb tip">&#128161; '+c.explain+'</div>':'')
    +'<button class="abtn se" onclick="rStep()">&#8634; Zkusit znovu</button>';
}

function s4(d,a){
  a.innerHTML=dts()+'<div class="step-card"><div class="step-hdr"><div class="step-num">5</div><div><div class="step-lbl">&Rcaron;ekni to nahlas!</div><div class="step-sub">Mikrofon nebo p&rcaron;esko&ccaron;</div></div></div>'
  +'<div class="sen-box"><div class="sen-main">'+d.sentence+'</div><div class="sen-ph">[ '+d.phonetic+' ]</div></div>'
  +'<div class="mic-area"><button class="mic-btn" id="mb" onclick="tM()">&#127897;</button><div style="margin-top:8px;font-size:13px;color:var(--muted)" id="mSt">Stiskni a mluv</div></div>'
  +'<div id="pR"></div></div>'
  +'<button class="abtn se" onclick="cD2()">P&rcaron;esko&ccaron;it &rarr;</button>';
}

async function tM(){
  if(rec){if(mr)mr.stop();rec=false;const b=document.getElementById('mb');if(b){b.classList.remove('rec');b.textContent='🎙️';}}
  else{try{const st=await navigator.mediaDevices.getUserMedia({audio:true});ac2=[];mr=new MediaRecorder(st);mr.ondataavailable=ev=>ac2.push(ev.data);mr.onstop=sA;mr.start();rec=true;const b=document.getElementById('mb');if(b){b.classList.add('rec');b.textContent='⏹';}const s=document.getElementById('mSt');if(s)s.innerHTML='Nahr&aacute;v&aacute;m&hellip;';}catch(err){const s=document.getElementById('mSt');if(s)s.innerHTML='Mikrofon nedostupn&yacute;.';}}}

async function sA(){
  const d=S[cS].dialogs[cD];const blob=new Blob(ac2,{type:'audio/webm'});const fd=new FormData();
  fd.append('audio',blob,'a.webm');fd.append('expectedText',d.sentence);fd.append('language',ac);
  const s=document.getElementById('mSt');if(s)s.innerHTML='Zpracov&aacute;v&aacute;m&hellip;';
  try{const r=await fetch('https://fdc-gateway.vercel.app/api/pronunciation',{method:'POST',body:fd});const data=await r.json();shP(data);}
  catch(err){const pr=document.getElementById('pR');if(pr)pr.innerHTML='<div class="fb no">Chyba spojen&iacute;. Pou&rcaron;ij P&rcaron;esko&ccaron;it.</div>';}
}

function shP(data){
  const pr=document.getElementById('pR');if(!pr)return;
  const p=data.score||0;const col=p>=80?'var(--green)':p>=50?'var(--gold)':'var(--red)';
  const w=(data.words||[]).map(w=>'<span class="sw '+(w.ok?'ok':'no')+'">'+w.word+'</span>').join('');
  pr.innerHTML='<div class="sbar"><div class="sfill" style="width:'+p+'%;background:'+col+'"></div></div>'
  +'<div style="font-weight:900;font-size:18px;color:'+col+';text-align:center">'+p+'%</div>'
  +'<div class="swds">'+w+'</div>'
  +(data.tip?'<div class="fb tip">&#128161; '+data.tip+'</div>':'')
  +(p>=70?'<button class="abtn su" onclick="cD2()">&#127881; Hotovo!</button>':'<button class="abtn se" onclick="rStep()">&#8634; Znovu</button>');
}

function cD2(){
  dn[cS+'_'+cD]=true;const nd=cD+1;
  document.getElementById('sArea').innerHTML='<div class="pdots">'+[0,1,2,3,4].map(()=>'<div class="pd dn"></div>').join('')+'</div>'
  +'<div class="done-banner"><div class="di">&#127881;</div><div class="dt">Dialog dokon&ccaron;en!</div><div class="xpb">+10 XP</div></div>'
  +(nd<S[cS].dialogs.length?'<button class="abtn pr" onclick="goDi('+nd+')">Dal&scaron;&iacute; dialog &rarr;</button>':'<button class="abtn su" onclick="gH()">&#10003; Hotovo! Zp&aacute;t</button>')
  +'<button class="abtn se" onclick="rStep()">&#8634; Zopakovat</button>';
}

function goDi(i){cD=i;cSt=0;pl=[];rBar();rStep();}
function e(s){return(s||'').replace(/'/g,"\\'");}
window.speechSynthesis.onvoiceschanged=()=>{};
rHome();
</script>
