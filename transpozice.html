<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FajnTranspozice · FajnDoučko</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4ff;--paper:#fff;--ink:#0d1a3a;--muted:#5a6b8c;--line:#dce6ff;
  --blue:#164fbb;--blue2:#0d3a9b;--soft:#eaf0ff;--red:#b42318;--green:#147a3d;
  --sh:0 6px 24px rgba(12,28,80,.10);--shl:0 18px 56px rgba(12,28,80,.17);
  --r:14px;--mono:'Fira Mono','Courier New',monospace;--sans:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink)}
button,select,input,textarea{font-family:inherit}
button{cursor:pointer}

/* ---- BUTTONS ---- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 13px;font-weight:700;color:var(--ink);font-size:14px;white-space:nowrap}
.btn:hover{border-color:#a8bcff;background:var(--soft);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue2)}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.grn{color:var(--green);border-color:#b7e4c7}.btn.grn:hover{background:#f0fff5}
.btn.red{color:var(--red);border-color:#f2c4bf}.btn.red:hover{background:#fff0ef}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}

/* ---- LIST VIEW ---- */
.lv{max-width:660px;margin:0 auto;padding:32px 18px 70px}
.lv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:12px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:900;color:var(--blue)}
.logo span{color:var(--muted);font-weight:600;font-size:14px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer;transition:.15s}
.scard:hover{border-color:var(--blue);box-shadow:0 10px 30px rgba(22,79,187,.14)}
.scard-title{flex:1;font-weight:800;font-size:16px}
.scard-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.scard-del{border:none;background:none;color:var(--muted);font-size:17px;padding:3px 7px;border-radius:7px}
.scard-del:hover{color:var(--red);background:#fff0ef}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:14px}

/* ---- TOPBAR ---- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.topbar-title{font-weight:900;font-size:17px;color:var(--blue);flex:1;min-width:80px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{display:flex;align-items:center;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px 7px}
.tc-btn{border:none;background:none;font-size:20px;font-weight:900;color:var(--blue);width:30px;height:30px;border-radius:7px}
.tc-btn:hover{background:#fff}
.tc-pill{font-size:13px;font-weight:800;color:var(--blue);min-width:72px;text-align:center}
.notsel{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--ink)}

/* ---- SONG BODY ---- */
.sb{max-width:920px;margin:0 auto;padding:20px 16px 80px}
.title-inp{border:none;border-bottom:2px solid transparent;background:transparent;
  font-size:28px;font-weight:900;color:var(--ink);width:100%;outline:none;
  padding:4px 0;margin-bottom:16px}
.title-inp:focus{border-bottom-color:var(--line)}
.rtitle{font-size:26px;font-weight:900;margin-bottom:18px}
.hint-bar{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
  font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.paste-zone{background:var(--paper);border:2px dashed var(--line);border-radius:var(--r);
  padding:32px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;margin-bottom:20px}
.paste-zone:hover{border-color:var(--blue);background:var(--soft);color:var(--blue)}
.paste-zone-icon{font-size:40px;margin-bottom:8px}
.paste-zone p{font-size:15px;font-weight:700}

/* ---- SONG LINES ---- */
.sline{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;margin-bottom:5px;
  align-items:start;page-break-inside:avoid;break-inside:avoid}
.sec-badge{font-size:14px;font-weight:900;color:var(--blue);text-align:center;padding-top:3px}
.sec-inp{width:30px;border:1px solid transparent;border-radius:7px;text-align:center;
  font-size:14px;font-weight:900;color:var(--blue);padding:2px;background:transparent;outline:none}
.sec-inp:hover,.sec-inp:focus{border-color:var(--line);background:var(--soft)}
.sec-inp:focus{border-color:var(--blue)}
.sec-inp.has-val{border-color:var(--line);background:var(--soft)}
.lta{position:relative;overflow-x:auto}

/* slots */
.slot-row{height:18px;white-space:pre;font-family:var(--mono);font-size:19px;line-height:1;
  user-select:none;margin-bottom:2px}
.slot{display:inline-block;width:1ch;height:16px;cursor:pointer;border-radius:3px;vertical-align:top}
.slot:hover{background:#c8d6ff66;outline:1px solid #a8bcff}
.slot.hc{background:#dce8ff55}

/* chord row */
.chord-row{position:relative;height:26px;white-space:pre;font-family:var(--mono);
  font-size:19px;font-weight:700;line-height:1;color:var(--blue);min-width:1px}
.clbl{position:absolute;top:0;background:rgba(255,255,255,.92);padding:0 1px;
  border-radius:3px;font-weight:700;font-size:19px;line-height:1.35;color:var(--blue)}
.clbl.ck{cursor:pointer}.clbl.ck:hover{background:var(--soft);outline:1px solid #a8bcff}

/* lyric */
.lyric{font-family:var(--mono);font-size:19px;line-height:1.35;white-space:pre;
  color:var(--ink);min-height:26px;outline:none}
.lyric[contenteditable]:focus{background:#f5f8ff;border-radius:3px}

.sbreak{height:12px}

/* line actions */
.lact{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.lact-btn{border:none;background:none;font-size:12px;color:var(--muted);
  padding:2px 5px;border-radius:5px;font-family:var(--sans)}
.lact-btn:hover{background:var(--soft);color:var(--blue)}
.lact-btn.red:hover{background:#fff0ef;color:var(--red)}

.add-bar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 18px}

/* ---- CHORD POPUP ---- */
.cpop{position:fixed;z-index:200;background:var(--paper);border:2px solid var(--blue);
  border-radius:var(--r);box-shadow:var(--shl);padding:13px;width:238px;display:none}
.cpop.show{display:block}
.cpt{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:7px}
.cpi{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:22px;font-weight:900;color:var(--blue);font-family:var(--mono);outline:none}
.cpi:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e0e9ff}
.cpb{display:flex;gap:6px;margin-top:9px}
.cpb button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:8px;font-weight:800;font-size:13px}
.cpb .sv{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
.cpb .dl{color:var(--red)!important;border-color:#f2c4bf!important}

/* ---- MODAL ---- */
.mbg{position:fixed;inset:0;background:rgba(8,18,54,.42);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px}
.mbg.hid{display:none}
.modal{background:var(--paper);border-radius:18px;box-shadow:var(--shl);
  width:min(680px,96vw);max-height:90vh;overflow-y:auto;padding:22px}
.modal h2{font-size:21px;font-weight:900;margin-bottom:12px}
.mta{width:100%;min-height:230px;resize:vertical;border:1.5px solid var(--line);
  border-radius:11px;padding:13px;font-size:15px;font-family:var(--mono);
  line-height:1.55;outline:none;color:var(--ink)}
.mta:focus{border-color:var(--blue)}
.mhint{font-size:13px;color:var(--muted);margin:8px 0 14px;line-height:1.5}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mcard{border:1px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;
  transition:.15s;background:var(--paper)}
.mcard:hover{border-color:var(--blue);background:var(--soft)}
.mcard strong{display:block;margin-bottom:3px}
.mcard span{font-size:13px;color:var(--muted);line-height:1.4}

/* ---- TOAST ---- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;
  background:#0d1a3a;color:#fff;border-radius:11px;padding:11px 18px;
  font-weight:700;font-size:14px;box-shadow:var(--shl);pointer-events:none;
  transition:opacity .25s;white-space:nowrap}
.toast.hide{opacity:0}

/* ---- PRINT ---- */
@media print{
  @page{margin:16mm}
  .topbar,.paste-zone,.hint-bar,.slot-row,.lact,.add-bar,.cpop,.mbg,.toast,
  .title-inp,.scard-del{display:none!important}
  body{background:#fff!important}
  .sb{padding:0!important;max-width:none!important}
  .rtitle,.title-ro{font-size:20px!important;margin-bottom:12px!important}
  .lyric,.clbl,.chord-row{font-size:14px!important}
  .chord-row{height:20px!important}
  .lyric{font-size:14px!important}
}

@media(max-width:600px){
  .topbar{gap:5px}.tc-pill{min-width:58px}
  .lyric,.chord-row,.clbl,.slot-row{font-size:16px!important}
  .chord-row{height:23px!important}
  .cpop{width:calc(100vw - 24px)!important;left:12px!important}
}


/* ---- SAVE INDICATOR ---- */
.save-ok{font-size:12px;font-weight:700;color:var(--green);opacity:0;
  transition:opacity .3s;white-space:nowrap;padding:0 4px}
.save-ok.show{opacity:1}
/* ---- MORE MENU ---- */
.more-wrap{position:relative}
.more-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shl);
  min-width:210px;z-index:50;overflow:hidden}
.more-item{display:block;width:100%;text-align:left;border:none;background:none;
  padding:12px 16px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;
  font-family:var(--sans)}
.more-item:hover{background:var(--soft);color:var(--blue)}
.more-item.red:hover{background:#fff0ef;color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="cp" class="cpop"></div>
<div id="mbg" class="mbg hid" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="mc"></div>
</div>

<script>
// ===================== STATE =====================
const LS='fajn_trans_v2';
let songs=[];
let cur={id:null,editMode:false,shift:0,notation:'cz-sharp'};
let popL=-1,popP=-1;

// ===================== TRANSPOSE =====================
const SEM={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,B:10,Bb:10,H:11};
const NTS={'cz-sharp':['C','C#','D','D#','E','F','F#','G','G#','A','B','H'],
  'cz-flat':['C','Db','D','Eb','E','F','Gb','G','Ab','A','B','H'],
  'intl-sharp':['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  'intl-flat':['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']};

function sc(){return NTS[cur.notation]||NTS['cz-sharp'];}
function nr(r){if(!r)return null;let s=r[0].toUpperCase()+(r[1]||'');if(s.length>1&&!['#','b'].includes(s[1]))s=s[0];return s;}
function tc(ch,d){
  d=d==null?cur.shift:d;
  if(!ch||!ch.trim())return ch;
  return ch.replace(/([A-Ha-h](?:#|b)?)([^/\s]*)(?:\/([A-Ha-h](?:#|b)?))?/g,(m,root,suf,bass)=>{
    const n=nr(root);if(SEM[n]===undefined)return m;
    const s=sc(),main=s[(SEM[n]+d+1200)%12]+suf;
    if(bass){const nb=nr(bass);if(SEM[nb]!==undefined)return main+'/'+s[(SEM[nb]+d+1200)%12];}
    return main;
  });
}

// ===================== STORAGE =====================
function load(){try{songs=JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){songs=[];}}
function save(){try{localStorage.setItem(LS,JSON.stringify(songs));}catch(e){}}
function getSong(){return songs.find(s=>s.id===cur.id)||null;}
function autoSave(){
  const s=getSong();if(s){s.updatedAt=new Date().toISOString();save();}
  const el=document.getElementById('save-ok');
  if(el){el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2000);}
}

// ===================== SONG MANAGEMENT =====================
function newSong(){
  const s={id:Date.now().toString(),title:'Nová píseň',lines:[],updatedAt:new Date().toISOString()};
  songs.unshift(s);save();
  cur.id=s.id;cur.editMode=true;cur.shift=0;
  render();
  setTimeout(()=>openTextModal(),60);
}
function openSong(id){
  cur.id=id;cur.editMode=false;cur.shift=0;
  render();
}
function deleteSong(id,ev){
  ev.stopPropagation();
  const s=songs.find(x=>x.id===id);
  if(!confirm('Smazat píseň „'+(s?.title)+'"?'))return;
  songs=songs.filter(x=>x.id!==id);
  save();render();
}

// ===================== TEXT PARSING =====================
function parseText(raw){
  return raw.replace(/\r/g,'').split('\n').reduce((acc,line)=>{
    const t=line.trimEnd();
    const m=t.match(/^([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{1,2}):\s*(.*)$/i);
    if(m) acc.push({section:m[1].toUpperCase(),text:m[2],chords:[]});
    else if(t===''){if(acc.length)acc.push({section:'',text:'',chords:[],blank:true});}
    else acc.push({section:'',text:t,chords:[]});
    return acc;
  },[]).filter((x,i,a)=>!(x.blank&&i===a.length-1)); // remove trailing blank
}
function applyText(raw){
  const song=getSong();if(!song)return;
  const nl=parseText(raw);
  // preserve chords for lines with identical text
  song.lines=nl.map((nl,i)=>{
    const old=song.lines[i];
    return(old&&old.text===nl.text&&!nl.blank)?{...nl,chords:old.chords}:nl;
  });
  autoSave();
}

// ===================== LINE OPS =====================
function moveLine(i,d){const j=i+d,s=getSong();if(j<0||j>=s.lines.length)return;[s.lines[i],s.lines[j]]=[s.lines[j],s.lines[i]];autoSave();render();}
function dupLine(i){const s=getSong();s.lines.splice(i+1,0,JSON.parse(JSON.stringify(s.lines[i])));autoSave();render();}
function delLine(i){const s=getSong();s.lines.splice(i,1);autoSave();render();}
function addLine(sec){const s=getSong();s.lines.push({section:sec||'',text:'Nový řádek',chords:[]});autoSave();cur.editMode=true;render();}

// ===================== CHORD POPUP =====================
function openCP(ev,li,pos){
  ev.stopPropagation();
  popL=li;popP=pos;
  const song=getSong(),line=song.lines[li];
  const ex=line.chords.find(c=>c.pos===pos);
  const cp=document.getElementById('cp');
  cp.innerHTML=`<div class="cpt">Akord · řádek ${li+1} · pozice ${pos}</div>
    <input class="cpi" id="cpi" placeholder="E, C#m, H7, D/F#" value="${ex?esc(ex.chord):''}">
    <div class="cpb">
      <button class="sv" onclick="saveCP()">Uložit</button>
      <button class="dl" onclick="delCP()">Smazat</button>
      <button onclick="closeCP()">Zavřít</button>
    </div>`;
  const r=ev.target.getBoundingClientRect();
  cp.style.left=Math.min(window.innerWidth-250,Math.max(8,r.left))+'px';
  cp.style.top=Math.min(window.innerHeight-190,Math.max(8,r.bottom+4))+'px';
  cp.classList.add('show');
  setTimeout(()=>document.getElementById('cpi')?.focus(),20);
}
function closeCP(){document.getElementById('cp').classList.remove('show');}
function saveCP(){
  const val=document.getElementById('cpi')?.value.trim();
  if(popL<0)return;
  const arr=getSong().lines[popL].chords;
  const idx=arr.findIndex(c=>c.pos===popP);
  if(!val){if(idx>=0)arr.splice(idx,1);}
  else if(idx>=0)arr[idx].chord=val;
  else arr.push({pos:popP,chord:val});
  arr.sort((a,b)=>a.pos-b.pos);
  autoSave();closeCP();render();
}
function delCP(){
  if(popL<0)return;
  const arr=getSong().lines[popL].chords;
  const idx=arr.findIndex(c=>c.pos===popP);
  if(idx>=0)arr.splice(idx,1);
  autoSave();closeCP();render();
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('cp').classList.contains('show')){
    if(e.key==='Enter'){e.preventDefault();saveCP();}
    if(e.key==='Escape')closeCP();
  }
});

// ===================== MODALS =====================
function openModal(html){document.getElementById('mc').innerHTML=html;document.getElementById('mbg').classList.remove('hid');}
function closeModal(){document.getElementById('mbg').classList.add('hid');document.getElementById('mc').innerHTML='';}

function openTextModal(){
  const song=getSong();
  const current=(song?.lines||[]).filter(l=>!l.blank).map(l=>(l.section?l.section+': ':'')+l.text).join('\n');
  openModal(`<h2>✏️ Text písně</h2>
    <div id="split-warn" style="display:none;background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 13px;margin-bottom:10px;font-size:13px;color:#5a4000">
      ⚠️ <strong>Vypadá to jako jeden dlouhý řádek.</strong> Použij tlačítka níže pro automatické rozdělení.
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
      <span style="font-size:12px;color:var(--muted);font-weight:700">Rozdělit po:</span>
      <button class="btn sm" onclick="splitBy('comma')" title="Rozdělí po každé čárce">čárkách ,</button>
      <button class="btn sm" onclick="splitBy('sentence')" title="Rozdělí po tečce, vykřičníku, otazníku">větách . ! ?</button>
      <button class="btn sm" onclick="splitBy('auto')" title="Zkusí detekovat nejlepší způsob">✨ automaticky</button>
      <button class="btn sm" onclick="splitBy('words',8)" title="Rozdělí přibližně po 8 slovech">po ~8 slovech</button>
    </div>
    <textarea class="mta" id="rta" placeholder="Každý řádek = jeden řádek ve zpěvníku.
Sekce: S: Sloka, R: Refrén, B: Bridge atd.

Příklad:
S: Když jsi sám a zkoušený,
když jsi zklamán přátelstvím,
R: Chval Pána na výšinách,">${esc(current)}</textarea>
    <div class="mhint">Prázdný řádek = mezera. Aktuální akordy se zachovají pro nezměněné řádky.</div>
    <div class="mbtns">
      <button class="btn pri" onclick="confirmText()">Potvrdit</button>
      <button class="btn" onclick="closeModal()">Zrušit</button>
    </div>`);
  setTimeout(()=>{
    const ta=document.getElementById('rta');
    ta?.focus();
    ta?.addEventListener('input',checkLongLines);
    ta?.addEventListener('paste',()=>setTimeout(checkLongLines,50));
    checkLongLines();
  },30);
}

function checkLongLines(){
  const ta=document.getElementById('rta');
  const warn=document.getElementById('split-warn');
  if(!ta||!warn)return;
  const lines=ta.value.split('\n').filter(l=>l.trim().length>0);
  // warn if any line is longer than 80 chars or there's only 1 non-empty line with 30+ chars
  const hasLong=lines.some(l=>l.length>80)||(lines.length===1&&lines[0].length>30);
  warn.style.display=hasLong?'block':'none';
}

function splitBy(mode, param){
  const ta=document.getElementById('rta');
  if(!ta)return;
  let text=ta.value;
  let result;
  if(mode==='comma'){
    // split by comma, preserve section markers
    result=text.split(/,\s*/).map(s=>s.trim()).filter(s=>s.length>0).join('\n');
  } else if(mode==='sentence'){
    // split after . ! ? but keep the punctuation on the line
    result=text.replace(/([.!?])\s+/g,'$1\n').split('\n').map(s=>s.trim()).filter(s=>s.length>0).join('\n');
  } else if(mode==='words'){
    const n=param||8;
    result=text.split('\n').map(line=>{
      const words=line.trim().split(/\s+/);
      const chunks=[];
      for(let i=0;i<words.length;i+=n) chunks.push(words.slice(i,i+n).join(' '));
      return chunks.join('\n');
    }).join('\n');
  } else if(mode==='auto'){
    // Count commas vs sentences to decide
    const commas=(text.match(/,/g)||[]).length;
    const sentences=(text.match(/[.!?]/g)||[]).length;
    const newlines=(text.match(/\n/g)||[]).length;
    if(newlines>2){
      // already has lines, do nothing
      toast('Text je už rozdělený na řádky.');return;
    } else if(commas>=sentences&&commas>1){
      splitBy('comma');return;
    } else if(sentences>1){
      splitBy('sentence');return;
    } else {
      splitBy('words',8);return;
    }
  }
  ta.value=result;
  ta.dispatchEvent(new Event('input'));
  toast('Rozděleno na '+(result.split('\n').filter(l=>l.trim()).length)+' řádků.');
}

function importFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      let d=null;
      const txt=ev.target.result;
      if(txt.trim().startsWith('<')){
        const parser=new DOMParser();
        const doc=parser.parseFromString(txt,'text/html');
        const tag=doc.getElementById('song-data');
        if(tag)d=JSON.parse(tag.textContent);
      }
      if(!d)d=JSON.parse(txt);
      if(d&&d.lines&&d.title){
        d.id=Date.now().toString();d.updatedAt=new Date().toISOString();
        songs.unshift(d);save();closeModal();cur.id=d.id;cur.editMode=false;render();
        toast('Píseň „'+d.title+'" načtena.');
      } else {
        alert('Soubor se nepodařilo načíst. Ujisti se, že jde o soubor uložený z FajnTranspozice.');
      }
    }catch(err){alert('Soubor nelze otevřít.');}
    e.target.value='';
  };
  r.readAsText(f);
}

// ===================== BUILD ELEMENTS =====================
function buildLine(line,li,editable){
  if(line.blank){const d=document.createElement('div');d.className='sbreak';return d;}
  const row=document.createElement('div');row.className='sline';

  // Section
  const secEl=document.createElement('div');secEl.className='sec-badge';
  if(editable){
    const inp=document.createElement('input');inp.className='sec-inp';
    inp.value=line.section||'';inp.maxLength=2;inp.title='Sekce (S, R, B…)';if(inp.value)inp.classList.add('has-val');
    inp.oninput=()=>{inp.value=inp.value.toUpperCase();line.section=inp.value;inp.value?inp.classList.add('has-val'):inp.classList.remove('has-val');autoSave();};
    secEl.appendChild(inp);
  } else secEl.textContent=line.section||'';
  row.appendChild(secEl);

  // Text area
  const ta=document.createElement('div');ta.className='lta';

  // Slots
  if(editable){
    const sr=document.createElement('div');sr.className='slot-row';
    const hc=new Set(line.chords.map(c=>c.pos));
    const txt=line.text||'';
    for(let p=0;p<=txt.length;p++){
      const s=document.createElement('span');
      s.className='slot'+(hc.has(p)?' hc':'');
      s.textContent=' '; // invisible, width maintained by CSS 1ch
      s.title='Akord na pozici '+p;
      const pp=p;s.onclick=ev=>openCP(ev,li,pp);
      sr.appendChild(s);
    }
    ta.appendChild(sr);
  }

  // Chords
  if(line.chords.length){
    const cr=document.createElement('div');cr.className='chord-row';
    line.chords.forEach(c=>{
      const lbl=document.createElement('span');lbl.className='clbl'+(editable?' ck':'');
      lbl.style.left=c.pos+'ch';lbl.textContent=tc(c.chord);
      if(editable)lbl.onclick=ev=>{ev.stopPropagation();openCP(ev,li,c.pos);};
      cr.appendChild(lbl);
    });
    ta.appendChild(cr);
  }

  // Lyric
  const lr=document.createElement('div');lr.className='lyric';
  lr.textContent=line.text||'';
  if(editable){
    lr.contentEditable='true';lr.spellcheck=false;
    lr.onblur=()=>{
      const nt=lr.textContent.replace(/\n/g,'');
      if(line.text!==nt){
        line.text=nt;
        line.chords=line.chords.filter(c=>c.pos<=nt.length);
        autoSave();render();
      }
    };
    lr.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const sel=window.getSelection();
        if(!sel||!sel.rangeCount){lr.blur();return;}
        const range=sel.getRangeAt(0);
        const pre=document.createRange();
        pre.selectNodeContents(lr);
        pre.setEnd(range.startContainer,range.startOffset);
        const before=pre.toString();
        const after=lr.textContent.slice(before.length);
        const song=getSong();
        song.lines[li].text=before;
        song.lines[li].chords=song.lines[li].chords.filter(c=>c.pos<=before.length);
        song.lines.splice(li+1,0,{section:'',text:after,chords:[]});
        autoSave();render();
        setTimeout(()=>{
          const rows=document.querySelectorAll('.lyric');
          if(rows[li+1]){
            rows[li+1].focus();
            const r=document.createRange();r.selectNodeContents(rows[li+1]);r.collapse(true);
            const s=window.getSelection();s.removeAllRanges();s.addRange(r);
          }
        },30);
      }
    };
  }
  ta.appendChild(lr);

  // Actions
  if(editable){
    const ac=document.createElement('div');ac.className='lact';
    [['↑',()=>moveLine(li,-1),''],['↓',()=>moveLine(li,1),''],
     ['duplikovat',()=>dupLine(li),''],['smazat',()=>delLine(li),'red']
    ].forEach(([lbl,fn,cls])=>{
      const b=document.createElement('button');b.className='lact-btn '+cls;
      b.textContent=lbl;b.onclick=fn;ac.appendChild(b);
    });
    ta.appendChild(ac);
  }
  row.appendChild(ta);return row;
}

function goList(){cur.id=null;closeCP();render();}
function toggleEdit(){cur.editMode=!cur.editMode;render();}
function shift(n){cur.shift+=n;const el=document.getElementById('spp');
  if(el)el.textContent=cur.shift===0?'0 půltónů':(cur.shift>0?'+':'')+cur.shift+' půltón'+(Math.abs(cur.shift)===1?'':'ů');
  // re-render chord labels only
  renderChordLabels();}
function setNot(v){cur.notation=v;renderChordLabels();}

function renderChordLabels(){
  // Re-render all chord labels without full re-render (keeps focus etc.)
  const song=getSong();if(!song)return;
  document.querySelectorAll('.chord-row').forEach((cr,i)=>{
    // find corresponding line index from parent sline
    const sline=cr.closest('.sline');
    if(!sline)return;
    const lines=Array.from(document.querySelectorAll('.sline'));
    const li=lines.indexOf(sline);
    // find actual line index (skip blanks)
    let realIdx=-1,count=0;
    for(let j=0;j<song.lines.length;j++){
      if(song.lines[j].blank)continue;
      if(count===li){realIdx=j;break;}
      count++;
    }
    if(realIdx<0)return;
    const line=song.lines[realIdx];
    cr.innerHTML='';
    line.chords.forEach(c=>{
      const lbl=document.createElement('span');lbl.className='clbl'+(cur.editMode?' ck':'');
      lbl.style.left=c.pos+'ch';lbl.textContent=tc(c.chord);
      if(cur.editMode)lbl.onclick=ev=>{ev.stopPropagation();openCP(ev,realIdx,c.pos);};
      cr.appendChild(lbl);
    });
  });
  // Also update pill in case full render was called
  const el=document.getElementById('spp');
  if(el)el.textContent=cur.shift===0?'0 půltónů':(cur.shift>0?'+':'')+cur.shift+' půltón'+(Math.abs(cur.shift)===1?'':'ů');
}

function importToList(e){

      if(d.lines&&d.title){d.id=Date.now().toString();d.updatedAt=new Date().toISOString();songs.unshift(d);save();render();toast('Píseň importována.');}
      else alert('Neplatný soubor.');
    }catch(err){alert('Chyba: '+err.message);}
    e.target.value='';
  };r.readAsText(f);
}

// ===================== EXPORT: FULL APP WITH SONG =====================
function buildSongApp(song){
  // Embed the song into a self-contained copy of this app
  const safeData=JSON.stringify({id:song.id||Date.now().toString(),title:song.title,lines:song.lines,updatedAt:song.updatedAt||new Date().toISOString()})
    .replace(/&/g,'\u0026').replace(/</g,'\u003c').replace(/>/g,'\u003e');
  const inject='<script>var __embedded='+safeData+';<\/script>';
  // Get current page source and inject before </body>
  const src=document.documentElement.outerHTML;
  // Remove any previous __embedded injection
  const clean=src.replace(/<script>var __embedded=.*?<\/script>/,'');
  return clean.replace('</body>',inject+'</body>');
}
