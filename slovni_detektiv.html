<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<script src="/fdc-plugin/fdc-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FajnDetektiv – Vyšetřování slov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  /* Fotka pozadí: stačí nastavit např. url('img/detektiv-mesto.jpg') – kreslené město zůstane jako záloha */
  --scene-photo: none;
  --night:#101b33; --night2:#1b2c50; --glass:rgba(16,27,51,.78);
  --paper:#fbf3e0; --paper2:#f3e6c6; --ink:#2a2118; --ink2:#6b5a45;
  --lamp:#ffd166; --lamp2:#f4a63a; --cork:#c4925a;
  --m:#3a86ff; --f:#e8457b; --n:#22b07d;
  --ok:#22b07d; --bad:#e63946; --light:#f4f1ea;
  --radius:18px;
  /* ── TÉMA: tmavé (noční město) ── */
  --sky1:#0b1428; --sky2:#1b2c50; --sky3:#3b3358; --scene-shade:rgba(8,12,24,.55); --scene-glow:rgba(255,209,102,.10);
  --text:#f4f1ea; --heading:#ffd166; --bar:rgba(10,17,33,.82); --bar-line:rgba(255,255,255,.08);
  --chip:rgba(255,255,255,.08); --chip-hover:rgba(255,255,255,.16); --hud-chip:rgba(10,17,33,.7); --track:rgba(255,255,255,.12);
  --card1:rgba(255,255,255,.10); --card2:rgba(255,255,255,.03); --card-line:rgba(255,255,255,.12);
  --open1:rgba(255,209,102,.28); --open2:rgba(244,166,58,.10); --open-line:rgba(255,209,102,.55); --tag:rgba(0,0,0,.35);
  --wall1:#3c4a6b; --wall2:#2a3552; --wall-line:rgba(255,255,255,.22); --floor1:#1b2236; --floor2:#11172a;
}
[data-theme="light"]{
  --sky1:#7cc8f5; --sky2:#bfe6fb; --sky3:#fff1d2; --scene-shade:rgba(255,255,255,.25); --scene-glow:rgba(255,255,255,.25);
  --text:#1d2a44; --heading:#b8650a; --bar:rgba(255,255,255,.88); --bar-line:rgba(20,40,80,.10);
  --chip:rgba(20,40,80,.08); --chip-hover:rgba(20,40,80,.15); --hud-chip:rgba(255,255,255,.85); --track:rgba(20,40,80,.14);
  --card1:rgba(255,255,255,.88); --card2:rgba(255,255,255,.70); --card-line:rgba(20,40,80,.12);
  --open1:#fff4d6; --open2:#ffe2a8; --open-line:#f4a63a; --tag:rgba(20,40,80,.12);
  --wall1:#dfe5ee; --wall2:#c8d1de; --wall-line:rgba(40,60,100,.18); --floor1:#9aa7bb; --floor2:#7d8aa0;
}
[data-theme="girly"]{
  --sky1:#f7a8d4; --sky2:#f8c9ee; --sky3:#ffe6f2; --scene-shade:rgba(255,230,242,.25); --scene-glow:rgba(255,255,255,.25);
  --text:#4a1d3a; --heading:#c01880; --bar:rgba(255,240,248,.9); --bar-line:rgba(192,24,128,.12);
  --chip:rgba(192,24,128,.08); --chip-hover:rgba(192,24,128,.16); --hud-chip:rgba(255,245,250,.88); --track:rgba(192,24,128,.15);
  --card1:rgba(255,255,255,.88); --card2:rgba(255,236,246,.75); --card-line:rgba(192,24,128,.18);
  --open1:#ffe3f1; --open2:#ffc6e2; --open-line:#e8457b; --tag:rgba(192,24,128,.12);
  --wall1:#f6e3f0; --wall2:#ead0e4; --wall-line:rgba(150,40,110,.16); --floor1:#c99bbd; --floor2:#b086a6;
  --lamp:#ff9ccf; --lamp2:#e8457b; --paper:#fff6fa; --paper2:#fde1ef; --m:#6a5cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:var(--sky2);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:'Baloo 2',sans-serif;line-height:1.1;margin:0}

/* ── Scéna (pozadí) ── */
#scene{position:fixed;inset:0;z-index:-2;background:linear-gradient(var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#scene .photo{position:absolute;inset:0;background:var(--scene-photo) center/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--scene-glow),transparent 60%),linear-gradient(transparent 40%,var(--scene-shade))}

/* ── Horní lišta ── */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--bar-line)}
.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:1.25rem;letter-spacing:.2px}
.brand b{color:var(--heading)}
.brand svg{width:30px;height:30px}
.topbar .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--chip);font-weight:800;font-size:.85rem;white-space:nowrap}
.chip.rank{color:var(--heading)}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:1.1rem}
.iconbtn:hover{background:var(--chip-hover)}
.demo-badge{background:var(--f);color:#fff;padding:3px 9px;border-radius:8px;font-size:.75rem;font-weight:900}

main{max-width:920px;margin:0 auto;padding:18px 16px 60px}
.screen{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── Papír / spis ── */
.paper{position:relative;background:var(--paper);color:var(--ink);border-radius:6px;padding:18px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.04);background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,60,30,.07) 27px 28px)}
.paper.tape::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,236,170,.75);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.type{font-family:'Special Elite',monospace}
.stamp{display:inline-block;font-family:'Special Elite',monospace;color:var(--bad);border:3px solid var(--bad);border-radius:8px;padding:4px 12px;transform:rotate(-8deg);font-size:1.3rem;letter-spacing:2px;opacity:.9}
.stamp.ok{color:var(--ok);border-color:var(--ok)}

/* ── Úvod / hrdina ── */
.hero{display:flex;gap:14px;align-items:flex-end;margin:6px 0 22px}
.hero .who{flex:0 0 auto;width:110px}
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.bubble small{display:block;color:var(--ink2);font-weight:700;margin-top:6px}
.section-title{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:1.35rem}
.section-title::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--heading),transparent);opacity:.6}

/* ── Mapa města ── */
.districts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.district{position:relative;text-align:left;border-radius:var(--radius);padding:16px;min-height:150px;background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid var(--card-line);backdrop-filter:blur(3px);overflow:hidden;transition:transform .15s,box-shadow .15s}
.district:not(.locked):hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.district .ico{font-size:2.2rem}
.district h3{font-size:1.15rem;margin:6px 0 4px}
.district p{margin:0;font-size:.88rem;opacity:.85}
.district.open{background:linear-gradient(160deg,var(--open1),var(--open2));border-color:var(--open-line)}
.district.locked{opacity:.55;cursor:default}
.district .tag{position:absolute;top:12px;right:12px;font-size:.72rem;font-weight:900;padding:3px 8px;border-radius:999px;background:var(--tag)}
.district .glow{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--lamp),transparent 70%);opacity:.25}

/* ── Mise ── */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;opacity:.85;margin-bottom:12px}
.back:hover{opacity:1}
.missions{display:grid;gap:14px}
.mission{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.mission .mico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:2rem;background:var(--paper2)}
.mission h3{font-size:1.25rem;color:var(--ink)}
.mission p{margin:3px 0 10px;color:var(--ink2);font-weight:600}
.levels{display:flex;flex-wrap:wrap;gap:8px}
.lvbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:800;min-width:150px;text-align:left;transition:transform .12s}
.lvbtn:hover:not([disabled]){transform:translateY(-2px)}
.lvbtn small{font-weight:700;opacity:.75;font-size:.78rem}
.lvbtn .stars{color:var(--lamp);letter-spacing:2px}
.lvbtn[disabled]{background:#9b8d78;cursor:not-allowed}
.mission.soon{opacity:.6}
.diff-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.diff-lbl{font-weight:900;color:var(--ink2);font-size:.9rem}
.diff{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:13px;background:var(--paper2)}
.seg{display:flex;flex-direction:column;align-items:center;min-width:86px;padding:6px 12px;border-radius:10px;font-weight:900;color:var(--ink2);transition:background .15s}
.seg:hover:not([disabled]):not(.on){background:rgba(0,0,0,.06)}
.seg.on{background:var(--ink);color:var(--paper)}
.seg .stars{font-size:.75rem;letter-spacing:1px;color:var(--lamp2)}
.seg[disabled]{opacity:.5;cursor:not-allowed}
.mission .lvdesc{margin:10px 0 12px;color:var(--ink)}
.demo-note{display:block;margin-top:10px;color:var(--ink2);font-weight:700}
.board{position:relative;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;padding:18px;border-radius:var(--radius);min-height:190px;
  background:#c4925a radial-gradient(rgba(0,0,0,.10) 1px,transparent 1.6px) 0 0/9px 9px;
  box-shadow:inset 0 0 0 9px #8a5a2e,inset 0 0 30px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3)}
.polaroid{position:relative;flex:0 0 auto;background:#fff;padding:8px 8px 10px;transform:rotate(-3deg);box-shadow:0 6px 12px rgba(0,0,0,.35);text-align:center;color:var(--ink)}
.polaroid svg{width:96px;height:118px;background:#dfe5ee;display:block}
.polaroid b{display:block;margin-top:4px;font-family:'Special Elite',monospace;font-size:1.25rem}
.pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#ff9a9a,#c1121f);box-shadow:0 2px 3px rgba(0,0,0,.4);z-index:2}
.notes{flex:1;min-width:180px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.note{position:relative;background:#fff8c4;color:var(--ink);padding:10px 12px 8px;min-width:104px;font-weight:900;box-shadow:0 4px 8px rgba(0,0,0,.3);animation:noteIn .35s both}
.note::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#9ad0ff,#1d63c9)}
.note small{display:block;font-size:.7rem;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.note:nth-child(odd){rotate:2deg}.note:nth-child(even){rotate:-2deg}
.note.bad{background:#ffd9d9}.note.gang{background:#2a2118;color:#ffd166}.note.gang small{color:#cdbb9a}
.note.empty{opacity:.55;font-weight:700}
@keyframes noteIn{from{opacity:0;transform:scale(1.5)}}
.step{margin-top:14px}
.step h3{color:var(--ink);font-size:1.3rem;margin:2px 0 4px}
.stepnum{font-family:'Special Elite',monospace;color:var(--ink2);font-size:.85rem}
.step .hint{margin:0;color:var(--ink2);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.opt{position:relative;background:#fff;color:var(--ink);border:2px solid var(--paper2);border-radius:12px;padding:12px 8px;font-weight:900;font-size:1.1rem;box-shadow:0 4px 0 #cbb88f;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:2px}
.opt:hover:not([disabled]){transform:translateY(-2px)}
.opt small{font-size:.76rem;font-weight:700;color:var(--ink2)}
.opt kbd{position:absolute;left:6px;top:4px;font-size:.65rem;opacity:.5;font-family:inherit}
.opt.rod.M{border-top:6px solid var(--m)}.opt.rod.F{border-top:6px solid var(--f)}.opt.rod.N{border-top:6px solid var(--n)}
.opt.right{border-color:var(--ok);background:#e6f8ef}.opt.wrong{border-color:var(--bad);background:#fde8ea}
.opts.gangs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.opt.gangopt{padding:8px 4px 8px;font-size:1rem}
.mini svg{width:52px;height:64px;display:block}
.ghead{margin-top:12px;font-weight:900;color:var(--ink2);font-size:.85rem;text-transform:uppercase;letter-spacing:.4px}
.reveal{display:flex;gap:12px;align-items:center;margin-top:8px}
.reveal .mini svg{width:72px;height:90px}
.reveal p{margin:8px 0 0}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.gang{background:#fff;border-radius:12px;padding:8px 6px;text-align:center;border-top:5px solid;color:var(--ink)}
.gang svg{width:58px;height:72px}
.gang b{display:block}
.gang small{display:block;color:var(--ink2);font-weight:700;font-size:.75rem}
.gang .words{display:block;font-size:.72rem;color:var(--ink2);margin-top:2px}
.gang.off svg{filter:grayscale(1);opacity:.35}
.qcard.big{padding:14px 8px}
.tablo{border-radius:var(--radius);background:#0d0f14;border:4px solid #2a2f3a;box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 10px 24px rgba(0,0,0,.3);padding:14px 18px;color:#ffc531}
.tablo-h{display:flex;justify-content:space-between;font-family:'Special Elite',monospace;font-size:.9rem;opacity:.8;border-bottom:1px dashed #3a3f4a;padding-bottom:6px}
.tablo-f{font-family:'Special Elite',monospace;font-size:2.4rem;text-align:center;padding:18px 0 10px;letter-spacing:2px;text-shadow:0 0 12px rgba(255,197,49,.6);animation:flip .5s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}}
.vnotes{margin-top:12px;min-height:56px}
.vnotes .note{background:#e9f3ff}
.vnotes .note.bad{background:#ffd9d9}
@media (max-width:560px){.tablo-f{font-size:1.7rem}}
.adjbase{margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--paper2);color:var(--ink);font-weight:800}
.opt.drawer{background:linear-gradient(#b98a5a,#8e6236);border-color:#6f4a26;color:#fff8ec;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #5a3b1c}
.opt.drawer small{color:#f3dfc4}
.opt.drawer::after{content:"";display:block;width:34px;height:6px;border-radius:4px;background:#e9c98e;margin:6px auto 0}
.opt.drawer.right{background:linear-gradient(#3fbf8d,#22946a);border-color:var(--ok)}
.opt.drawer.wrong{background:linear-gradient(#cf6b72,#a8434b);opacity:.6}
.casefile{margin-top:4px}
.cfhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cfhead h3{color:var(--ink);font-size:1.4rem}
.cfhead .stamp{font-size:.9rem}
.cfinfo{font-weight:700;color:var(--ink2);margin:10px 0}
.casetext{font-size:1.25rem;line-height:2;color:var(--ink)}
.casetext .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
.casetext .w:hover{background:rgba(58,134,255,.15)}
.casetext .cs.cand{border-bottom:2px dotted var(--ink2)}
.casetext .sent.lit{background:rgba(255,209,102,.45);border-radius:4px;box-shadow:0 0 0 3px rgba(255,209,102,.45)}
.casetext .found{background:rgba(230,57,70,.18);outline:2px solid var(--bad);border-radius:6px}
.casetext .fixed{color:#137a52;font-weight:700;border-bottom:3px solid var(--ok);cursor:default}
.casetext .fixedbad{color:#9b2626;font-weight:700;border-bottom:3px solid #e8a33a;cursor:default}
.casetext .okword{animation:okw .9s}
@keyframes okw{30%{background:rgba(34,176,125,.25)}}
.fixbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff;border:2px solid var(--paper2)}
.fixbox h3{color:var(--ink);font-size:1.15rem;margin:0}
.fixbox s{color:var(--bad)}
.casefile .opts{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
@media (max-width:560px){.casetext{font-size:1.08rem;line-height:1.9}}
.forge{position:relative;height:210px;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:radial-gradient(ellipse at 50% 110%,rgba(255,120,40,.6),transparent 60%),linear-gradient(#2d201c,#130c0b);border:1px solid rgba(255,255,255,.08)}
.forge .glow{position:absolute;left:50%;bottom:-60px;width:420px;height:200px;transform:translateX(-50%);background:radial-gradient(rgba(255,150,60,.45),transparent 65%);animation:flick 1.6s ease-in-out infinite;pointer-events:none}
@keyframes flick{50%{opacity:.6}}
.anvil{width:min(320px,80%);display:block;margin-bottom:6px}
.anvil-word{position:relative;z-index:2;display:flex;align-items:flex-end;gap:2px;margin-bottom:-8px;font-family:'Baloo 2';font-weight:800;font-size:2.4rem;line-height:1}
.ingot{color:#ffdcb0;text-shadow:0 0 14px #ff7a1a,0 0 4px #ff9c40}
.slot{min-width:56px;padding:0 8px;border-bottom:4px dashed #ffb36b;color:#ffb36b;text-align:center}
.slot.whole{min-width:150px}
.slot.hot{border-bottom-color:transparent;color:#fff3c4;text-shadow:0 0 16px #ffb300,0 0 6px #ff6a00;animation:pop .4s}
.hammer{position:absolute;right:calc(50% - 150px);top:18px;font-size:3rem;transform-origin:80% 80%;transform:rotate(25deg);z-index:3}
.hammer.strike{animation:strike .45s ease-in}
@keyframes strike{40%{transform:rotate(-45deg) translate(-20px,30px)}100%{transform:rotate(25deg)}}
.spark{position:absolute;left:50%;bottom:70px;width:5px;height:5px;border-radius:50%;background:#ffd36b;box-shadow:0 0 8px #ff9c40;animation:spark .8s ease-out forwards;z-index:4}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.frame{font-family:'Special Elite',monospace;color:var(--ink);font-size:1.1rem}
.blank{letter-spacing:2px}
.vzchip{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:4px 12px 4px 6px;border-radius:999px;background:var(--paper2);font-weight:800;color:var(--ink)}
.opts.tiles{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.opt.tile{background:linear-gradient(#e3e8ee,#aab4bf);border-color:#9aa4b0;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 0 #66707c;font-family:'Baloo 2';font-size:1.45rem;color:#1d232b}
.opt.tile small{font-family:'Nunito';font-size:.8rem;color:#3c444e}
.opt.tile.right{background:linear-gradient(#d9f6e8,#9fdcbf);border-color:var(--ok)}
.opt.tile.wrong{background:linear-gradient(#f6d9dc,#d9a3a9);border-color:var(--bad)}
@media (max-width:560px){.anvil-word{font-size:1.9rem}.hammer{right:8px}}
.tryagain{margin-top:12px;padding:11px 14px;border-radius:12px;background:#fff1f2;border:2px solid #f3b6bf;color:var(--ink);font-weight:800;animation:shake .35s}
.tryagain.soft{background:#fff6dc;border-color:#f4cf7a;animation:none}
.tryagain .actions{justify-content:flex-start;margin-top:10px}
.tryagain .btn.ghost{background:var(--paper2);color:var(--ink)}
.hintclue{border-left-color:var(--m);background:#eef4ff;margin-top:10px}
.door.wrong{opacity:.35;filter:grayscale(.8)}
.door.wrong::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:900;color:#fff}
.opt.wrong{opacity:.55}
.qcard.big .n{font-size:2.2rem}
.soonchip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--paper2);color:var(--ink2);font-weight:800;font-size:.8rem}

/* ── HUD ── */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.hud .chip{background:var(--hud-chip)}
.hud .sp{flex:1}
.lives{display:flex;gap:3px}
.lives svg{width:22px;height:22px}
.lives .lost{opacity:.2;filter:grayscale(1)}
.combo{color:var(--heading);transition:transform .2s}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.progress{height:6px;border-radius:6px;background:var(--track);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp),var(--lamp2));transition:width .3s}

/* ── Třídírna: řada podezřelých ── */
.lineup{position:relative;height:250px;border-radius:var(--radius);overflow:hidden;
  background:
    repeating-linear-gradient(transparent 0 29px,var(--wall-line) 29px 31px),
    linear-gradient(var(--wall1),var(--wall2));border:1px solid var(--card-line)}
.lineup .nums{position:absolute;left:8px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;font-family:'Special Elite';font-size:.75rem;opacity:.5}
.lineup .floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(var(--floor1),var(--floor2))}
.lineup .spot{position:absolute;left:50%;top:-40px;width:340px;height:330px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0,rgba(255,240,190,.32),transparent 65%);pointer-events:none}
.suspect{position:absolute;left:50%;bottom:14px;width:150px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.suspect svg{width:120px;height:150px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.placard{margin-top:-30px;position:relative;z-index:2;background:#151515;color:#fff;font-family:'Special Elite',monospace;font-size:1.55rem;padding:6px 16px;border-radius:6px;border:3px solid #444;box-shadow:0 6px 12px rgba(0,0,0,.4);white-space:nowrap}
.suspect.enter{animation:walkIn .55s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes walkIn{from{transform:translateX(160%) rotate(8deg)}to{transform:translateX(-50%)}}
.suspect.exit-l{animation:exitL .5s ease-in both}.suspect.exit-c{animation:exitC .5s ease-in both}.suspect.exit-r{animation:exitR .5s ease-in both}
@keyframes exitL{to{transform:translateX(-260%) scale(.6);opacity:0}}
@keyframes exitC{to{transform:translateX(-50%) translateY(120px) scale(.6);opacity:0}}
@keyframes exitR{to{transform:translateX(160%) scale(.6);opacity:0}}
.suspect.laugh svg{animation:laugh .5s ease 2}
@keyframes laugh{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.suspect .eye-p{transition:transform .2s}
.bob svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.fx{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
.fx .stamp{font-size:1.6rem;background:rgba(251,243,224,.92);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:scale(2.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.timer{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin:10px 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--lamp);transform-origin:left}
.timer.low i{background:var(--bad)}

.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.door{position:relative;border-radius:14px 14px 8px 8px;padding:14px 8px 12px;min-height:96px;color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.3);transition:transform .1s,filter .1s}
.door:active{transform:translateY(3px)}
.door:hover{filter:brightness(1.1)}
.door b{font-family:'Baloo 2';font-size:1.9rem;line-height:1}
.door small{font-size:.8rem;opacity:.9}
.door .knob{position:absolute;right:12px;top:50%;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7)}
.door.M{background:linear-gradient(var(--m),#2667d6)}.door.F{background:linear-gradient(var(--f),#c42e62)}.door.N{background:linear-gradient(var(--n),#178a61)}
.door.hit{outline:4px solid #fff}
.door kbd{position:absolute;left:8px;top:6px;font-size:.7rem;opacity:.6;font-family:inherit}
.grid2{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:stretch}
.grid2 .rowh{display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;font-size:.8rem;text-align:center;padding:0 4px;opacity:.9}
.grid2 .rowh span{font-size:1.2rem}
.grid2 .colh{text-align:center;font-weight:800;font-size:.8rem;opacity:.85}
.grid2 .door{min-height:70px}
.grid2 .door b{font-size:1.35rem}

/* ── Vysvětlení chyby ── */
.explain{margin-top:14px}
.explain h3{color:var(--bad);font-size:1.15rem;margin-bottom:6px}
.explain.good h3{color:var(--ok)}
.explain p{margin:6px 0;font-weight:700;font-size:1.05rem}
.explain .steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.explain .step{background:#fff;border:2px solid var(--paper2);border-radius:10px;padding:5px 10px;font-weight:800}
.explain .arrow{opacity:.5;font-weight:900}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:900;font-size:1.05rem;background:linear-gradient(var(--lamp),var(--lamp2));color:#3a2600;box-shadow:0 5px 0 #b97614,0 10px 18px rgba(0,0,0,.3);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b97614}
.btn.ghost{background:var(--chip);color:var(--text);box-shadow:none}
.btn.dark{background:var(--ink);color:var(--paper);box-shadow:0 5px 0 #000}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── Výslech ── */
.interro{position:relative;border-radius:var(--radius);overflow:hidden;min-height:210px;background:radial-gradient(ellipse at 50% 0%,rgba(255,226,150,.35),transparent 60%),linear-gradient(#2d2a3a,#1a1824);border:1px solid rgba(255,255,255,.1);display:flex;align-items:flex-end;justify-content:center;padding-top:40px}
.interro .lamp{position:absolute;top:0;left:50%;width:2px;height:34px;background:#555;transform-origin:top;animation:swing 4s ease-in-out infinite}
.interro .lamp::after{content:"";position:absolute;left:-22px;top:30px;width:46px;height:22px;border-radius:46px 46px 4px 4px;background:#3b3b3b;box-shadow:0 14px 30px 10px rgba(255,220,130,.25)}
@keyframes swing{50%{transform:rotate(7deg)}0%,100%{transform:rotate(-7deg)}}
.interro .table{position:absolute;left:0;right:0;bottom:0;height:42px;background:linear-gradient(#6b4a2f,#4a311d);box-shadow:0 -4px 0 #7d5937}
.interro .suspect{position:relative;left:auto;bottom:22px;transform:none;width:auto}
.interro .suspect svg{width:110px;height:138px}
.interro .say{position:absolute;right:12px;top:14px;max-width:46%;background:var(--paper);color:var(--ink);border-radius:14px;padding:9px 12px;font-weight:800;font-size:.9rem;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:fadeUp .3s both}
.case-line{margin-top:-14px;position:relative;z-index:2}
.sentence{font-family:'Special Elite',monospace;font-size:1.45rem;line-height:1.55;color:var(--ink)}
.sentence mark{background:none;color:var(--ink);border-bottom:4px solid var(--f);padding:0 2px;font-weight:700;background:linear-gradient(transparent 60%,rgba(232,69,123,.25) 60%)}
.sentence .prep.lit{background:rgba(255,209,102,.6);border-radius:4px;padding:0 3px;box-shadow:0 0 0 2px var(--lamp2)}
.sentence .q{color:var(--m);font-weight:700;border-bottom:3px dashed var(--m)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tool{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--paper2);color:var(--ink);font-weight:800;font-size:.9rem}
.tool[disabled]{opacity:.45}
.clue{margin-top:10px;padding:10px 12px;border-left:5px solid var(--lamp2);background:#fff6dc;border-radius:6px;font-weight:700;color:var(--ink)}
.preview{margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef4ff;border:2px dashed var(--m);color:var(--ink);font-weight:700;min-height:48px}
.preview .lbl{display:block;font-size:.78rem;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.preview .sentence{font-size:1.15rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:14px}
.qcard{position:relative;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 8px 9px;text-align:center;font-weight:800;box-shadow:0 4px 0 #cbb88f,0 6px 12px rgba(0,0,0,.25);transition:transform .12s}
.qcard:hover{transform:translateY(-2px)}
.qcard .n{display:block;font-family:'Baloo 2';font-size:1.45rem;color:var(--m);line-height:1}
.qcard .qq{font-size:.86rem}
.qcard.sel{background:#fff;outline:3px solid var(--m);transform:translateY(-3px)}
.qcard.right{outline:3px solid var(--ok)}
.qcard.wrong{outline:3px solid var(--bad);opacity:.7}
.qcard kbd{position:absolute;left:6px;top:4px;font-size:.65rem;opacity:.5;font-family:inherit}
.accuse{margin-top:14px;display:flex;justify-content:center}

/* ── Výsledky / spis ── */
.result{text-align:center;max-width:520px;margin:10px auto}
.result .bigstars{font-size:2.8rem;letter-spacing:6px;color:var(--lamp);text-shadow:0 2px 0 #b97614;margin:8px 0}
.result .bigstars .off{color:#d6c8a8;text-shadow:none}
.result .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.result .stat{background:#fff;border-radius:10px;padding:8px}
.result .stat b{display:block;font-size:1.4rem;font-family:'Baloo 2'}
.result .stat small{color:var(--ink2);font-weight:800}
.newbadge{display:inline-flex;align-items:center;gap:8px;background:#fff3c4;border:2px solid var(--lamp2);border-radius:12px;padding:6px 12px;margin:4px;font-weight:800;animation:pop .5s}
.rankup{margin:10px 0;font-weight:900;color:var(--f);font-size:1.1rem}
.mistakes{text-align:left;margin-top:10px}
.mistakes li{margin:3px 0;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}

.profile .head{display:flex;gap:14px;align-items:center}
.profile .head svg{width:84px;height:100px}
.xpbar{height:12px;border-radius:12px;background:#e6d8b8;overflow:hidden;margin:8px 0 2px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp),var(--lamp2))}
.bars{display:grid;gap:7px;margin:10px 0 4px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;font-weight:800;font-size:.9rem}
.bar .track{height:12px;background:#e6d8b8;border-radius:12px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:12px}
.bar .pct{text-align:right;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.badge{text-align:center;padding:10px 6px;border-radius:12px;background:#fff;border:2px solid var(--paper2);font-weight:800;font-size:.85rem}
.badge .bi{font-size:1.8rem;display:block}
.badge.off{opacity:.35;filter:grayscale(1)}
.profile h3{color:var(--ink);margin-top:18px;font-size:1.15rem}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,9,20,.7);display:grid;place-items:center;padding:16px;animation:fadeUp .25s both}
.modal .paper{max-width:480px;width:100%}
.modal h2{color:var(--ink);font-size:1.5rem;margin-bottom:8px}
.modal p{font-weight:700;line-height:1.45}

.demo-cta{margin-top:24px;text-align:center}
.demo-cta a{color:var(--heading);font-weight:900}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ── Pro rodiče ── */
.parent-btn{border:1.5px solid var(--bar-line);color:var(--text)}
.parent-btn .pb-short{display:none}
.pmodal{position:fixed;inset:0;z-index:60;background:rgba(5,9,20,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;animation:fadeUp .2s both}
.pbox{width:min(860px,100%);margin:auto;color:var(--ink);background-image:none;padding:20px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.phead h2{font-size:1.6rem;color:var(--ink)}
.phead .noprint{display:flex;gap:6px;flex-shrink:0}
.pkicker{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);font-weight:800}
.pbox h3{font-size:1.15rem;margin:22px 0 8px;color:var(--ink)}
.pgate{max-width:380px;margin:10px auto;display:flex;flex-direction:column;gap:8px}
.pgate p{margin:0 0 6px;font-weight:700;line-height:1.45}
.pgate label{font-weight:900;font-size:.9rem}
.pgate input{font:inherit;padding:11px 12px;border-radius:10px;border:2px solid var(--paper2);background:#fff;color:var(--ink)}
.perr{min-height:20px;color:var(--bad);font-weight:800;font-size:.9rem}
.plink{text-decoration:underline;color:var(--ink2);font-weight:700;margin-top:4px}
.pnote{color:var(--ink2);font-weight:600;font-size:.85rem;line-height:1.45}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ptile{background:#fff;border:2px solid var(--paper2);border-radius:12px;padding:10px;text-align:center}
.ptile b{display:block;font-family:'Baloo 2';font-size:1.6rem;line-height:1.1}
.ptile span{font-size:.78rem;font-weight:800;color:var(--ink2)}
.prec{margin-top:14px;padding:12px 14px;border-radius:12px;background:#eef4ff;border-left:5px solid #3a6fd8;font-weight:700;line-height:1.45}
.plegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:.82rem;font-weight:800;color:var(--ink2)}
.plegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.s1{background:#1f9e6e}.s2{background:#e8a33a}.s3{background:#d64545}.s0{background:#e6dcc4}
.pchart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:150px;padding:6px 4px 0;border-bottom:1px solid #d9ccb0}
.pday{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.pcol{width:70%;max-width:26px;height:110px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.pcol i{display:block;width:100%;border-radius:2px}
.pcol i:first-child{border-radius:4px 4px 2px 2px}
.pday:hover .pcol i{filter:brightness(1.1)}
.pv{font-size:.7rem;font-weight:800;color:var(--ink2);min-height:14px}
.pd{font-size:.68rem;font-weight:700;color:var(--ink2);margin-top:3px}
.pgroup{margin-top:10px;background:#fff;border-radius:12px;padding:10px 12px;border:2px solid var(--paper2)}
.pgroup h4{margin:0 0 6px;font-size:1rem}.pgroup h4 small{color:var(--ink2);font-weight:700}
.prow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 56px 158px;gap:10px;align-items:center;padding:4px 0;font-size:.88rem;font-weight:700}
.pbar{display:flex;gap:2px;height:12px}
.pbar i{display:block;height:100%}
.pbar i:first-child{border-radius:4px 0 0 4px}.pbar i:last-child{border-radius:0 4px 4px 0}.pbar i:only-child{border-radius:4px}
.pn{text-align:right;font-weight:900}.pn small{display:block;font-size:.68rem;color:var(--ink2);font-weight:700}
.pm{font-size:.8rem;font-weight:800;padding:3px 8px;border-radius:999px;text-align:center;white-space:nowrap}
.pm.ok{background:#e3f5ec;color:#156b4b}.pm.mid{background:#fdf0d8;color:#8a5a0b}.pm.low{background:#fbe1e1;color:#9b2626}.pm.na{background:#f1ece0;color:#7a6c55}
.pconf{display:grid;gap:8px}
.pci{background:#fff;border-radius:12px;padding:10px 12px;border-left:5px solid #e8a33a}
.pci p{margin:6px 0 0;font-weight:600;color:var(--ink2);line-height:1.45}
.pcount{display:inline-block;padding:1px 8px;border-radius:999px;background:#fdf0d8;font-size:.78rem;font-weight:900}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{background:#fff;border:2px solid var(--paper2);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.85rem}
.ptable{overflow-x:auto}
.ptable table{width:100%;border-collapse:collapse;font-size:.88rem}
.ptable th,.ptable td{text-align:left;padding:6px 8px;border-bottom:1px solid #e6dcc4}
.ptable th{color:var(--ink2);font-size:.78rem;text-transform:uppercase}
.pst{color:#c98a17;letter-spacing:1px}
.pdid{background:#fff;border-radius:12px;padding:6px 14px;font-weight:600;line-height:1.5}
.pbox .btn.ghost{background:var(--paper2);color:var(--ink)}
@media print{
  body>*:not(.pmodal){display:none!important}
  .pmodal{position:static;background:none;padding:0;overflow:visible}
  .pbox{box-shadow:none;width:100%}
  .noprint{display:none!important}
}
@media (max-width:560px){
  .parent-btn .pb-full{display:none}.parent-btn .pb-short{display:inline}
  .brand>span{display:none}
  .iconbtn{width:34px;height:34px}
  .chip{padding:5px 9px}
  .prow{grid-template-columns:1fr 50px;row-gap:4px}
  .prow .pbar{grid-column:1/-1;order:3}
  .prow .pm{grid-column:1/-1;order:4;justify-self:start}
  .pbox{padding:14px}
  .rk-name{display:none}
  .topbar{gap:6px;padding:8px 12px}
  .brand{font-size:1.1rem}
  .lineup{height:220px}
  .placard{font-size:1.3rem}
  .sentence{font-size:1.2rem}
  .door{min-height:84px}
  .door b{font-size:1.5rem}
  .grid2 .door b{font-size:1.1rem}
  .grid2 .door small{font-size:.7rem}
  .bar{grid-template-columns:96px 1fr 44px}
  .hero .who{width:84px}
  .interro .say{max-width:52%;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="scene"><svg id="city" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1200 700" aria-hidden="true"></svg><div class="photo"></div></div>

<header class="topbar">
  <button class="brand" data-act="home" aria-label="Domů">
    <svg viewBox="0 0 40 40"><circle cx="16" cy="16" r="11" fill="none" stroke="#ffd166" stroke-width="4"/><path d="M24 24l11 11" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/><circle cx="16" cy="16" r="6" fill="rgba(255,255,255,.25)"/></svg>
    <span>Fajn<b>Detektiv</b></span>
  </button>
  <span id="demoBadge" class="demo-badge" hidden>DEMO</span>
  <span class="sp"></span>
  <span class="chip rank" id="rankChip"></span>
  <button class="chip parent-btn" data-act="parent" title="Přehled pro rodiče"><span class="pb-full">Pro rodiče</span><span class="pb-short">👪</span></button>
  <button class="iconbtn" data-act="profile" title="Spis detektiva" aria-label="Spis detektiva">📁</button>
  <button class="iconbtn theme-btn" data-act="theme" title="Přepnout téma" aria-label="Přepnout téma">🌙</button>
  <button class="iconbtn" data-act="sound" id="soundBtn" title="Zvuk" aria-label="Zvuk">🔊</button>
</header>

<main id="app"></main>

<script>
'use strict';
const DEMO = /-demo(\.html?)?$/i.test(location.pathname);
const FULL_URL = 'https://fajndoucko.cz';

/* ══════════════ DATA ══════════════ */
const ROD = {
  M:{ukaz:'ten', name:'mužský', color:'var(--m)'},
  F:{ukaz:'ta',  name:'ženský', color:'var(--f)'},
  N:{ukaz:'to',  name:'střední', color:'var(--n)'}
};
// slovo | množné číslo (= stejný tvar, prázdné = nemá) | rod (+a = životný)
const NOUNS = `hrad|hrady|M|hrad|hradu
strom|stromy|M|hrad|stromu
stůl|stoly|M|hrad|stolu
dům|domy|M|hrad|domu
míč|míče|M|stroj|míče
klíč|klíče|M|stroj|klíče
nůž|nože|M|stroj|nože
koš|koše|M|stroj|koše
deštník|deštníky|M|hrad|deštníku
vlak|vlaky|M|hrad|vlaku
autobus|autobusy|M|hrad|autobusu
obchod|obchody|M|hrad|obchodu
sešit|sešity|M|hrad|sešitu

function weightedPick(items, wf, n){
  const pool=items.map(it=>({it,w:Math.max(.05,wf(it))})), out=[];
  while(out.length<n && pool.length){
    let tot=pool.reduce((s,x)=>s+x.w,0), r=Math.random()*tot, i=0;
    for(;i<pool.length-1;i++){ r-=pool[i].w; if(r<=0)break; }
    out.push(pool.splice(i,1)[0].it);
  }
  return out;
}

/* Měkké tóny (zvonkohra/marimba) – pentatonika, takže cokoli zazní spolu, ladí. */
let AC, MASTER;
function audio(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=.55;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2800;
    const comp=AC.createDynamicsCompressor();
    MASTER.connect(lp).connect(comp).connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28];
const hz=semi=>523.25*Math.pow(2,semi/12);           // C5 = 0
function note(semi,{d=.45,vol=.11,delay=0,bell=true,glide=0}={}){
  if(!S.sound) return;
  try{
    const c=audio(), t=c.currentTime+delay, f=hz(semi);
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+d); g.connect(MASTER);
    const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f,t);
    if(glide) o.frequency.exponentialRampToValueAtTime(f*Math.pow(2,glide/12),t+d);
    o.connect(g); o.start(t); o.stop(t+d+.05);
    if(bell){ // jemný „cink“ – vyšší harmonická, která rychle odezní
      const o2=c.createOscillator(), g2=c.createGain();
      o2.type='sine'; o2.frequency.setValueAtTime(f*3.01,t);
      g2.gain.setValueAtTime(vol*.22,t); g2.gain.exponentialRampToValueAtTime(.0003,t+d*.35);
      o2.connect(g2).connect(MASTER); o2.start(t); o2.stop(t+d*.35+.05);
    }
  }catch(e){}
}
const OK_MOTIFS=[[0,2],[0,4],[1,3],[2,4],[0,3],[1,4],[2,5],[0,2,4],[1,2],[3,5]];
const BAD_MOTIFS=[[-5,-8],[-3,-7],[-7,-10],[-8,-12]];
let lastOk=-1, lastBad=-1;
function varied(list,last){ let i; do{ i=Math.random()*list.length|0; }while(list.length>1&&i===last); return i; }
const sfx = {
  ok(streak=0){
    const i=varied(OK_MOTIFS,lastOk); lastOk=i;
    const lift=Math.min(streak,6);                   // série = motivy stoupají
    OK_MOTIFS[i].forEach((step,k)=>note(PENTA[step+lift],{d:.5,vol:.1,delay:k*.09}));
  },
  bad(){
    const i=varied(BAD_MOTIFS,lastBad); lastBad=i;
    BAD_MOTIFS[i].forEach((s,k)=>note(s-12,{d:.35,vol:.08,delay:k*.16,bell:false,glide:-1}));
  },
  stamp(){ note(-24,{d:.18,vol:.07,bell:false,glide:-5}); },
  pick(p=1){ note(PENTA[p-1]-12,{d:.18,vol:.05,bell:false}); },
  win(){ [0,2,3,4,5,7].forEach((s,k)=>note(PENTA[s],{d:.9,vol:.09,delay:k*.11})); },
  combo(n){ [7,8,9].forEach((s,k)=>note(PENTA[Math.min(s+(n>=8?2:0),12)],{d:.3,vol:.05,delay:.25+k*.06})); }
};

function say(text){
  if(!('speechSynthesis' in window)) return;
  try{

    const v=speechSynthesis.getVoices().find(v=>/^cs/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function scoreSolved(base){

function buildAsk(L){
  const pool=SENTENCES.filter(s=>s.l<=L.maxL), out=[];
  let tries=0;
  while(out.length<L.count && tries++<200){
    const [s]=weightedPick(pool.filter(x=>!out.includes(x)), x=>1+3*(S.weak['v'+x.id]||0)+2.5*errRate('pad',x.p)+(L.maxL===2&&x.l===2?1:0), 1);
    if(!s) break;
    if(out.length && out[out.length-1].p===s.p && tries<150) continue; // ne dva stejné pády po sobě
    out.push(s);
  }
  return out;
}
function sentenceHTML(t, litPrep){
  return esc(t).replace(/\{(.+?)\}/g,`<span class="prep${litPrep?' lit':''}">$1</span>`).replace(/\[(.+?)\]/g,'<mark>$1</mark>');
}
function questionSentence(s,p){

  let q=PAD[p].q; if(p===6) q='kom? čem?';
  const plain=s.t.replace(/[{}]/g,'');
  const start=plain.indexOf('[')===0;
  return esc(plain.replace(/\[.+?\][.!]?/, '§')).replace('§',`<span class="q">${start?cap(q):q}</span>`);
}

  const idx=el.dataset.s!==undefined ? +el.dataset.s : null, sl=idx!==null?g.P.slots[idx]:null;
  if(sl && sl.fake && !sl.done) return beginFix(idx,el);
  if(sl && sl.done) return;

  el.classList.remove('okword'); void el.offsetWidth; el.classList.add('okword');
  const reveal=wrongAttempt();
  const tb=$('#tryfb'); if(tb && tb.firstChild) tb.firstChild.insertAdjacentHTML('afterbegin','Tohle slovo je v pořádku. ');
  if(reveal){
    g.failedThis=true;
    const k=g.P.slots.findIndex(x=>x.fake&&!x.done), e=document.querySelector(`.cs[data-s="${k}"]`);
    $('#tryfb').innerHTML='<div class="tryagain soft">🔎 Ukážu ti, kde padělek je. Teď ho oprav.</div>';

}
function beginFix(idx,el){
  const g=game, sl=g.P.slots[idx], L=g.L;
  g.phase='fix'; g.fixing=idx; g.findWrongs=g.itemWrongs;
  document.querySelectorAll('.sent').forEach(e=>e.classList.remove('lit')); $('#hintbox').innerHTML='';
  el.classList.add('found'); sfx.pick(3);
  if(!g.failedThis) $('#tryfb').innerHTML='';
  newQuestion(()=>caseFixHint(sl));
  const T=slotForms(sl), others=caseFakes(sl,'mix').filter(f=>f!==sl.fake);
  const opts=shuffle([T[0], sl.fake, ...shuffle(others).slice(0,L.opts-2)]);
  const q=fixQuestion(sl);
  $('#fixpanel').innerHTML=`<div class="fixbox"><h3>🔍 Padělek nalezen: <s>${esc(capF(sl,sl.fake))}</s></h3>
    <p class="hint">${L.ask?(sl.kind==='adj'?`Patří ke slovu ${q}`:`Zeptej se: <span class="frame">${q}</span>`):'Jaký tvar sem patří?'}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="xopt" data-v="${esc(o)}"><kbd>${i+1}</kbd>${esc(capF(sl,o))}</button>`).join('')}</div></div>`;
  $('#fixpanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function fixQuestion(sl){
  if(sl.kind==='adj') return `<b>${esc(sl.nf)}</b> – ${ROD4[sl.rk].s}, ${CIS[sl.c]}, ${sl.p}. pád`;
  const P=game.P, st=P.sents[sl.si], ids=P.slots.map((x,i)=>i).filter(i=>P.slots[i].si===sl.si); let c=0;
  const q = sl.p===5 ? 'oslovujeme' : (sl.p===6?'kom? čem?':PAD[sl.p].q);
  return esc(st.replace(SLOT_RE,()=>{ const x=P.slots[ids[c++]]; if(x===sl) return '§'; return capF(x,(x.fake&&!x.done)?x.fake:slotForms(x)[0]); }))
    .replace('§',`<b class="q">${sl.cap?cap(q):q}</b>`);
}
function caseFixHint(sl){
  if(sl.kind==='adj') return `Podstatné jméno ${fixQuestion(sl)}. Přídavné jméno <b>${esc(sl.a.w)}</b> (vzor ${sl.a.vzor}) musí mít stejný rod, číslo i pád.${sl.rk==='Ma'&&sl.c==='pl'&&sl.p===1?' Pozor: rod mužský životný v 1. pádě množného čísla → -í (malí psi).':''}`;
  const vf=vzorForm(sl.k.vzor,sl.p,sl.c);
  return `${game.L.ask?'':`Zeptej se: <span class="frame">${fixQuestion(sl)}</span> `}Je to ${sl.p}. pád (${CIS[sl.c]}). Slovo <b>${esc(sl.w)}</b> se skloňuje podle vzoru <b>${sl.k.vzor}</b> – ten má v tomto pádě tvar <b>${esc(vf)}</b>.`;
}
function caseFix(v,el){
  const g=game; if(!g||g.phase!=='fix') return;
  const idx=g.fixing, sl=g.P.slots[idx], T=slotForms(sl), ok=T.includes(v), L=g.L;
  const finishFix=(good)=>{
    sl.done=true; g.fakeLeft--; g.phase='wait';
    const e=document.querySelector(`.cs[data-s="${idx}"]`); e.textContent=capF(sl,T[0]); e.classList.remove('found'); e.classList.add(good?'fixed':'fixedbad');
    document.querySelectorAll('#fixpanel .opt').forEach(b=>{ b.disabled=true; if(T.includes(b.dataset.v)) b.classList.add('right'); });
    $('#fleft').textContent=g.fakeLeft;
  };
  if(ok){
    const first=!g.itemWrongs, findFirst=!g.findWrongs;
    const CAT=g.m.id==='hlidka'?'hlidka':'pripad';
    stat(CAT,'find',!g.failedThis,findFirst); stat(CAT,'fix',true,g.itemWrongs===g.findWrongs);
    finishFix(true); $('#tryfb').innerHTML='';
    let pts=0;
    if(g.failedThis){ scoreFailed(g.items[g.i]); } else pts=scoreSolved(L.sly?18:L.mark?12:15);
    sfx.ok(g.streak); $('#score').textContent=g.score;
    $('#fixpanel').innerHTML=`<div class="explain good"><h3>Opraveno!${pts?` +${pts}`:''}</h3><p class="hint">${fixQuestion(sl)} → <b>${esc(capF(sl,T[0]))}</b> (${sl.p}. pád, ${CIS[sl.c]})</p></div>`;
    return caseNext();
  }
  if(el){ el.disabled=true; el.classList.add('wrong'); }
  if(sl.kind==='adj') confuse(stripIY(v)===stripIY(T[0]) ? 'shoda|iy' : ['Ma','Mi','F','N'].some(gg=>af(sl.a,gg,sl.c,sl.p).includes(v)) ? 'shoda|rod' : 'shoda|pad');
  else if(stripIY(v)===stripIY(T[0])) confuse('iy|pripad');
  if(!wrongAttempt()) return;
  const CAT=g.m.id==='hlidka'?'hlidka':'pripad';
  stat(CAT,'find',!g.failedThis,!g.findWrongs); stat(CAT,'fix',false,false);
  finishFix(false); scoreFailed(g.items[g.i]);
  $('#fixpanel').innerHTML=`<div class="explain"><h3>Takhle to má být:</h3>
    <div class="steps"><span class="step">${fixQuestion(sl)}</span><span class="arrow">→</span><span class="step" style="color:var(--ok)">${esc(capF(sl,T[0]))}</span></div>
    ${sl.kind==='adj'
      ? `<p>Přídavné jméno <b>${esc(sl.a.w)}</b> musí mít stejný rod, číslo i pád jako <b>${esc(sl.nf)}</b> → <b>${esc(T[0])} ${esc(sl.nf)}</b>.${sl.rk==='Ma'&&sl.c==='pl'&&sl.p===1?' Rod mužský životný, 1. pád množného čísla → -í.':''}</p>`
      : `<p>Slovo <b>${esc(sl.w)}</b> (vzor <b>${sl.k.vzor}</b>) je tu v ${sl.p}. pádě, ${CIS[sl.c]}: vzor ${sl.k.vzor} → <b>${esc(vzorForm(sl.k.vzor,sl.p,sl.c))}</b>.</p>`}</div>`;
  caseNext(true);
}
function caseNext(wait){
  const g=game;
  if(g.fakeLeft>0){
    const go=()=>startFind();
    if(wait){ $('#fb').innerHTML='<div class="actions"><button class="btn dark" data-act="cnext">Hledat další padělek →</button></div>'; g.afterFix=go; }
    else setTimeout(()=>{ if(game===g && g.phase==='wait'){ go(); } },900);
    return;
  }
  g.answered=true; sfx.stamp();
  $('#fb').innerHTML=`<div class="explain good"><div class="reveal"><span class="stamp ok">SPIS UZAVŘEN</span><p>Všechny padělky jsou odhalené a opravené.</p></div>
    <div class="actions"><button class="btn dark" data-act="next">${g.i+1<g.items.length?'Další spis →':'Dokončit případ →'}</button></div></div>`;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  save();
}

function genDruh(L){

      conf:v=>`adj|${a.druh}|${L.mode===3?ADJ.find(x=>x.vzor===v).druh:v}`, weak:'a|'+a.w, base:L.mode===1?10:L.mode===2?12:15 };
  });
}
const frameKey=(p,c)=> p===1 ? (c==='sg'?'je':'jsou') : String(p);
function genAgree(L){
  const out=[];
  for(let t=0; out.length<L.count && t<200; t++){
    const type=randOf(L.types), aw=randOf(ADJ_UNI[type]), a=ADJ.find(x=>x.w===aw);
    const k=KWORDS[Math.random()*KWORDS.length|0], rk=VZROD[k.vzor], c=randOf(L.nums), p=randOf(L.pads);
    if(!(S.weak['s|'+rk+c+p]>0) && Math.random()<.4*(1-errRate('shoda','r'+rk))) continue;   // víc procvičuj slabá místa
    const nf=k.f[c==='sg'?'s':'p'][p-1][0];
    // všechna čtení (číslo, pád), která dávají stejný rámec i stejný tvar podstatného jména
    const valid=new Set();
    ['sg','pl'].forEach(c2=>[1,2,3,4,6,7].forEach(p2=>{ if(frameKey(p2,c2)===frameKey(p,c) && k.f[c2==='sg'?'s':'p'][p2-1].includes(nf)) af(a,rk,c2,p2).forEach(f=>valid.add(f)); }));

    const sameSlot=['Ma','Mi','F','N'].flatMap(g=>af(a,g,c,p)).filter(f=>!valid.has(f));
    const rest=[...all].filter(f=>!valid.has(f) && !sameSlot.includes(f));
    const opts=[...new Set([T[0], ...shuffle([...new Set(sameSlot)]), ...shuffle(rest)])].slice(0,L.opts);

function pickAnswer(v,el){

  }
  if(el){ el.disabled=true; el.classList.add('wrong'); }

  const sus=$('#sus'); sus.classList.remove('laugh'); void sus.offsetWidth; sus.classList.add('laugh');
  if(!wrongAttempt()){ $('#tryfb').scrollIntoView({behavior:'smooth',block:'nearest'}); save(); return; }
  g.answered=true; it.stats.forEach(([c,k])=>stat(c,k,false,false)); scoreFailed(it); S.weak[it.weak]=(S.weak[it.weak]||0)+1;
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(it.ok.includes(b.dataset.v)) b.classList.add('right'); });
  $('#fb').innerHTML=`<div class="explain"><h3>Takhle to je:</h3>${it.why}<div class="actions"><button class="btn dark" data-act="next">Rozumím →</button></div></div>`;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'}); save();
}

 ['malovat','maluju|maluji,maluješ,maluje,malujeme,malujete,malují|malujou','maloval','maluj,malujme,malujte'],

];
const PK=['1s','2s','3s','1p','2p','3p'];
function vForms(v){ const [inf,pres,l,imp]=v, P=pres.split(','), I=imp.split(','), f={inf:[[inf]]};
 PK.forEach((k,i)=>{ const pl=k[1]==='p', L=pl?l+'i':l;
  f['pri'+k]=P[i].split('|');
  f['min'+k]=[[L+' jsem',L+' jsi',L,L+' jsme',L+' jste',L][i]];
  f['bud'+k]=[['budu','budeš','bude','budeme','budete','budou'][i]+' '+inf];
  f['podm'+k]=[[L+' bych',L+' bys',L+' by',L+' bychom',L+' byste',L+' by'][i]];
 });
 f['rozk2s']=[I[0]]; f['rozk1p']=[I[1]]; f['rozk2p']=[I[2]];
 return f; }

const VF = VERBS.map(v=>({inf:v[0], l:v[2], f:vForms(v)}));
const PRON = {'1s':'já','2s':'ty','3s':'on','1p':'my','2p':'vy','3p':'oni'};
const PRON_L = {'1s':'já','2s':'ty','3s':'on / ona / ono','1p':'my','2p':'vy','3p':'oni / ony / ona'};

const ZP_L = {ozn:'oznamovací', rozk:'rozkazovací', podm:'podmiňovací'};
const kindZp = k=> k==='rozk'?'rozk':k==='podm'?'podm':'ozn';
const catsTxt = (kind,key)=> kind==='inf' ? 'neurčitý tvar' : `${key[0]}. osoba, ${key[1]==='s'?'jednotné':'množné'} číslo, ${ZP_L[kindZp(kind)]} způsob${kindZp(kind)==='ozn'?`, čas ${CAS_L[kind]}`:''}`;
function vPickForm(mode){
  const kinds = mode===1 ? ['min','pri','bud'] : ['min','pri','bud','pri','rozk','podm'].concat(mode===3?['inf']:[]);
  const kind=randOf(kinds), v=randOf(VF);
  const key = kind==='inf' ? '' : kind==='rozk' ? randOf(['2s','1p','2p']) : randOf(PK);
  return {v, kind, key, forms: v.f[kind==='inf'?'inf':kind+key]};
}
function buildVsteps(L){ const out=[]; for(let i=0;i<L.count;i++){ const x=vPickForm(L.mode); out.push({...x, w:x.forms[0], form:x.forms[0], vs:true}); } return out; }
function vStepDefs(it,L){

  if(L.mode===1){
    S_('kdo','Kdo to dělá?','Zkus před tvar postupně dát já, ty, on, my, vy, oni. Které zní správně?',
      PK.map(x=>({v:x, html:PRON_L[x]})), k, ['kdo',PRON_L[k]], `<b>${PRON[k]} ${esc(f)}</b> → ${k[0]}. osoba, ${k[1]==='s'?'jednotné':'množné'} číslo.`);
    S_('cas','Kdy se to děje?','Děje se to teď, už se to stalo, nebo se to teprve stane?',
      ['min','pri','bud'].map(x=>({v:x, html:`čas<br><b>${CAS_L[x]}</b>`})), it.kind, ['čas',CAS_L[it.kind]], casWhy(it));

  }
  if(L.mode===3) S_('tvar','Je to určitý, nebo neurčitý tvar?','Dá se poznat, kdo to dělá? Neurčitý tvar (neurčitek) končí na -t nebo -ct a osobu nemá.',
    [{v:'urc',html:'<b>určitý</b><small>poznám osobu</small>'},{v:'neurc',html:'<b>neurčitý</b><small>neurčitek</small>'}], it.kind==='inf'?'neurc':'urc',
    ['tvar', it.kind==='inf'?'neurčitý':'určitý'], it.kind==='inf' ? `<b>${esc(f)}</b> je neurčitek – osobu, číslo, čas ani způsob neurčujeme.` : `U tvaru <b>${esc(f)}</b> poznáme, kdo děj dělá → určitý tvar.`);
  if(it.kind==='inf') return steps;
  S_('osoba','Která osoba?','Zkus před tvar dát já, ty, on, my, vy, oni. Já / my = 1. osoba, ty / vy = 2. osoba, on / oni = 3. osoba.',
    ['1','2','3'].map(x=>({v:x, html:`<b>${x}.</b> osoba`})), k[0], ['osoba',k[0]+'.'], `<b>${PRON[k]} ${esc(f)}</b> → ${k[0]}. osoba.`);
  S_('cislo','Jaké číslo?','Dělá to jeden, nebo víc?',
    [{v:'s',html:'<b>jednotné</b><small>jeden</small>'},{v:'p',html:'<b>množné</b><small>víc</small>'}], k[1], ['číslo',k[1]==='s'?'jednotné':'množné'], `${PRON[k]} = ${k[1]==='s'?'jeden':'víc'} → ${k[1]==='s'?'jednotné':'množné'} číslo.`);
  S_('zpusob','Jaký způsob?','Oznamuje, co se děje? Rozkazuje (!)? Nebo je tam by / bych / bychom / byste?',
    ['ozn','rozk','podm'].map(x=>({v:x, html:`<b>${ZP_L[x]}</b>`})), zp, ['způsob',ZP_L[zp]],
    zp==='ozn' ? `<b>${esc(f)}</b> oznamuje, co se děje, dělo nebo bude dít → oznamovací.` : zp==='rozk' ? `<b>${esc(f)}!</b> – rozkazuje, vybízí → rozkazovací.` : `<b>${esc(f)}</b> – obsahuje <b>by</b> → podmiňovací.`);
  if(zp==='ozn') S_('cas','Jaký čas?','Děje se to teď, už se to stalo, nebo se to teprve stane?',
    ['min','pri','bud'].map(x=>({v:x, html:`<b>${CAS_L[x]}</b>`})), it.kind, ['čas',CAS_L[it.kind]], casWhy(it));
  return steps;
}
function casWhy(it){ const f=esc(it.form);
  return it.kind==='min' ? `<b>${f}</b> – tvar s <b>-l</b> (${esc(it.v.l)}) → už se to stalo → čas minulý.` : it.kind==='bud' ? `<b>${f}</b> – budu, budeš… + neurčitek → teprve se to stane → čas budoucí.` : `<b>${f}</b> – děje se to teď → čas přítomný.`; }
function vstepsRound(){

function vStep(){
  const g=game, it=g.items[g.i], st=it.steps[g.si];

  $('#step').innerHTML=`<div class="stepnum">Krok ${g.si+1} / ${it.steps.length}</div><h3>${st.q}</h3><div id="hintbox"></div>

    <div id="tryfb"></div><div id="fb"></div>`;

}
function vAnswer(v,el){
  const g=game; if(!g||g.stepAnswered) return;
  const it=g.items[g.i], st=it.steps[g.si], ok=v===st.ok, last=g.si===it.steps.length-1;
  if(!ok){
    if(el){ el.disabled=true; el.classList.add('wrong'); }
    confuse(`v|${st.id}|${st.ok}|${v}`);
    if(!wrongAttempt()) return;
    g.wordFailed=true;
  }
  g.stepAnswered=true; $('#tryfb').innerHTML='';
  const first=g.tries===0 && ok;
  stat('vcat',st.id,ok,first); stat('v'+st.id,st.ok,ok,first);
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.v===st.ok) b.classList.add('right'); });
  const notes=$('#notes'); const em=notes.querySelector('.empty'); if(em) em.remove();
  notes.insertAdjacentHTML('beforeend',`<div class="note ${ok?'':'bad'}"><small>${st.note[0]}</small>${st.note[1]}</div>`);
  if(!last){
    if(ok){ sfx.pick(g.si+2); setTimeout(()=>{ g.si++; vStep(); },550); }
    else $('#fb').innerHTML=`<div class="explain"><h3>Takhle to je:</h3><p>${st.why}</p><div class="actions"><button class="btn dark" data-act="vstep">Pokračovat →</button></div></div>`;
    return;
  }
  let head;
  if(!g.wordFailed){ const pts=scoreSolved(g.L.mode===1?10:g.L.mode===2?14:16); sfx.ok(g.streak); setTimeout(sfx.stamp,120); $('#score').textContent=g.score; head=`<h3>Vlak vypraven! +${pts}</h3>`; }
  else { scoreFailed(it); head=`<h3>Tenhle vlak ujel.</h3><p>${st.why}</p>`; }
  $('#fb').innerHTML=`<div class="explain ${g.wordFailed?'':'good'}">${head}
    <div class="steps"><span class="step">${esc(it.form)}</span><span class="arrow">→</span><span class="step" style="color:var(--ok)">${g.L.mode===1?`${PRON_L[it.key]}, čas ${CAS_L[it.kind]}`:catsTxt(it.kind,it.key)}</span></div>
    <div class="actions"><button class="btn dark" data-act="next">Další vlak →</button></div></div>`;
  g.answered=true; save(); $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* Výhybka – tvoření tvarů */
function genVform(L){
  const out=[];
  for(let t=0; out.length<L.count && t<200; t++){
    const kinds = L.mode===1 ? ['pri'] : L.mode===2 ? ['min','pri','bud'] : ['min','pri','bud','rozk','podm','podm'];
    const kind=randOf(kinds), v=randOf(VF), key = kind==='rozk' ? randOf(['2s','1p','2p']) : randOf(PK);
    if(L.mode===3 && kind==='podm' && Math.random()<.5) continue;
    const T=v.f[kind+key], L_=key[1]==='p'?v.l+'i':v.l;
    const pool=new Set();
    Object.entries(v.f).forEach(([kk,arr])=>{ if(kk==='inf') return; if((L.mode===1 && kk.startsWith('pri')) || (L.mode===2 && /^(min|pri|bud)/.test(kk)) || L.mode===3) arr.forEach(x=>pool.add(x)); });
    const traps=[];
    if(L.mode===3){
      if(kind==='podm'&&key==='1p') traps.push(L_+' bysme', L_+' by jsme');
      if(kind==='min'&&key==='1s') traps.push(v.l+' sem');
      if(kind==='pri'&&key==='3p'&&/ají$/.test(T[0])) traps.push(T[0].replace(/ají$/,'aj'));
      if(kind==='podm'&&key==='2p') traps.push(L_+' by jste');
    }
    const sameKind=[...pool].filter(x=>!T.includes(x) && Object.entries(v.f).some(([kk,a])=>kk.startsWith(kind)&&a.includes(x)));
    const rest=[...pool].filter(x=>!T.includes(x) && !sameKind.includes(x));
    const opts=[...new Set([T[0], ...shuffle(traps), ...shuffle(sameKind), ...shuffle(rest)])].slice(0,L.opts);
    const cats = catsTxt(kind,key);
    out.push({ sign:v.inf, w:v.inf, q:'Utvoř tvar slovesa', sub:`<b>${esc(v.inf)}</b> → ${cats}${L.mode<3?` <span class="adjbase">${PRON[key]} ______</span>`:''}`,
      opts:shuffle(opts).map(x=>({v:x, html:esc(x)})), ok:T,
      hint: kind==='min' ? `Minulý čas: tvar s -l (${esc(v.l)}), v 1. a 2. osobě přidej jsem / jsi / jsme / jste.` : kind==='bud' ? 'Budoucí čas: budu / budeš / bude / budeme / budete / budou + neurčitek.' : kind==='rozk' ? 'Rozkazovací způsob: jak bys někomu přikázal? (ty: …!, my: …me!, vy: …te!)' : kind==='podm' ? 'Podmiňovací způsob: tvar s -l + bych, bys, by, bychom, byste, by.' : `Řekni si nahlas: ${PRON[key]} … (${esc(v.inf)}) – teď.`,
      why:`<div class="steps"><span class="step">${esc(v.inf)}</span><span class="arrow">→</span><span class="step">${cats}</span><span class="arrow">→</span><span class="step" style="color:var(--ok)">${esc(T.join(' / '))}</span></div>${kind==='podm'&&key[1]==='p'&&key[0]!=='3'?`<p>Spisovně <b>${key==='1p'?'bychom':'byste'}</b> – ne „bysme“ ani „by jsme / by jste“.</p>`:''}`,
      stats:[['vtvar',kind]],
      conf:x=> /bysme|by jsme|by jste/.test(x) ? 'vform|bysme' : / sem$/.test(x) ? 'vform|sem' : /aj$/.test(x) ? 'vform|aj' : 'vform|kat',
      weak:'w|'+v.inf+'|'+kind+key, base:L.mode===1?10:L.mode===2?13:16 });
  }
  return out;
}

/* Nádražní hlášení – shoda přísudku s podmětem */
const PS_ANIM_W=['pán','student','kamarád','medvěd','muž','lékař','hasič','rytíř','předseda','hrdina','soudce','vůdce','správce','žena','kuře','prase','zvíře'];
const PS_INAN_W=['hrad','plot','most','stroj','míč','klíč','auto','kolo','lampa','tramvaj','koruna','město','škola'];
const PS_ANIM=[['spal','celé odpoledne'],['čekal','na nádraží'],['zmizel','beze stopy'],['byl','na nádraží už ráno'],['běhal','po nástupišti'],['skákal','radostí']];
const PS_INAN=[['zmizel','beze stopy'],['byl','na nádraží už ráno'],['stál','u kolejí'],['ležel','na nástupišti']];
const PS_SPEC=[{t:'děti',rk:'F',c:'pl',why:'děti → ty děti → koncovka <b>-y</b> (děti si hrály)'},{t:'lidé',rk:'Ma',c:'pl',why:'lidé → ten člověk – mužský životný → <b>-i</b>'},{t:'rodiče',rk:'Ma',c:'pl',why:'rodiče → ten rodič – mužský životný → <b>-i</b>'}];
const PS_END = {sg:{Ma:'',Mi:'',F:'a',N:'o'}, pl:{Ma:'i',Mi:'y',F:'y',N:'a'}};
function psSubj(c, anim){
  const ws=(anim?PS_ANIM_W:PS_INAN_W).filter(w=>{ const k=KBY[w]; return k.f.s[0][0]!==k.f.p[0][0]; });
  const k=KBY[randOf(ws)]; return {t:k.f[c==='sg'?'s':'p'][0][0], rk:VZROD[k.vzor], c, one:k.w, anim};
}
function genPshoda(L){
  const out=[];
  for(let i=0;i<L.count;i++){
    let subj, rk, c, whyS, anim, key;
    if(L.mode===3 && Math.random()<.75){
      const a=psSubj(randOf(['sg','pl']), Math.random()<.5), b=psSubj(randOf(['sg','pl']), Math.random()<.5);
      if(a.one===b.one){ i--; continue; }
      subj=`${a.t} a ${b.t}`; c='pl'; anim=a.anim&&b.anim;
      const rs=[a.rk,b.rk]; rk = rs.includes('Ma') ? 'Ma' : rs.every(r=>r==='N') ? 'N' : 'F';
      whyS=`Podmět je složený (${esc(a.t)} + ${esc(b.t)}) → množné číslo. ${rk==='Ma'?'Je mezi nimi rod mužský životný → <b>-i</b>.':rk==='N'?'Oba jsou rodu středního → <b>-a</b>.':'Není mezi nimi mužský životný a nejsou oba střední → <b>-y</b>.'}`;
      key='slozeny';
    } else if(L.mode>=2 && Math.random()<.2){
      const sp=randOf(PS_SPEC); subj=sp.t; rk=sp.rk; c='pl'; whyS=sp.why; key=rk+c; anim=true;
    } else {
      c = L.mode===1 ? 'pl' : randOf(['sg','pl']);
      anim=Math.random()<.6; const sb=psSubj(c,anim); subj=sb.t; rk=sb.rk;
      whyS=`${esc(sb.t)} → ${ROD[rk[0]].ukaz} ${esc(sb.one)} → ${ROD4[rk].s}, ${CIS[c]} → koncovka <b>${PS_END[c][rk]?'-'+PS_END[c][rk]:'bez koncovky'}</b>`;
      key = c==='sg' ? 'sg' : rk+c;
    }
    const [l,rest]=randOf(anim?PS_ANIM:PS_INAN);
    const ok=l+PS_END[c][rk];
    const endsO = (L.mode===2 || (L.mode===3 && key!=='slozeny')) ? ['', 'a','o','i','y'] : ['i','y','a'];
    const opts=[...new Set(endsO.map(e=>l+e))];
    if(!opts.includes(ok)) opts.push(ok);
    out.push({ sign:subj, w:subj, q:'Doplň správnou koncovku', sub:`<span class="frame">${esc(cap(subj))} <span class="blank">______</span> ${esc(rest)}.</span>`,
      opts:shuffle(opts).map(x=>({v:x, html:esc(x)})), ok:[ok],
      hint:'Urči rod podmětu (ten / ta / to …) a jestli jde o živou bytost. Množné číslo: mužský životný → -i, mužský neživotný a ženský → -y, střední → -a. Jednotné: ten → nic, ta → -a, to → -o.',
      why:`<p>${whyS}</p><div class="steps"><span class="step" style="color:var(--ok)">${esc(cap(subj))} ${esc(ok)} ${esc(rest)}.</span></div>`,
      stats:[['pshoda',key]],
      conf:x=> /[iy]$/.test(x)&&/[iy]$/.test(ok) ? 'pshoda|iy' : 'pshoda|jine', weak:'p|'+key, base:L.mode===1?10:L.mode===2?13:16 });
  }
  return out;
}

const NU=['','jedna','dva','tři','čtyři','pět','šest','sedm','osm','devět'];
const NTEEN=['deset','jedenáct','dvanáct','třináct','čtrnáct','patnáct','šestnáct','sedmnáct','osmnáct','devatenáct'];
const NT=['','','dvacet','třicet','čtyřicet','padesát','šedesát','sedmdesát','osmdesát','devadesát'];
const NO=['','první','druhý','třetí','čtvrtý','pátý','šestý','sedmý','osmý','devátý'];
const NOTEEN=['desátý','jedenáctý','dvanáctý','třináctý','čtrnáctý','patnáctý','šestnáctý','sedmnáctý','osmnáctý','devatenáctý'];
const NOT_=['','','dvacátý','třicátý','čtyřicátý','padesátý','šedesátý','sedmdesátý','osmdesátý','devadesátý'];
function card(n){ if(n>=100) return 'sto'+(n>100?' '+card(n-100):''); if(n<10) return NU[n]; if(n<20) return NTEEN[n-10]; const t=n/10|0,u=n%10; return NT[t]+(u?' '+NU[u]:''); }

const SPELL_T = {'čtrnáct':'čtyrnáct','šestnáct':'šesnáct','patnáct':'pětnáct','šedesát':'šestdesát','sedmnáct':'sedumnáct','osmnáct':'osumnáct','třetí':'třetý'};
function genCslovy(L){
  const out=[];
  for(let i=0;i<L.count;i++){
    let n, ordinal=false;
    if(L.mode===1) n = Math.random()<.6 ? 1+Math.floor(Math.random()*20) : 10*(2+Math.floor(Math.random()*8));
    else if(L.mode===2){ do{ n=21+Math.floor(Math.random()*79); }while(n%10===0); }
    else { ordinal=Math.random()<.55; n = ordinal ? 1+Math.floor(Math.random()*99) : 101+Math.floor(Math.random()*98); }
    const ok = ordinal ? [ord(n), ordAlt(n)].filter(Boolean) : [card(n), cardAlt(n)].filter(Boolean);
    const c=ok[0], traps=new Set();
    Object.entries(SPELL_T).forEach(([a,b])=>{ if(c.includes(a)) traps.add(c.replace(a,b)); });
    if(c.includes(' ')) traps.add(c.replace(/ /g,''));                                         // psaní dohromady
    if(!ordinal && n>20 && n<100 && n%10) traps.add(NU[n%10]+' a '+NT[n/10|0]);                                                  // „tři a padesát“               // rozdělené „sedma čtyřicet“
    if(ordinal && n>20 && n%10) traps.add(NOT_[n/10|0]+' '+NU[n%10]);                       // „dvacátý jedna“
    if(ordinal) traps.add(card(n)); else if(n<=100) traps.add(ord(n));
    const near = ordinal ? ord(Math.min(100,n+1)) : card(n+(n%10===9?-1:1));
    const pool=[...traps].filter(x=>!ok.includes(x));
    const opts=[...new Set([c, ...shuffle(pool), near])].filter((x,j,a)=>x!==undefined).slice(0,4);
    const frame = ordinal ? `${n}. závodník → <span class="blank">______</span> závodník` : `${n} Kč → <span class="blank">______</span>`;
    out.push({ sign: ordinal?`${n}.`:`${n} Kč`, w:String(n), q: ordinal?'Napiš pořadí slovy':'Vyplň šek slovy', sub:`<span class="frame">${frame}</span>`,
      opts:shuffle(opts).map(x=>({v:x, html:esc(x)})), ok,
      hint: ordinal ? 'Řadová číslovka odpovídá na otázku kolikátý? Složenou píšeme zvlášť (dvacátý první), nebo dohromady (jednadvacátý).' : 'Složené číslovky píšeme zvlášť: čtyřicet sedm, sto dvacet tři. Dohromady jen tvar typu sedmačtyřicet. Pozor na pravopis: čtrnáct, šestnáct, šedesát.',
      why:`<p>${ordinal?`${n}.`:n} → <b>${esc(ok.join(' / '))}</b>.${ok.length>1?' Oba tvary jsou správně.':''}</p>${c.includes(' ')?'<p>Složenou číslovku píšeme <b>zvlášť</b> (každé slovo samostatně).</p>':''}`,
      stats:[['cslovy', ordinal?'rad':L.mode===1?'do20':L.mode===2?'do100':'pres100']],
      conf:x=> x===c.replace(/ /g,'') ? 'cw|space' : Object.values(SPELL_T).some(t=>x.includes(t)) ? 'cw|spell' : 'cw|jine', weak:'cw|'+(ordinal?'r':'z')+n, base:L.mode===1?10:L.mode===2?13:16 });

}

function recommend(){
  const C=[], add=(cat,k,label,mission,lv)=>{ const c=pc((S.stats[cat]||{})[k]); if(c.tot>=3) C.push({r:c.first/c.tot,label,mission,lv}); };
  ['M','F','N'].forEach(k=>add('rod',k,`${ROD[k].name} rod`,'Třídírna','Lehká'));
  [['sg','jednotné číslo'],['pl','množné číslo']].forEach(([k,l])=>add('cislo',k,l,'Třídírna','Střední'));
  [['a','životné'],['i','neživotné']].forEach(([k,l])=>add('ziv',k,`mužský rod – ${l}`,'Třídírna','Těžká'));
  [1,2,3,4,5,6,7].forEach(p=>{ const c=pc((S.stats.pad||{})[p]); add('pad',p,`${p}. pád`,'Výslech', c.tot&&c.first/c.tot<.6?'Lehká':'Střední'); });
  Object.keys(VZORY).forEach(v=>add('vzor',v,`vzor ${v}`,'Usvědčení','Lehká'));
  ['tvrde','mekke','privl'].forEach(k=>add('adjdruh',k,`${DRUH[k]} přídavná jména`,'Kartotéka druhů',k==='privl'?'Střední':'Lehká'));
  Object.keys(ROD4).forEach(k=>add('shoda','r'+k,`shoda s rodem ${ROD4[k].s}`,'Shoda','Lehká'));
  add('shodac','pl','shoda v množném čísle','Shoda','Těžká');
  add('hlidka','find','hledání chyb v přídavných jménech','Pravopisná hlídka','Lehká'); add('hlidka','fix','oprava koncovek přídavných jmen','Pravopisná hlídka','Lehká');
  [['osoba','určování osoby'],['cislo','určování čísla'],['zpusob','určování způsobu'],['cas','určování času']].forEach(([k,l])=>add('vcat',k,l,'Jízdní řád','Střední'));
  [['pri','přítomný čas'],['min','minulý čas'],['bud','budoucí čas'],['rozk','rozkazovací způsob'],['podm','podmiňovací způsob']].forEach(([k,l])=>add('vtvar',k,'tvoření: '+l,'Výhybka',['rozk','podm'].includes(k)?'Těžká':'Střední'));
  [['Mapl','shoda podmětu: mužský životný'],['Mipl','shoda podmětu: mužský neživotný'],['Fpl','shoda podmětu: ženský'],['Npl','shoda podmětu: střední'],['slozeny','složený podmět']].forEach(([k,l])=>add('pshoda',k,l,'Nádražní hlášení',k==='slozeny'?'Těžká':'Lehká'));
  Object.keys(ZK).forEach(k=>add('zdruh',k,`zájmena ${ZK[k]}`,'Šuplíky zájmen',['os','pr','uk'].includes(k)?'Lehká':k==='vz'?'Těžká':'Střední'));
  [['mm','mě / mně'],['jj','ji / jí'],['my','mi / my']].forEach(([k,l])=>add('zpast',k,l,'Zájmenné pasti',k==='mm'?'Lehká':'Střední'));
  add('zfind','find','hledání zájmen v textu','Pátrání v textu','Lehká');
  Object.keys(CK).forEach(k=>add('cdruh',k,`číslovky ${CK[k]}`,'Trezor druhů',['zaklad','rad'].includes(k)?'Lehká':'Střední'));
  [['dva','dva / dvě'],['oba','oba / obě'],['tri','tři'],['ctyri','čtyři']].forEach(([k,l])=>add('cskl',k,'skloňování '+l,'Pokladna',['dva'].includes(k)?'Lehká':k==='oba'?'Střední':'Těžká'));
  [['do20','do 20'],['do100','do 100'],['pres100','přes 100'],['rad','řadové']].forEach(([k,l])=>add('cslovy',k,'číslovky slovy '+l,'Šeky slovy',k==='do20'?'Lehká':k==='do100'?'Střední':'Těžká'));
  add('pripad','find','hledání chyb v textu','Velký případ','Lehká'); add('pripad','fix','oprava tvarů v textu','Velký případ','Lehká');
  [1,2,3,4,5,6,7].forEach(p=>add('kov',p,`tvary ve ${p}. pádě`,'Kovárna',p===1?'Střední':'Lehká'));

}

    <div class="pgroup"><h4>Vzory <small>Usvědčení</small></h4>${Object.keys(VZORY).map(v=>skillRow('vzor '+v,(S.stats.vzor||{})[v])).join('')}</div>
    <div class="pgroup"><h4>Pravopis přídavných jmen <small>Pravopisná hlídka</small></h4>${skillRow('najít chybnou koncovku',(S.stats.hlidka||{}).find)}${skillRow('opravit koncovku',(S.stats.hlidka||{}).fix)}</div>
    <div class="pgroup"><h4>Přídavná jména – druhy <small>Kartotéka druhů</small></h4>${['tvrde','mekke','privl'].map(k=>skillRow(DRUH[k],(S.stats.adjdruh||{})[k])).join('')}</div>
    <div class="pgroup"><h4>Přídavná jména – shoda <small>Shoda</small></h4>${Object.keys(ROD4).map(k=>skillRow('s rodem: '+ROD4[k].s,(S.stats.shoda||{})['r'+k])).join('')}
      ${skillRow('jednotné číslo',(S.stats.shodac||{}).sg)}${skillRow('množné číslo',(S.stats.shodac||{}).pl)}
      ${[1,2,3,4,6,7].map(p=>skillRow(`${p}. pád`,(S.stats.shodap||{})[p])).join('')}</div>
    <div class="pgroup"><h4>Slovesa – určování <small>Jízdní řád</small></h4>${[['osoba','osoba'],['cislo','číslo'],['zpusob','způsob'],['cas','čas'],['tvar','určitý / neurčitý tvar'],['kdo','kdo to dělá (zájmeno)']].map(([k,l])=>skillRow(l,(S.stats.vcat||{})[k])).join('')}</div>
    <div class="pgroup"><h4>Slovesa – tvoření tvarů <small>Výhybka</small></h4>${[['pri','přítomný čas'],['min','minulý čas'],['bud','budoucí čas'],['rozk','rozkazovací způsob'],['podm','podmiňovací způsob']].map(([k,l])=>skillRow(l,(S.stats.vtvar||{})[k])).join('')}</div>
    <div class="pgroup"><h4>Shoda přísudku s podmětem <small>Nádražní hlášení</small></h4>${[['sg','jednotné číslo (ten běhal, ta běhala, to běhalo)'],['Mapl','mužský životný (psi běhali)'],['Mipl','mužský neživotný (hrady stály)'],['Fpl','ženský (ženy běhaly)'],['Npl','střední (kuřata běhala)'],['slozeny','složený podmět']].map(([k,l])=>skillRow(l,(S.stats.pshoda||{})[k])).join('')}</div>
    <div class="pgroup"><h4>Zájmena – druhy <small>Šuplíky zájmen, Pátrání v textu</small></h4>${Object.keys(ZK).map(k=>skillRow(ZK[k],(S.stats.zdruh||{})[k])).join('')}${skillRow('najít zájmeno v textu',(S.stats.zfind||{}).find)}</div>
    <div class="pgroup"><h4>Zájmena – pravopis <small>Zájmenné pasti</small></h4>${[['mm','mě / mně'],['jj','ji / jí'],['my','mi / my']].map(([k,l])=>skillRow(l,(S.stats.zpast||{})[k])).join('')}</div>
    <div class="pgroup"><h4>Číslovky <small>Trezor, Pokladna, Šeky</small></h4>${Object.keys(CK).map(k=>skillRow('druh: '+CK[k],(S.stats.cdruh||{})[k])).join('')}
      ${[['dva','skloňování dva / dvě'],['oba','skloňování oba / obě'],['tri','skloňování tři'],['ctyri','skloňování čtyři']].map(([k,l])=>skillRow(l,(S.stats.cskl||{})[k])).join('')}
      ${[['do20','psaní slovy do 20'],['do100','psaní slovy do 100'],['pres100','psaní slovy přes 100'],['rad','řadové číslovky slovy']].map(([k,l])=>skillRow(l,(S.stats.cslovy||{})[k])).join('')}</div>
    <p class="pnote">Stav: <b>✓ zvládá</b> = aspoň 85 % napoprvé · <b>~ procvičuje</b> = 60–85 % · <b>! potřebuje pomoc</b> = pod 60 % · hodnotíme až od 3 pokusů.</p>
    <h3>Na co se zaměřit</h3>
    ${conf.length ? `<div class="pconf">${conf.map(([k,n])=>{ const c=confInfo(k); return `<div class="pci"><b>${c.txt}</b> <span class="pcount">${n}×</span><p>💡 ${c.tip}</p></div>`; }).join('')}</div>` : '<p class="pnote">Zatím žádné opakované záměny. 👍</p>'}
    ${weakW?`<h3>Slova a věty, které dělají potíže</h3><div class="pchips">${weakW}</div>`:''}
    <h3>Poslední případy</h3>
    ${hist?`<div class="ptable"><table><thead><tr><th>Den</th><th>Mise</th><th>Náročnost</th><th>Hvězdy</th><th>Úspěšnost</th><th>Úloh</th></tr></thead><tbody>${hist}</tbody></table></div>`:'<p class="pnote">Zatím žádný dokončený případ.</p>'}
    <h3>Jak modul učí</h3>
    <div class="pdid">
      <p>Dítě se u každé úlohy může <b>samo opravit</b>: po 1. chybě zkouší znovu, po 2. si může vzít nápovědu, po 3. nápovědu dostane (vede k postupu, neprozradí výsledek) a teprve po 4. chybě ukážeme řešení s vysvětlením.</p>
      <p><b>Napoprvé</b> je nejlepší ukazatel skutečného zvládnutí. <b>S pomocí</b> znamená, že se dítě opravilo – i to je učení. <b>Neúspěšně</b> označuje úlohy, u kterých potřebovalo vidět řešení; ty se mu proto vracejí častěji.</p>
      <p>Postup odpovídá škole: rod (ten / ta / to), pád (pádová otázka dosazená do věty), vzor (rod → koncovka 1. pádu → 2. pád).</p>
    </div>
    <div class="actions noprint" style="justify-content:flex-start">
      <button class="btn ghost" data-act="p-pass">Změnit heslo</button>
      <button class="btn ghost" data-act="p-reset">Vynulovat výsledky dítěte</button>
      <button class="btn dark" data-act="p-close">Hotovo</button></div>
    <p class="pnote">Heslo i statistiky zůstávají jen v tomto zařízení a prohlížeči.</p>`);
}

function logTime(){ const g=game; if(!g||!g.start||g.timeLogged) return; g.timeLogged=true; dayLog().min+=Math.min(30,(Date.now()-g.start)/60000); }

/* ══════════════ OVLÁDÁNÍ ══════════════ */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='home') home();
  else if(a==='district') district(b.dataset.id);
  else if(a==='play') startGame(b.dataset.d,b.dataset.m,b.dataset.lv);
  else if(a==='sort') sortAnswer(b.dataset.rod,b.dataset.c,b.dataset.z,b);
  else if(a==='lv'){ S.sel[b.dataset.m]=+b.dataset.lv; save(); const y=window.scrollY; district(b.dataset.d); window.scrollTo(0,y); }
  else if(a==='next') next();
  else if(a==='copt') convictAnswer(b.dataset.v,b);
  else if(a==='fopt') forgeAnswer(b.dataset.v,b);
  else if(a==='popt') pickAnswer(b.dataset.v,b);
  else if(a==='vopt') vAnswer(b.dataset.v,b);
  else if(a==='zw') zTap(b);
  else if(a==='zk') zClassify(b.dataset.v,b);
  else if(a==='vstep'){ game.si++; vStep(); }
  else if(a==='pw') caseTap(b);
  else if(a==='xopt') caseFix(b.dataset.v,b);
  else if(a==='cnext'){ $('#fb').innerHTML=''; if(game&&game.afterFix){ const f=game.afterFix; game.afterFix=null; f(); } }
  else if(a==='tryagain') $('#tryfb').innerHTML='';
  else if(a==='wanthint'){ showHint(); $('#tryfb').innerHTML='<div class="tryagain soft">💡 Nápověda je nahoře. Zkus to znovu.</div>'; }
  else if(a==='cstep'){ game.si++; convictStep(); }
  else if(a==='q') askPick(+b.dataset.p);
  else if(a==='accuse') askAccuse();
  else if(a==='clue') askClue();
  else if(a==='read'){ const s=game.items[game.i]; say(s.t.replace(/[{}\[\]]/g,'')); }
  else if(a==='quit'){ const id=game.d.id; logTime(); save(); game=null; district(id); }
  else if(a==='profile') profile();
  else if(a==='theme') cycleTheme();
  else if(a==='sound'){ S.sound=!S.sound; save(); updateTop(); }
  else if(a==='closeintro'){ S.intro=true; save(); b.closest('.modal').remove(); }
  else if(a==='parent') openParent();
  else if(a&&a.startsWith('p-')) parentAction(a,b);
});
document.addEventListener('keydown',e=>{
  if($('#pmodal')){
    if(e.key==='Escape') closeParent();
    else if(e.key==='Enter'){ const b=$('#pmodal [data-act="p-login"],#pmodal [data-act="p-setup"],#pmodal [data-act="p-forgot-ok"]'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(!game||game.done) return;
  const n=+e.key;
  if(game.m.type==='sort' && !game.answered && n>=1){
    const btn=document.querySelectorAll('.door')[n-1]; if(btn) btn.click();
  } else if(game.m.type==='ask' && !game.answered && n>=1 && n<=7){ const c=document.querySelector(`.qcard[data-p="${n}"]`); if(c&&!c.disabled) askPick(n); }
  else if(game.m.type==='case' && game.phase==='fix' && n>=1){ const o=document.querySelectorAll('#fixpanel .opt')[n-1]; if(o) o.click(); }
  else if(game.m.type==='pfind' && game.phase==='fix' && n>=1){ const o=document.querySelectorAll('#fixpanel .opt')[n-1]; if(o) o.click(); }
  else if(game.m.type==='vsteps' && !game.stepAnswered && n>=1){ const o=document.querySelectorAll('.opt')[n-1]; if(o) o.click(); }
  else if(game.m.type==='pick' && !game.answered && n>=1){ const o=document.querySelectorAll('.opt')[n-1]; if(o) o.click(); }
  else if(game.m.type==='forge' && !game.answered && n>=1){ const o=document.querySelectorAll('.opt')[n-1]; if(o) o.click(); }
  else if(game.m.type==='convict' && !game.stepAnswered && n>=1){ const o=document.querySelectorAll('.opt')[n-1]; if(o) o.click(); }
  else if(e.key==='Enter'){
    const nb=$('[data-act="next"]')||$('[data-act="cstep"]')||$('[data-act="cnext"]')||$('[data-act="vstep"]'); if(nb){ e.preventDefault(); nb.click(); }
    else if(game.m.type==='ask' && game.sel){ e.preventDefault(); askAccuse(); }
  }
});

initTheme(); updateTop(); home();
</script>
</body>
</html>
