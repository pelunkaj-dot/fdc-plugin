name: fdc-guard inject

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**.html']

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inject_guard.py
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Doplnit fdc-guard.js do HTML souborů"
          git push
