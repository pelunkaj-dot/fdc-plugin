name: Test prepositions and demo
on:
  push:
    paths: ['predlozky*', 'tests/predlozky*', '.github/workflows/test-predlozky.yml']
  workflow_dispatch:
jobs:
  prepositions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.56.1 --no-save
      - run: npx playwright install --with-deps chromium
      - run: |
          ln -s . fdc-plugin
          python3 -m http.server 8123 >/tmp/prepositions-server.log 2>&1 &
          node tests/predlozky.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepositions-evidence
          path: test-results/predlozky-*.png
