name: Test times and demo
on:
  push:
    paths: ['times*', 'tests/times*', '.github/workflows/test-times.yml']
  workflow_dispatch:
jobs:
  times:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/times.test.cjs
      - run: npm install playwright@1.56.1 --no-save
      - run: npx playwright install --with-deps chromium
      - run: |
          ln -s . fdc-plugin
          python3 -m http.server 8123 >/tmp/times-server.log 2>&1 &
          node tests/times.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: times-evidence
          path: test-results/times-*.png
