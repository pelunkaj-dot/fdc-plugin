name: Test rovnice
on:
  push:
    paths: ['rovnice*', 'vyrazy-math.js', 'tests/rovnice*', '.github/workflows/test-rovnice.yml']
  workflow_dispatch:
jobs:
  equations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/rovnice.test.cjs
      - run: npm install playwright@1.56.1 --no-save
      - run: npx playwright install --with-deps chromium
      - run: |
          ln -s . fdc-plugin
          python3 -m http.server 8123 >/tmp/rovnice-server.log 2>&1 &
          node tests/rovnice.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rovnice-browser-screenshots
          path: test-results/rovnice-*.png
