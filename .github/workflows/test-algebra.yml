name: Test algebra
on:
  push:
    paths:
      - 'algebra-core.js'
      - 'tests/algebra.test.cjs'
      - '.github/workflows/test-algebra.yml'
  pull_request:
    paths:
      - 'algebra-core.js'
      - 'tests/algebra.test.cjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check algebra-core.js
      - run: node tests/algebra.test.cjs
