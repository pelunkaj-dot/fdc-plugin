name: Test algebra
on:
  push:
    paths: ['algebra-core.js', 'vyrazy*.js', 'tests/algebra.test.cjs', 'tests/vyrazy.state.test.cjs', '.github/workflows/test-algebra.yml']
  pull_request:
    paths: ['algebra-core.js', 'vyrazy*.js', 'tests/algebra.test.cjs']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check algebra-core.js && node --check vyrazy-app.js
      - run: node tests/algebra.test.cjs
      - run: node tests/vyrazy.state.test.cjs
